function exportNoteToPdf(noteId = '') {
  const existing = noteId ? state.notes.find(x => x.id === noteId) : null;
  const title = (document.getElementById('nTitle')?.value || existing?.title || 'Untitled Note').trim() || 'Untitled Note';
  const bodyHtml = sanitizeNoteHtml(document.getElementById('nBody')?.innerHTML ?? existing?.body ?? '');
  const projId = document.getElementById('nProject')?.value ?? existing?.projectId ?? '';
  const taskId = document.getElementById('nTask')?.value ?? existing?.taskId ?? '';
  const rawTags = document.getElementById('nTags')?.value ?? (existing?.tags || []).join(', ');
  const tags = rawTags.split(',').map(x => x.trim().replace(/^#+/, '')).filter(Boolean);
  const proj = projId ? getProject(projId) : null;
  const task = taskId ? getTask(taskId) : null;
  const dateStr = existing?.createdAt
    ? new Date(existing.createdAt).toLocaleDateString()
    : new Date().toLocaleDateString();

  const metaParts = [
    `Date: ${dateStr}`,
    proj ? `Project: ${proj.name}` : '',
    task ? `Task: ${task.title}` : '',
    tags.length ? `Tags: ${tags.map(t => '#' + t).join(' ')}` : ''
  ].filter(Boolean);

  const printHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>${esc(title)}</title>
<style>
  @page { margin: 18mm; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    color: #0f172a;
    background: #ffffff;
    line-height: 1.6;
    font-size: 11pt;
    margin: 0;
    padding: 0;
  }
  h1 {
    font-size: 18pt;
    margin: 0 0 6px 0;
    color: #0f172a;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .meta {
    font-size: 9.5pt;
    color: #475569;
    padding-bottom: 10px;
    margin-bottom: 16px;
    border-bottom: 1px solid #cbd5e1;
  }
  .note-content {
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .note-content h2, .note-content h3 {
    margin: 14px 0 6px 0;
    color: #0f172a;
  }
  .note-content p { margin: 6px 0; }
  .note-content ul, .note-content ol {
    padding-left: 24px;
    margin: 8px 0;
  }
  .note-content li { margin-bottom: 4px; }
  .note-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 9.5pt;
  }
  .note-content th, .note-content td {
    border: 1px solid #cbd5e1;
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
    word-break: break-word;
  }
  .note-content th {
    background: #f1f5f9;
    font-weight: 700;
  }
</style>
</head>
<body>
  <h1>${esc(title)}</h1>
  <div class="meta">${esc(metaParts.join('  •  '))}</div>
  <div class="note-content">${bodyHtml || '<p><em>(No content)</em></p>'}</div>
</body>
</html>`;

  const oldFrame = document.getElementById('notePrintFrame');
  if (oldFrame) oldFrame.remove();

  const iframe = document.createElement('iframe');
  iframe.id = 'notePrintFrame';
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(printHtml);
  doc.close();

  const prevDocTitle = document.title;
  document.title = title;

  setTimeout(() => {
    try {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    } finally {
      setTimeout(() => {
        document.title = prevDocTitle;
        if (iframe.parentNode) iframe.remove();
      }, 1000);
    }
  }, 150);
}

const rteLastCellByEditor = {};

function renderRteToolbar(editorId) {
  return `
    <div class="rte-toolbar">
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="formatRichEditor('${editorId}','bold')" title="Bold"><b>B</b></button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="formatRichEditor('${editorId}','italic')" title="Italic"><i>I</i></button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="formatRichEditor('${editorId}','underline')" title="Underline"><u>U</u></button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="formatRichEditor('${editorId}','heading')" title="Heading"><b>H</b></button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="formatRichEditor('${editorId}','list')" title="Bullet list">• List</button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="formatRichEditor('${editorId}','olist')" title="Numbered list">1. List</button>
      <span class="rte-sep"></span>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="rteInsertTable('${editorId}')" title="Insert a 3×3 table">⊞ Table</button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="rteTableAction('${editorId}','addRow')" title="Add a row below the current cell">+Row</button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="rteTableAction('${editorId}','addCol')" title="Add a column to the right of the current cell">+Col</button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="rteTableAction('${editorId}','delRow')" title="Delete current row">−Row</button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="rteTableAction('${editorId}','delCol')" title="Delete current column">−Col</button>
      <button type="button" class="btn btn-xs" onmousedown="event.preventDefault()" onclick="rteTableAction('${editorId}','toggleHeader')" title="Toggle current row between Header (th) and Normal (td)">Hdr</button>
      <button type="button" class="btn btn-xs btn-ghost" style="color:var(--danger)" onmousedown="event.preventDefault()" onclick="rteTableAction('${editorId}','delTable')" title="Delete the active table">🗑️ Table</button>
    </div>
  `;
}

function formatRichEditor(editorId, type) {
  const editor = document.getElementById(editorId);
  if (!editor) return;
  editor.focus();
  if (type === 'bold') document.execCommand('bold', false, null);
  if (type === 'italic') document.execCommand('italic', false, null);
  if (type === 'underline') document.execCommand('underline', false, null);
  if (type === 'list') document.execCommand('insertUnorderedList', false, null);
  if (type === 'olist') document.execCommand('insertOrderedList', false, null);
  if (type === 'heading') document.execCommand('formatBlock', false, 'h3');
}

function setRteActiveCell(editor, cell) {
  if (!editor) return;
  editor.querySelectorAll('.rte-cell-active').forEach(el => el.classList.remove('rte-cell-active'));
  if (cell && editor.contains(cell)) {
    cell.classList.add('rte-cell-active');
    rteLastCellByEditor[editor.id] = cell;
  } else {
    delete rteLastCellByEditor[editor.id];
  }
}

function getRteActiveCell(editor) {
  if (!editor) return null;
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    let node = sel.anchorNode;
    if (node && node.nodeType === 3) node = node.parentElement;
    if (node && editor.contains(node)) {
      const cell = node.closest('td, th');
      if (cell && editor.contains(cell)) {
        setRteActiveCell(editor, cell);
        return cell;
      }
    }
  }
  const cached = rteLastCellByEditor[editor.id];
  if (cached && editor.contains(cached)) return cached;
  return null;
}

function focusRteCell(editor, cell) {
  if (!editor || !cell) return;
  editor.focus();
  const range = document.createRange();
  range.selectNodeContents(cell);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  setRteActiveCell(editor, cell);
}

function buildHtmlTableFromMatrix(matrix, firstRowHeader = true) {
  const table = document.createElement('table');
  const maxCols = Math.max(1, ...matrix.map(r => r.length));
  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');

  matrix.forEach((rowArr, rIdx) => {
    const tr = document.createElement('tr');
    const isHdr = firstRowHeader && rIdx === 0 && matrix.length > 1;
    for (let c = 0; c < maxCols; c++) {
      const cell = document.createElement(isHdr ? 'th' : 'td');
      const val = rowArr[c] !== undefined ? String(rowArr[c]) : '';
      if (val.trim()) {
        cell.textContent = val;
      } else {
        cell.innerHTML = '<br>';
      }
      tr.appendChild(cell);
    }
    if (isHdr) thead.appendChild(tr);
    else tbody.appendChild(tr);
  });

  if (thead.children.length > 0) table.appendChild(thead);
  if (tbody.children.length > 0) table.appendChild(tbody);
  return table;
}

function insertNodeAtRteCursor(editor, node) {
  editor.focus();
  const sel = window.getSelection();
  let inserted = false;
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    if (editor.contains(range.commonAncestorContainer)) {
      range.deleteContents();
      range.insertNode(node);
      inserted = true;
    }
  }
  if (!inserted) {
    editor.appendChild(node);
  }
  // Ensure there is always a paragraph after a table so the user can type below it
  if (node.tagName === 'TABLE' && (!node.nextSibling || (node.nextSibling.nodeType === 3 && !node.nextSibling.textContent.trim()))) {
    const p = document.createElement('p');
    p.innerHTML = '<br>';
    node.parentNode.insertBefore(p, node.nextSibling);
  }
}

function rteInsertTable(editorId, rows = 3, cols = 3) {
  const editor = document.getElementById(editorId);
  if (!editor) return;
  const matrix = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      row.push(r === 0 ? `Header ${c + 1}` : '');
    }
    matrix.push(row);
  }
  const table = buildHtmlTableFromMatrix(matrix, true);
  // If cursor is currently inside an existing table, insert after that table instead of nesting
  const activeCell = getRteActiveCell(editor);
  if (activeCell) {
    const outerTable = activeCell.closest('table');
    if (outerTable && outerTable.parentNode) {
      outerTable.parentNode.insertBefore(table, outerTable.nextSibling);
      const p = document.createElement('p');
      p.innerHTML = '<br>';
      outerTable.parentNode.insertBefore(p, table.nextSibling);
    }
  } else {
    insertNodeAtRteCursor(editor, table);
  }
  const firstCell = table.querySelector('th, td');
  if (firstCell) focusRteCell(editor, firstCell);
}

function rteTableAction(editorId, action) {
  const editor = document.getElementById(editorId);
  if (!editor) return;
  const cell = getRteActiveCell(editor);
  if (!cell) {
    showToast('Click inside a table cell first');
    return;
  }
  const tr = cell.closest('tr');
  const table = cell.closest('table');
  if (!tr || !table) return;

  const allRows = Array.from(table.querySelectorAll('tr'));
  const rowIndex = allRows.indexOf(tr);
  const colIndex = Array.from(tr.children).indexOf(cell);

  if (action === 'addRow') {
    const colCount = Math.max(1, tr.children.length);
    const newTr = document.createElement('tr');
    for (let i = 0; i < colCount; i++) {
      const td = document.createElement('td');
      td.innerHTML = '<br>';
      newTr.appendChild(td);
    }
    // If adding below a thead row, insert at top of tbody
    if (tr.parentElement && tr.parentElement.tagName === 'THEAD') {
      let tbody = table.querySelector('tbody');
      if (!tbody) {
        tbody = document.createElement('tbody');
        table.appendChild(tbody);
      }
      tbody.insertBefore(newTr, tbody.firstChild);
    } else {
      tr.parentNode.insertBefore(newTr, tr.nextSibling);
    }
    focusRteCell(editor, newTr.children[Math.min(colIndex, newTr.children.length - 1)]);
  } else if (action === 'addCol') {
    allRows.forEach(r => {
      const refCell = r.children[colIndex] || null;
      const isHdrRow = (r.parentElement && r.parentElement.tagName === 'THEAD') || (refCell && refCell.tagName === 'TH');
      const newCell = document.createElement(isHdrRow ? 'th' : 'td');
      newCell.innerHTML = isHdrRow ? 'Header' : '<br>';
      if (refCell) r.insertBefore(newCell, refCell.nextSibling);
      else r.appendChild(newCell);
    });
    const nextCell = tr.children[colIndex + 1];
    if (nextCell) focusRteCell(editor, nextCell);
  } else if (action === 'delRow') {
    if (allRows.length <= 1) {
      table.remove();
      setRteActiveCell(editor, null);
      return;
    }
    const nextRow = allRows[rowIndex + 1] || allRows[rowIndex - 1];
    tr.remove();
    if (nextRow && nextRow.children.length > 0) {
      focusRteCell(editor, nextRow.children[Math.min(colIndex, nextRow.children.length - 1)]);
    }
  } else if (action === 'delCol') {
    const maxCols = Math.max(...allRows.map(r => r.children.length));
    if (maxCols <= 1) {
      table.remove();
      setRteActiveCell(editor, null);
      return;
    }
    allRows.forEach(r => {
      if (r.children[colIndex]) r.children[colIndex].remove();
    });
    const fallback = tr.children[Math.min(colIndex, tr.children.length - 1)];
    if (fallback) focusRteCell(editor, fallback);
  } else if (action === 'toggleHeader') {
    const isCurrentlyHeader = Array.from(tr.children).every(c => c.tagName === 'TH');
    const targetTag = isCurrentlyHeader ? 'td' : 'th';
    Array.from(tr.children).forEach(c => {
      const replacement = document.createElement(targetTag);
      replacement.innerHTML = c.innerHTML;
      if (c.hasAttribute('colspan')) replacement.setAttribute('colspan', c.getAttribute('colspan'));
      if (c.hasAttribute('rowspan')) replacement.setAttribute('rowspan', c.getAttribute('rowspan'));
      tr.replaceChild(replacement, c);
    });
    focusRteCell(editor, tr.children[Math.min(colIndex, tr.children.length - 1)]);
  } else if (action === 'delTable') {
    table.remove();
    setRteActiveCell(editor, null);
  }
}

function parsePlainTabularText(text) {
  if (!text) return null;
  const trimmed = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  if (!trimmed) return null;
  const lines = trimmed.split('\n');

  // 1. Check for Tab-Separated Values (Excel / Google Sheets / SQL / TSV)
  const hasTabs = lines.some(l => l.includes('\t'));
  if (hasTabs) {
    const rows = [];
    let currentRow = [];
    let currentCell = '';
    let inQuotes = false;
    for (let i = 0; i < trimmed.length; i++) {
      const ch = trimmed[i];
      if (ch === '"') {
        if (inQuotes && trimmed[i + 1] === '"') {
          currentCell += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === '\t' && !inQuotes) {
        currentRow.push(currentCell);
        currentCell = '';
      } else if (ch === '\n' && !inQuotes) {
        currentRow.push(currentCell);
        rows.push(currentRow);
        currentRow = [];
        currentCell = '';
      } else {
        currentCell += ch;
      }
    }
    currentRow.push(currentCell);
    rows.push(currentRow);
    const maxCols = Math.max(...rows.map(r => r.length));
    if (maxCols >= 2) return rows;
  }

  // 2. Check for Markdown pipe tables (| Col A | Col B | / | --- | --- |)
  if (lines.length >= 2 && lines[0].includes('|') && /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[1])) {
    const splitPipe = (line) => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    const header = splitPipe(lines[0]);
    if (header.length >= 2) {
      const rows = [header];
      for (let i = 2; i < lines.length; i++) {
        if (!lines[i].trim() || !lines[i].includes('|')) break;
        rows.push(splitPipe(lines[i]));
      }
      return rows;
    }
  }
  return null;
}

function extractMatrixFromHtmlTable(tableEl) {
  const rows = [];
  Array.from(tableEl.querySelectorAll('tr')).forEach(tr => {
    const cells = Array.from(tr.children).filter(c => c.tagName === 'TD' || c.tagName === 'TH');
    if (cells.length > 0) {
      rows.push(cells.map(c => c.textContent.trim()));
    }
  });
  return rows;
}

function pasteMatrixIntoExistingTable(editor, startCell, matrix) {
  const table = startCell.closest('table');
  const startTr = startCell.closest('tr');
  if (!table || !startTr || !matrix || matrix.length === 0) return;

  let allRows = Array.from(table.querySelectorAll('tr'));
  const startRowIdx = allRows.indexOf(startTr);
  const startColIdx = Array.from(startTr.children).indexOf(startCell);
  const pasteCols = Math.max(...matrix.map(r => r.length));
  const neededCols = startColIdx + pasteCols;

  // Ensure enough rows exist
  let tbody = table.querySelector('tbody');
  if (!tbody) {
    tbody = document.createElement('tbody');
    table.appendChild(tbody);
  }
  const currentColCount = Math.max(neededCols, ...allRows.map(r => r.children.length));
  while (allRows.length < startRowIdx + matrix.length) {
    const newTr = document.createElement('tr');
    for (let c = 0; c < currentColCount; c++) {
      const td = document.createElement('td');
      td.innerHTML = '<br>';
      newTr.appendChild(td);
    }
    tbody.appendChild(newTr);
    allRows.push(newTr);
  }

  // Ensure every row has enough columns
  allRows.forEach(r => {
    const isHdr = r.parentElement && r.parentElement.tagName === 'THEAD';
    while (r.children.length < currentColCount) {
      const cell = document.createElement(isHdr ? 'th' : 'td');
      cell.innerHTML = '<br>';
      r.appendChild(cell);
    }
  });

  // Fill matrix values
  let lastTouchedCell = startCell;
  matrix.forEach((rowData, rOffset) => {
    const targetTr = allRows[startRowIdx + rOffset];
    rowData.forEach((val, cOffset) => {
      const targetCell = targetTr.children[startColIdx + cOffset];
      if (targetCell) {
        targetCell.textContent = val;
        lastTouchedCell = targetCell;
      }
    });
  });

  focusRteCell(editor, lastTouchedCell);
}

function initRichEditorTableSupport(editorId) {
  const editor = document.getElementById(editorId);
  if (!editor || editor.dataset.rteTableInit === '1') return;
  editor.dataset.rteTableInit = '1';

  const trackActiveCell = () => {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    let node = sel.anchorNode;
    if (node && node.nodeType === 3) node = node.parentElement;
    if (node && editor.contains(node)) {
      const cell = node.closest('td, th');
      setRteActiveCell(editor, cell && editor.contains(cell) ? cell : null);
    }
  };

  editor.addEventListener('mouseup', trackActiveCell);
  editor.addEventListener('keyup', trackActiveCell);
  editor.addEventListener('click', trackActiveCell);

  // Tab / Shift+Tab navigation inside table cells
  editor.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const cell = getRteActiveCell(editor);
    if (!cell) return;
    const table = cell.closest('table');
    if (!table) return;
    e.preventDefault();
    const cells = Array.from(table.querySelectorAll('th, td'));
    const idx = cells.indexOf(cell);
    if (e.shiftKey) {
      if (idx > 0) focusRteCell(editor, cells[idx - 1]);
    } else {
      if (idx + 1 < cells.length) {
        focusRteCell(editor, cells[idx + 1]);
      } else {
        // Tab on last cell automatically adds a new row
        rteTableAction(editorId, 'addRow');
      }
    }
  });

  // Smart paste for HTML tables (Excel, Sheets, web) and plain-text TSV / Markdown tables
  editor.addEventListener('paste', (e) => {
    const cd = e.clipboardData || window.clipboardData;
    if (!cd) return;
    const htmlData = cd.getData('text/html') || '';
    const plainData = cd.getData('text/plain') || '';
    const activeCell = getRteActiveCell(editor);

    // 1. HTML table on clipboard
    if (/<table[\s>]/i.test(htmlData)) {
      const tmp = document.createElement('div');
      tmp.innerHTML = sanitizeNoteHtml(htmlData);
      const pastedTable = tmp.querySelector('table');
      if (pastedTable) {
        e.preventDefault();
        if (activeCell) {
          const matrix = extractMatrixFromHtmlTable(pastedTable);
          pasteMatrixIntoExistingTable(editor, activeCell, matrix);
          showToast('Pasted tabular data into table');
        } else {
          insertNodeAtRteCursor(editor, pastedTable);
          const firstCell = pastedTable.querySelector('th, td');
          if (firstCell) focusRteCell(editor, firstCell);
          showToast('Table pasted');
        }
        return;
      }
    }

    // 2. Plain-text TSV or Markdown pipe table
    const matrix = parsePlainTabularText(plainData);
    if (matrix && matrix.length > 0) {
      e.preventDefault();
      if (activeCell) {
        pasteMatrixIntoExistingTable(editor, activeCell, matrix);
        showToast('Pasted tabular data into table');
      } else {
        const table = buildHtmlTableFromMatrix(matrix, true);
        insertNodeAtRteCursor(editor, table);
        const firstCell = table.querySelector('th, td');
        if (firstCell) focusRteCell(editor, firstCell);
        showToast('Tabular data pasted as table');
      }
    }
  });
}

function saveNoteForm(e, noteId) {
  e.preventDefault();
  const manualTags = document.getElementById('nTags').value
    .split(',')
    .map(x => x.trim().replace(/^#+/, '').toLowerCase())
    .filter(Boolean);
  const draftTitle = document.getElementById('nTitle').value.trim();
  const draftBody = sanitizeNoteHtml(document.getElementById('nBody').innerHTML);
  const inlineTags = extractHashtagsFromNote({ title: draftTitle, body: draftBody, tags: [] });
  const tags = Array.from(new Set([...manualTags, ...inlineTags]));
  const payload = {
    title: document.getElementById('nTitle').value.trim(),
    projectId: document.getElementById('nProject').value,
    taskId: document.getElementById('nTask').value,
    tags,
    body: sanitizeNoteHtml(document.getElementById('nBody').innerHTML)
  };
  if (noteId) {
    const n = state.notes.find(x => x.id === noteId);
    Object.assign(n, payload);
    showToast('Note updated');
  } else {
    state.notes.unshift({ id: uid('note'), createdAt: new Date().toISOString(), ...payload });
    showToast('Note saved');
  }
  saveState();
  closeModal();
  render();
}

function deleteNote(id) {

  state.notes = state.notes.filter(n => n.id !== id);

  closeModal();
  render();
  showToast('Note deleted');
}

function loadNotesJsonFilePreview(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();

    if (ta) ta.value = e.target.result || '';
  };

}

function normalizeExternalNoteToCadence(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const rawTitle = raw.title ?? raw.name ?? raw.subject ?? raw.heading ?? '';
  const rawBody = raw.body ?? raw.content ?? raw.text ?? raw.markdown ?? raw.note ?? raw.description ?? '';

  const title = String(rawTitle || '').trim() || 'Imported Note';
  let bodyStr = String(rawBody || '').trim();
  if (!bodyStr) return null;

  // Convert plain text / newlines to HTML paragraphs/breaks if not already containing HTML tags
  if (!/<[a-z][\s\S]*>/i.test(bodyStr)) {
    bodyStr = bodyStr
      .split(/\n{2,}/)
      .map(para => `<p>${esc(para).replace(/\n/g, '<br>')}</p>`)
      .join('');
  }
  const cleanBody = sanitizeNoteHtml(bodyStr);

  let tags = [];
  if (Array.isArray(raw.tags)) {
    tags = raw.tags.map(x => String(x || '').trim()).filter(Boolean);
  } else if (Array.isArray(raw.labels)) {
    tags = raw.labels.map(x => String(x || '').trim()).filter(Boolean);
  } else if (typeof raw.tags === 'string') {
    tags = raw.tags.split(',').map(x => x.trim()).filter(Boolean);
  }

  const rawDate = raw.createdAt ?? raw.created_at ?? raw.date ?? raw.created ?? '';
  let createdAt = new Date().toISOString();
  if (rawDate) {
    const parsedDt = new Date(rawDate);
    if (!Number.isNaN(parsedDt.getTime())) createdAt = parsedDt.toISOString();
  }

  const projectId = (raw.projectId && state.projects.some(p => p.id === raw.projectId)) ? raw.projectId : '';
  const taskId = (raw.taskId && state.tasks.some(t => t.id === raw.taskId)) ? raw.taskId : '';

  return {
    id: uid('note'),
    title,
    body: cleanBody,
    projectId,
    taskId,
    tags,
    createdAt
  };
}

function executeImportNotesForm(e) {
  e.preventDefault();
  const rawText = (document.getElementById('notesJsonRaw')?.value || '').trim();
  if (!rawText) return;

  let parsed;
  try {
    parsed = JSON.parse(rawText);
  } catch (err) {
    alert('Invalid JSON syntax. Please check the file or pasted text and try again.');
    return;
  }

  const list = Array.isArray(parsed)
    ? parsed
    : (Array.isArray(parsed?.notes) ? parsed.notes : null);

  if (!list) {
    alert('Expected a JSON array of notes [...] or an object with a "notes": [...] array.');
    return;
  }

  const normalized = list.map(normalizeExternalNoteToCadence).filter(Boolean);
  if (normalized.length === 0) {
    alert('No valid notes with body/content text were found in the JSON.');
    return;
  }

  if (!Array.isArray(state.notes)) state.notes = [];
  // Append/prepend without touching projects, tasks, timeEntries, settings, or existing notes
  state.notes = [...normalized, ...state.notes];
  saveState();
  closeModal();
  render();
  showToast(`Imported ${normalized.length} note${normalized.length > 1 ? 's' : ''} (existing data preserved)`);
}

function getDateRangeBounds(mode, customStart = '', customEnd = '') {
  const now = new Date();
  if (mode === 'today') {
    const t = todayStr();
    return { start: t, end: t };
  }
  if (mode === 'week') {
    const day = now.getDay(); // 0=Sun
    const diffToMon = (day === 0 ? -6 : 1 - day);
    const start = new Date(now);
    start.setDate(now.getDate() + diffToMon);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    return {
      start: formatLocalDate(start),
      end: formatLocalDate(end)
    };
  }
  if (mode === 'month') {
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return {
      start: formatLocalDate(start),
      end: formatLocalDate(end)
    };
  }
  if (mode === 'custom') {
    return {
      start: customStart || addDaysStr(-14),
      end: customEnd || todayStr()
    };
  }
  return { start: '0000-01-01', end: '9999-12-31' };
}

function getWeekBucketForDate(dateStr) {
  const parts = String(dateStr || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return { key: 'unknown', label: 'Unknown Week' };
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  const day = dt.getDay();
  const diffToMon = (day === 0 ? -6 : 1 - day);
  const mon = new Date(dt);
  mon.setDate(dt.getDate() + diffToMon);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  const monStr = formatLocalDate(mon);
  const sunStr = formatLocalDate(sun);
  return { key: monStr, label: `Week of ${monStr} – ${sunStr}` };
}

function getMonthBucketForDate(dateStr) {
  const parts = String(dateStr || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return { key: 'unknown', label: 'Unknown Month' };
  const dt = new Date(parts[0], parts[1] - 1, 1);
  const key = `${parts[0]}-${String(parts[1]).padStart(2, '0')}`;
  const label = dt.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  return { key, label };
}

function formatDateWithWeekday(dateStr) {
  const parts = String(dateStr || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return dateStr || 'Unknown Date';
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  const wd = dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  return `${dateStr} (${wd})`;
}

                    : `<strong>📁 ${esc(proj ? proj.name : 'Unknown Project')}</strong>${entry.taskId ? `<div style="font-size:0.74rem;color:var(--text-muted)">Deleted Task</div>` : ''}`}
                </td>
                <td style="white-space:nowrap;">${typeBadge}</td>
                <td><span class="badge ${entry.billable ? 'b-billable' : 'b-nonbillable'}">${entry.billable ? 'Billable' : 'Non-billable'}</span></td>
                <td style="white-space:nowrap;${durColor}"><strong>${entry.durationSeconds > 0 && isAdj ? '+' : ''}${formatDuration(entry.durationSeconds)}</strong> <span style="font-size:0.75rem;color:var(--text-muted)">(${signedHours})</span></td>
                <td>${esc(entry.note || '')}</td>
                <td style="white-space:nowrap;">
                  ${isBudgeted && !entry.reconciled ? `<button class="btn btn-xs btn-primary" onclick="openReconcileBudgetModal('${entry.id}')" title="Reconcile budgeted vs actual hours and log variance adjustment next month">⚖️ Reconcile</button>` : ''}
                  <button class="btn btn-xs" onclick="openTimeEntryModal('${entry.id}')">Edit</button>
                  <button class="btn btn-xs btn-ghost" style="color:var(--danger)" onclick="deleteTimeEntry('${entry.id}')">Delete</button>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function setTimeRange(mode) {
  state.ui.timeRange = mode;
  state.ui.timeOffset = 0;
  render();
}

function shiftTimeRange(dir) {
  const mode = state.ui.timeRange || 'today';
  if (mode === 'all') return;
  if (mode === 'custom') {
    const b = getTimeTrackerDateBounds();
    const [sy, sm, sd] = b.start.split('-').map(Number);
    const [ey, em, ed] = b.end.split('-').map(Number);
    const sDt = new Date(sy, sm - 1, sd);
    const eDt = new Date(ey, em - 1, ed);
    const spanDays = Math.max(1, Math.round((eDt - sDt) / 86400000) + 1);
    sDt.setDate(sDt.getDate() + dir * spanDays);
    eDt.setDate(eDt.getDate() + dir * spanDays);
    state.ui.timeStart = formatLocalDate(sDt);
    state.ui.timeEnd = formatLocalDate(eDt);
    render();
    return;
  }
  state.ui.timeOffset = Number(state.ui.timeOffset || 0) + dir;
  render();
}

function getTimeTrackerDateBounds() {
  const mode = state.ui.timeRange || 'today';
  const offset = Number(state.ui.timeOffset || 0);
  const now = new Date();
  if (mode === 'today') {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset);
    const dStr = formatLocalDate(d);
    return { start: dStr, end: dStr };
  }
  if (mode === 'week') {
    const day = now.getDay(); // 0=Sun
    const diffToMon = (day === 0 ? -6 : 1 - day) + (offset * 7);
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    return { start: formatLocalDate(start), end: formatLocalDate(end) };
  }
  if (mode === 'month') {
    const start = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    const end = new Date(now.getFullYear(), now.getMonth() + offset + 1, 0);
    return { start: formatLocalDate(start), end: formatLocalDate(end) };
  }
  return getDateRangeBounds(mode, state.ui.timeStart, state.ui.timeEnd);
}

function getTimeTrackerWeekInfoForDate(refDateStr) {
  let ref = new Date();
  if (refDateStr && /^\d{4}-\d{2}-\d{2}$/.test(refDateStr)) {
    const [y, m, d] = refDateStr.split('-').map(Number);
    ref = new Date(y, m - 1, d);
  }
  const day = ref.getDay(); // 0=Sun
  const diffToMon = (day === 0 ? -6 : 1 - day);
  const mon = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() + diffToMon);
  const dates = [];
  const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
    dates.push({
      dateStr: formatLocalDate(d),
      dayName: dayNames[i],
      shortDate: `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
    });
  }
  const start = dates[0].dateStr;
  const end = dates[6].dateStr;
  const fmtOpt = { month: 'short', day: 'numeric' };
  const label = `${mon.toLocaleDateString(undefined, fmtOpt)} – ${new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
  return { start, end, dates, label };
}

function renderTimeWeeklySummary(weekInfo, projFilter, typeFilter = '') {
  const today = todayStr();
  const weekEntries = state.timeEntries
    .map(e => ({ ...e, effectiveDate: getEffectiveTimeEntryDate(e.date) }))
    .filter(e => {
      if (e.effectiveDate < weekInfo.start || e.effectiveDate > weekInfo.end) return false;
      if (projFilter && e.projectId !== projFilter) return false;
      if (typeFilter && getTimeEntryType(e) !== typeFilter) return false;
      return true;
    });

  // Build project x date matrix (rolling Actual + Budgeted + Adjustment into the same project row)
  const projMap = new Map();
  const dayTotals = {};
  const dayBudgetTotals = {};
  weekInfo.dates.forEach(d => {
    dayTotals[d.dateStr] = 0;
    dayBudgetTotals[d.dateStr] = 0;
  });
  let grandTotalSec = 0;
  let grandBudgetSec = 0;

  weekEntries.forEach(e => {
    const pKey = e.projectId || '__unknown__';
    if (!projMap.has(pKey)) {
      const p = getProject(e.projectId);
      const dayMap = {};
      weekInfo.dates.forEach(d => { dayMap[d.dateStr] = { sec: 0, billSec: 0, budgetSec: 0 }; });
      projMap.set(pKey, {
        key: pKey,
        name: p ? p.name : 'Unknown Project',
        days: dayMap,
        totalSec: 0,
        billSec: 0,
        budgetSec: 0
      });
    }
    const row = projMap.get(pKey);
    const dur = e.durationSeconds || 0;
    const isBud = getTimeEntryType(e) === 'budgeted';
    if (row.days[e.effectiveDate]) {
      row.days[e.effectiveDate].sec += dur;
      if (e.billable) row.days[e.effectiveDate].billSec += dur;
      if (isBud) row.days[e.effectiveDate].budgetSec += dur;
    }
    row.totalSec += dur;
    if (e.billable) row.billSec += dur;
    if (isBud) row.budgetSec += dur;
    if (dayTotals[e.effectiveDate] !== undefined) dayTotals[e.effectiveDate] += dur;
    if (isBud && dayBudgetTotals[e.effectiveDate] !== undefined) dayBudgetTotals[e.effectiveDate] += dur;
    grandTotalSec += dur;
    if (isBud) grandBudgetSec += dur;
  });

  const rows = Array.from(projMap.values()).sort((a, b) => b.totalSec - a.totalSec || a.name.localeCompare(b.name));

  return `
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header">
        <div>
          <div class="card-title">📊 Weekly Summary (Projects × Dates)</div>
          <div class="field-hint">${esc(weekInfo.label)}${projFilter ? ` • Filtered to ${esc(getProject(projFilter)?.name || 'Project')}` : ''}${grandBudgetSec > 0 ? ` • <span style="color:var(--budgeted);font-weight:600;">Dotted violet = includes budgeted hours</span>` : ''}</div>
        </div>
        <div style="font-size:0.82rem;color:var(--text-muted);">
          Week Total: <strong style="color:var(--text);">${formatDuration(grandTotalSec)} (${(grandTotalSec / 3600).toFixed(2)}h)</strong>
          ${grandBudgetSec > 0 ? `<span class="badge b-budgeted" style="margin-left:6px;">🔮 ${(grandBudgetSec / 3600).toFixed(2)}h budgeted</span>` : ''}
        </div>
      </div>
      ${rows.length === 0 ? `<div class="empty-state" style="padding:22px 16px;">No time logged for this week${projFilter ? ' and project' : ''}.</div>` : `
        <div class="table-wrap">
          <table class="tt-summary-table">
            <thead>
              <tr>
                <th>Project</th>
                ${weekInfo.dates.map(d => `
                  <th class="${d.dateStr === today ? 'is-today-col' : ''}">
                    <div>${d.dayName}</div>
                    <div style="font-size:0.68rem;font-weight:500;opacity:0.8;">${d.shortDate}</div>
                  </th>
                `).join('')}
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>
                    <strong>📁 ${esc(r.name)}</strong>
                    ${r.budgetSec > 0 ? ` <span class="badge b-budgeted" style="font-size:0.66rem;" title="Includes ${(r.budgetSec / 3600).toFixed(2)}h budgeted">🔮 ${(r.budgetSec / 3600).toFixed(2)}h bud</span>` : ''}
                  </td>
                  ${weekInfo.dates.map(d => {
                    const cell = r.days[d.dateStr];
                    const hasVal = cell && cell.sec !== 0;
                    const hasBud = cell && cell.budgetSec > 0;
                    const actPart = cell ? (cell.sec - cell.budgetSec) : 0;
                    const tip = hasVal
                      ? `${r.name} on ${d.dateStr}: ${formatDuration(cell.sec)} (Actual/Adj: ${(actPart / 3600).toFixed(2)}h, Budgeted: ${(cell.budgetSec / 3600).toFixed(2)}h, Billable: ${(cell.billSec / 3600).toFixed(2)}h)`
                      : '';
                    return `<td class="${d.dateStr === today ? 'is-today-col' : ''}" title="${esc(tip)}">${hasVal ? `<span class="${hasBud ? 'tt-cell-has-budget' : ''}">${(cell.sec / 3600).toFixed(2)}h</span>` : '<span style="color:var(--text-muted);opacity:0.45;">—</span>'}</td>`;
                  }).join('')}
                  <td class="tt-row-total" title="${esc(r.name)}: ${formatDuration(r.totalSec)}">${(r.totalSec / 3600).toFixed(2)}h</td>
                </tr>
              `).join('')}
              <tr class="tt-total-row">
                <td>Daily Total</td>
                ${weekInfo.dates.map(d => {
                  const sec = dayTotals[d.dateStr] || 0;
                  const bSec = dayBudgetTotals[d.dateStr] || 0;
                  return `<td class="${d.dateStr === today ? 'is-today-col' : ''}" title="${d.dateStr}: ${formatDuration(sec)}${bSec > 0 ? ` (incl. ${(bSec/3600).toFixed(2)}h budgeted)` : ''}">${sec !== 0 ? `<span class="${bSec > 0 ? 'tt-cell-has-budget' : ''}">${(sec / 3600).toFixed(2)}h</span>` : '<span style="opacity:0.45;">—</span>'}</td>`;
                }).join('')}
                <td class="tt-row-total" title="Week Grand Total: ${formatDuration(grandTotalSec)}">${(grandTotalSec / 3600).toFixed(2)}h</td>
              </tr>
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

    .filter(e => getTimeEntryType(e) === 'budgeted' && !e.reconciled)
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  if (unreconciled.length === 0) return '';

  const pastOrToday = unreconciled.filter(e => getEffectiveTimeEntryDate(e.date) <= today);
  const upcoming = unreconciled.filter(e => getEffectiveTimeEntryDate(e.date) > today);

  return `
    <div class="reconcile-banner">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div>
          <strong style="font-size:0.9rem;color:var(--budgeted);">🔮 Month-End Budgeted Timesheet Entries (${unreconciled.length} awaiting variance check)</strong>
          <div class="field-hint" style="margin-top:2px;">
            ${pastOrToday.length > 0
              ? `At the start of the new month (or once the budgeted day has passed), reconcile actual hours worked so any variance is logged as an adjustment next month without altering last month's submitted report.`
              : `Scheduled for upcoming month-end days. Once completed, click Reconcile to record any variance adjustment in next month.`}
          </div>
        </div>
      </div>
      ${unreconciled.map(e => {
        const proj = getProject(e.projectId);
        const task = getTask(e.taskId);
        const sub = (task && e.subtaskId) ? (task.subtasks || []).find(s => s.id === e.subtaskId) : null;
        const hrs = ((e.durationSeconds || 0) / 3600).toFixed(2);
        return `
          <div class="reconcile-item-row">
            <div>
              <strong>${esc(e.date)}</strong> • <strong>📁 ${esc(proj ? proj.name : 'Project')}</strong>${task ? ` — ${esc(task.title)}${sub ? ` › ${esc(sub.title)}` : ''}` : ''}
              <span class="badge b-budgeted" style="margin-left:6px;">${hrs}h budgeted</span>
              ${e.note ? `<span style="color:var(--text-muted);font-size:0.78rem;margin-left:6px;">(${esc(e.note)})</span>` : ''}

            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button type="button" class="btn btn-xs btn-success" onclick="confirmExactBudgetMatch('${e.id}')" title="Confirm you worked the exact budgeted ${hrs}h (0 variance)">✓ Exact (${hrs}h)</button>
              <button type="button" class="btn btn-xs btn-primary" onclick="openReconcileBudgetModal('${e.id}')" title="Enter actual hours worked and post variance adjustment to next month">⚖️ Adjust Variance</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderTimeTracker(el) {
  const mode = state.ui.timeRange || 'today';
  const timeOffset = Number(state.ui.timeOffset || 0);
  const bounds = getTimeTrackerDateBounds();
  const today = todayStr();
  const summaryRefDate = (mode === 'all')
    ? today
    : ((mode === 'month' || mode === 'custom') && today >= bounds.start && today <= bounds.end ? today : bounds.start);
  const weekInfo = getTimeTrackerWeekInfoForDate(summaryRefDate);
  const projFilter = state.ui.timeProjectId || '';
  const typeFilter = state.ui.timeEntryType || '';
  const groupBy = state.ui.timeGroupBy || 'none';

  const entries = state.timeEntries
    .map(e => ({ ...e, effectiveDate: getEffectiveTimeEntryDate(e.date) }))
    .filter(e => {
      if (e.effectiveDate < bounds.start || e.effectiveDate > bounds.end) return false;
      if (projFilter && e.projectId !== projFilter) return false;
      if (typeFilter && getTimeEntryType(e) !== typeFilter) return false;
      return true;
    })
    .sort((a, b) => (b.effectiveDate || '').localeCompare(a.effectiveDate || ''));

  const totalSec = entries.reduce((s, e) => s + (e.durationSeconds || 0), 0);
  const billSec = entries.filter(e => e.billable).reduce((s, e) => s + (e.durationSeconds || 0), 0);
  const nonBillSec = totalSec - billSec;
  const budgetedSec = entries.filter(e => getTimeEntryType(e) === 'budgeted').reduce((s, e) => s + (e.durationSeconds || 0), 0);

  const rangeHint = mode === 'all'
    ? 'All recorded dates'
    : (mode === 'today' ? bounds.start : `${bounds.start} to ${bounds.end}`);

  let bodyHtml = '';
  if (entries.length === 0) {
    bodyHtml = `<div class="empty-state">No time entries match your filters. Try switching the date range or project filter, or log a new entry above.</div>`;
  } else if (groupBy === 'none') {
    bodyHtml = renderTimeEntriesTable(entries);
  } else {
    const groupsMap = new Map();
    entries.forEach(entry => {
      let key = '';
      let label = '';
      if (groupBy === 'project') {
        const p = getProject(entry.projectId);
        key = entry.projectId || '__unknown__';
        label = `📁 ${p ? p.name : 'Unknown Project'}`;
      } else if (groupBy === 'date') {
        key = entry.effectiveDate || 'unknown';
        label = `📅 ${formatDateWithWeekday(key)}`;
      } else if (groupBy === 'week') {
        const wb = getWeekBucketForDate(entry.effectiveDate);
        key = wb.key;
        label = `🗓️ ${wb.label}`;
      } else if (groupBy === 'month') {
        const mb = getMonthBucketForDate(entry.effectiveDate);
        key = mb.key;
        label = `📆 ${mb.label}`;
      }
      if (!groupsMap.has(key)) {
        groupsMap.set(key, { key, label, items: [], totalSec: 0, billSec: 0, budgetSec: 0 });
      }
      const grp = groupsMap.get(key);
      grp.items.push(entry);
      grp.totalSec += (entry.durationSeconds || 0);
      if (entry.billable) grp.billSec += (entry.durationSeconds || 0);
      if (getTimeEntryType(entry) === 'budgeted') grp.budgetSec += (entry.durationSeconds || 0);
    });

    const groups = Array.from(groupsMap.values());
    if (groupBy === 'project') {
      groups.sort((a, b) => b.totalSec - a.totalSec || a.label.localeCompare(b.label));
    } else {
      groups.sort((a, b) => b.key.localeCompare(a.key));
    }

    bodyHtml = groups.map(g => {
      const gNonBill = g.totalSec - g.billSec;
      return `
        <div class="time-group-card">
          <div class="time-group-header">
            <strong>${esc(g.label)}</strong>
            <div class="time-group-meta">
              <span class="badge b-todo">${g.items.length} ${g.items.length === 1 ? 'entry' : 'entries'}</span>
              ${g.budgetSec > 0 ? `<span class="badge b-budgeted">🔮 Budgeted: ${(g.budgetSec / 3600).toFixed(2)}h</span>` : ''}
              <span class="badge b-billable">Billable: ${(g.billSec / 3600).toFixed(2)}h</span>
              ${gNonBill !== 0 ? `<span class="badge b-nonbillable">Non-billable: ${(gNonBill / 3600).toFixed(2)}h</span>` : ''}
              <strong style="color:var(--text);">Total: ${formatDuration(g.totalSec)} (${(g.totalSec / 3600).toFixed(2)}h)</strong>
            </div>
          </div>
          ${renderTimeEntriesTable(g.items)}
        </div>
      `;
    }).join('');
  }

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <p class="helper-banner" style="margin:0;">Start a live timer, log actual time, or capture <strong>Budgeted</strong> hours for month-end timesheet submissions.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" style="border-color:var(--budgeted);color:var(--budgeted);" onclick="openMonthEndBudgetModal()" title="Quickly plan budgeted hours across remaining weekdays of the month">🔮 Plan Month-End Budget</button>
        <button class="btn btn-primary" onclick="openTimeEntryModal()">+ Add Manual Time Entry</button>
      </div>
    </div>

    ${renderUnreconciledBudgetsBanner()}

    <div class="card" style="margin-bottom:16px;padding:12px 14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <div style="display:inline-flex;gap:4px;align-items:center;">
            <button type="button" class="btn btn-sm" onclick="shiftTimeRange(-1)" ${mode === 'all' ? 'disabled' : ''} title="${mode === 'today' ? 'Previous day' : (mode === 'week' ? 'Previous week' : (mode === 'month' ? 'Previous month' : (mode === 'custom' ? 'Previous range' : 'Not applicable for All Time')))}">&lt;</button>
            <button type="button" class="btn btn-sm" onclick="shiftTimeRange(1)" ${mode === 'all' ? 'disabled' : ''} title="${mode === 'today' ? 'Next day' : (mode === 'week' ? 'Next week' : (mode === 'month' ? 'Next month' : (mode === 'custom' ? 'Next range' : 'Not applicable for All Time')))}">&gt;</button>
          </div>
          <div class="tab-switch">
            <button class="tab-btn ${mode === 'today' ? 'active' : ''}" onclick="setTimeRange('today')">Today</button>
            <button class="tab-btn ${mode === 'week' ? 'active' : ''}" onclick="setTimeRange('week')">This Week</button>
            <button class="tab-btn ${mode === 'month' ? 'active' : ''}" onclick="setTimeRange('month')">This Month</button>
            <button class="tab-btn ${mode === 'all' ? 'active' : ''}" onclick="setTimeRange('all')">All Time</button>
            <button class="tab-btn ${mode === 'custom' ? 'active' : ''}" onclick="setTimeRange('custom')">Custom</button>
          </div>
          ${mode === 'custom' ? `
            <input type="date" style="width:auto;" value="${bounds.start}" onchange="state.ui.timeStart=this.value;render()" />
            <span style="font-size:0.82rem;color:var(--text-muted)">to</span>
            <input type="date" style="width:auto;" value="${bounds.end}" onchange="state.ui.timeEnd=this.value;render()" />
          ` : `<span style="font-size:0.8rem;color:var(--text-muted);">${esc(rangeHint)}</span>`}
        </div>

        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <select style="width:auto;min-width:140px;padding:6px 9px;font-size:0.82rem;" onchange="state.ui.timeEntryType=this.value;render()" title="Filter by Actual vs Budgeted vs Adjustments">
            <option value="" ${!typeFilter ? 'selected' : ''}>All Types</option>
            <option value="actual" ${typeFilter === 'actual' ? 'selected' : ''}>⏱️ Actual Only</option>
            <option value="budgeted" ${typeFilter === 'budgeted' ? 'selected' : ''}>🔮 Budgeted Only</option>
            <option value="adjustment" ${typeFilter === 'adjustment' ? 'selected' : ''}>⚖️ Variance Adj Only</option>
          </select>
          <select style="width:auto;min-width:160px;max-width:230px;padding:6px 9px;font-size:0.82rem;" onchange="state.ui.timeProjectId=this.value;render()" title="Filter time entries by Project">
            <option value="">All Projects</option>
            ${state.projects.map(p => `<option value="${p.id}" ${projFilter === p.id ? 'selected' : ''}>📁 ${esc(p.name)}</option>`).join('')}
          </select>
          <select style="width:auto;min-width:155px;padding:6px 9px;font-size:0.82rem;" onchange="state.ui.timeGroupBy=this.value;render()" title="Group logged time entries">
            <option value="none" ${groupBy === 'none' ? 'selected' : ''}>Group: None</option>
            <option value="project" ${groupBy === 'project' ? 'selected' : ''}>Group by: Project</option>
            <option value="date" ${groupBy === 'date' ? 'selected' : ''}>Group by: Date</option>
            <option value="week" ${groupBy === 'week' ? 'selected' : ''}>Group by: Week</option>
            <option value="month" ${groupBy === 'month' ? 'selected' : ''}>Group by: Month</option>
          </select>
          ${(projFilter || typeFilter || groupBy !== 'none' || mode !== 'today' || timeOffset !== 0) ? `<button type="button" class="btn btn-xs btn-ghost" onclick="state.ui.timeRange='today';state.ui.timeOffset=0;state.ui.timeProjectId='';state.ui.timeEntryType='';state.ui.timeGroupBy='none';render()">Reset</button>` : ''}
        </div>
      </div>
    </div>

    ${renderTimeWeeklySummary(weekInfo, projFilter, typeFilter)}

    <div class="card">
      <div class="card-header">
        <div class="card-title">Logged Time Entries (${entries.length})</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:0.8rem;">
          ${budgetedSec > 0 ? `<span class="badge b-budgeted">🔮 Budgeted: ${(budgetedSec / 3600).toFixed(2)}h</span>` : ''}
          <span class="badge b-billable">Billable: ${(billSec / 3600).toFixed(2)}h</span>
          <span class="badge b-nonbillable">Non-billable: ${(nonBillSec / 3600).toFixed(2)}h</span>
          <strong>Total: ${formatDuration(totalSec)} (${(totalSec / 3600).toFixed(2)}h)</strong>
        </div>
      </div>
      ${bodyHtml}
    </div>
  `;
}

function openTimeEntryModal(entryId = null, defaultType = 'actual') {
  if (state.projects.length === 0) {
    alert('Create a project first before logging time.');
    return;
  }
  const e = entryId ? state.timeEntries.find(x => x.id === entryId) : null;
  const rawSec = e ? (e.durationSeconds || 0) : 1800;
  const isNeg = rawSec < 0;
  const absSec = Math.abs(rawSec);
  const hrs = e ? Math.floor(absSec / 3600) : 0;
  const mins = e ? Math.round((absSec % 3600) / 60) : 30;
  const currentType = e ? getTimeEntryType(e) : (defaultType || 'actual');
  const isProjectOnly = Boolean(e && !e.taskId);
  const defaultTaskId = e ? (e.taskId || '') : (state.tasks[0]?.id || '');
  const defaultProjId = e ? (e.projectId || getTask(e.taskId)?.projectId || '') : (getTask(defaultTaskId)?.projectId || getDefaultProject()?.id || state.projects[0]?.id || '');

  openModal(`
    <div class="modal-header">
      <h3>${e ? 'Edit Time Entry' : 'Add Manual Time Entry'}</h3>
      <button class="btn btn-xs btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <form onsubmit="saveTimeEntryForm(event, '${e ? e.id : ''}')">
      <div class="form-row">
        <div class="form-group">
          <label>Entry Type *</label>
          <select id="teEntryType" onchange="onTimeEntryTypeChange(this.value)">
            <option value="actual" ${currentType === 'actual' ? 'selected' : ''}>⏱️ Actual Time</option>
            <option value="budgeted" ${currentType === 'budgeted' ? 'selected' : ''}>🔮 Budgeted (Month-End Timesheet)</option>
            ${currentType === 'adjustment' ? `<option value="adjustment" selected>⚖️ Variance Adjustment (Next Month)</option>` : ''}
          </select>
        </div>
        <div class="form-group">
          <label>Date *</label>
          <input type="date" id="teDate" required value="${esc(e?.date || todayStr())}" />
        </div>
      </div>
      <div id="teBudgetHint" class="field-hint" style="margin:-6px 0 12px;padding:7px 10px;border-radius:7px;background:var(--budgeted-soft);color:var(--budgeted);display:${currentType === 'budgeted' ? 'block' : 'none'};">
        🔮 <strong>Budgeted mode:</strong> Appears under the same project in Reports in violet, and can be reconciled at the start of next month if actual hours differ.
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Project *</label>
          <select id="teProject" required onchange="onTimeProjectChange(this.value)">
            ${state.projects.filter(p => !p.archived || p.id === defaultProjId).map(p => `<option value="${p.id}" ${defaultProjId === p.id ? 'selected' : ''}>📁 ${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Task (optional for Budgeted)</label>
          <select id="teTask" onchange="onTimeTaskChange(this.value)">
            <option value="" ${isProjectOnly || !defaultTaskId ? 'selected' : ''}>None (Project-level)</option>
            ${state.tasks.map(t => {
              const p = getProject(t.projectId);
              return `<option value="${t.id}" ${defaultTaskId === t.id ? 'selected' : ''}>${esc(p ? p.name : '')} — ${esc(t.title)}</option>`;
            }).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Subtask (optional)</label>
          <select id="teSubtask"></select>
        </div>
        <div class="form-group">
          <label>Billable?</label>
          <select id="teBillable">
            <option value="true" ${e?.billable ? 'selected' : ''}>Billable</option>
            <option value="false" ${e && !e.billable ? 'selected' : ''}>Non-billable</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>${isNeg ? 'Hours (Negative Adjustment)' : 'Hours'}</label>
          <input type="number" id="teHours" min="0" value="${hrs}" />
        </div>
        <div class="form-group">
          <label>${isNeg ? 'Minutes (Negative Adjustment)' : 'Minutes'}</label>
          <input type="number" id="teMins" min="0" max="59" value="${mins}" />
        </div>
      </div>
      <input type="hidden" id="teSign" value="${isNeg ? '-1' : '1'}" />
      <div class="form-group">
        <label>Note / Planned Work Description</label>
        <input type="text" id="teNote" value="${esc(e?.note || '')}" placeholder="What did you work on (or plan to work on for budgeted)?" />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Time Entry</button>
      </div>
    </form>
  `);
  onTimeTaskChange(defaultTaskId, e?.subtaskId || '', e ? e.billable : null);
}

function onTimeEntryTypeChange(val) {
  const hint = document.getElementById('teBudgetHint');
  if (hint) hint.style.display = val === 'budgeted' ? 'block' : 'none';
}

function onTimeProjectChange(projId) {
  const p = getProject(projId);
  const taskSel = document.getElementById('teTask');
  if (taskSel && taskSel.value) {
    const curTask = getTask(taskSel.value);
    if (curTask && curTask.projectId !== projId) {
      taskSel.value = '';
      onTimeTaskChange('', '', null);
    }
  }
  const billSel = document.getElementById('teBillable');
  if (billSel && p) {
    billSel.value = p.billable ? 'true' : 'false';
  }
}

function onTimeTaskChange(taskId, selectedSubId = '', forceBillable = null) {
  const t = taskId ? getTask(taskId) : null;
  if (t) {
    const projSel = document.getElementById('teProject');
    if (projSel && t.projectId) projSel.value = t.projectId;
  }
  const subSel = document.getElementById('teSubtask');
  if (subSel) {
    const subs = t?.subtasks || [];
    subSel.innerHTML = `<option value="">None (parent task)</option>` + subs.map(s =>
      `<option value="${s.id}" ${selectedSubId === s.id ? 'selected' : ''}>${esc(s.title)}</option>`
    ).join('');
  }
  const billSel = document.getElementById('teBillable');
  if (billSel && forceBillable === null) {
    if (t) {
      billSel.value = isTaskBillable(t) ? 'true' : 'false';
    } else {
      const p = getProject(document.getElementById('teProject')?.value || '');
      if (p) billSel.value = p.billable ? 'true' : 'false';
    }
  }
}

function saveTimeEntryForm(ev, entryId) {
  ev.preventDefault();
  const taskId = document.getElementById('teTask').value || '';
  const subtaskId = taskId ? (document.getElementById('teSubtask').value || null) : null;
  const task = taskId ? getTask(taskId) : null;
  const projId = task ? task.projectId : (document.getElementById('teProject')?.value || '');
  const entryType = document.getElementById('teEntryType')?.value || 'actual';
  const sign = Number(document.getElementById('teSign')?.value || 1) < 0 ? -1 : 1;
  const hrs = Number(document.getElementById('teHours').value || 0);
  const mins = Number(document.getElementById('teMins').value || 0);
  const absSec = Math.round(hrs * 3600 + mins * 60);
  if (absSec <= 0) {
    alert('Please enter a duration greater than 0.');
    return;
  }
  const totalSec = sign * absSec;
  const payload = {
    projectId: projId,
    taskId,
    subtaskId,
    entryType,
    billable: document.getElementById('teBillable').value === 'true',
    date: getEffectiveTimeEntryDate(document.getElementById('teDate').value),
    durationSeconds: totalSec,
    note: document.getElementById('teNote').value.trim()
  };

  if (entryId) {
    const existing = state.timeEntries.find(x => x.id === entryId);
    Object.assign(existing, payload);
    showToast('Time entry updated');
  } else {
    state.timeEntries.unshift({
      id: uid('time'),
      ...(entryType === 'budgeted' ? { reconciled: false } : {}),
      ...payload
    });
    showToast(entryType === 'budgeted' ? '🔮 Budgeted entry added' : 'Time entry added');
  }
  saveState();
  closeModal();
  render();
}

function deleteTimeEntry(id) {
  if (!confirm('Delete this time entry?')) return;
  state.timeEntries = state.timeEntries.filter(e => e.id !== id);
  saveState();
  render();
  showToast('Time entry deleted');
}

// Month-End Budget Planner (Compact 1-Line Weekly Summary Matrix: Projects x Dates)
let tempBudgetMatrix = {
  dates: [], // ['2026-11-26', '2026-11-27', '2026-11-30']
  rows: []   // [{ projectId, hoursByDate: { '2026-11-26': 3.5 } }]
};

function formatMatrixDateHeader(dateStr) {
  const parts = String(dateStr || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return { dayName: '', shortDate: dateStr };
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  return {
    dayName: dayNames[dt.getDay()],
    shortDate: `${String(parts[1]).padStart(2, '0')}-${String(parts[2]).padStart(2, '0')}`
  };
}

function getExistingHoursMapForDates(dateList) {
  const dateSet = new Set(dateList);
  const actualByProjDate = {};
  const existingBudByProjDate = {};
  const actualDayTotals = {};
  const existingBudDayTotals = {};
  dateList.forEach(d => {
    actualDayTotals[d] = 0;
    existingBudDayTotals[d] = 0;
  });

  state.timeEntries.forEach(e => {
    const effDate = getEffectiveTimeEntryDate(e.date);
    if (!dateSet.has(effDate)) return;
    const pId = e.projectId || '__unknown__';
    const hrs = (e.durationSeconds || 0) / 3600;
    const eType = getTimeEntryType(e);
    if (eType === 'budgeted') {
      if (!existingBudByProjDate[pId]) existingBudByProjDate[pId] = {};
      existingBudByProjDate[pId][effDate] = (existingBudByProjDate[pId][effDate] || 0) + hrs;
      existingBudDayTotals[effDate] = (existingBudDayTotals[effDate] || 0) + hrs;
    } else {
      if (!actualByProjDate[pId]) actualByProjDate[pId] = {};
      actualByProjDate[pId][effDate] = (actualByProjDate[pId][effDate] || 0) + hrs;
      actualDayTotals[effDate] = (actualDayTotals[effDate] || 0) + hrs;
    }
  });

  return { actualByProjDate, existingBudByProjDate, actualDayTotals, existingBudDayTotals };
}

function openMonthEndBudgetModal() {
  if (state.projects.length === 0) {
    alert('Create a project first before planning budgeted time.');
    return;
  }
  const today = todayStr();
  const remWeekdays = getRemainingMonthWeekdays(today);
  const seedDates = remWeekdays.length > 0 ? remWeekdays : [getEffectiveTimeEntryDate(today)];

  const { actualByProjDate, existingBudByProjDate, actualDayTotals, existingBudDayTotals } = getExistingHoursMapForDates(seedDates);

  const defProj = getDefaultProject();
  const defProjId = defProj ? defProj.id : (state.projects.find(p => !p.archived)?.id || state.projects[0]?.id || '');

  const projIdsSet = new Set();
  Object.keys(actualByProjDate).forEach(pid => { if (pid !== '__unknown__' && getProject(pid)) projIdsSet.add(pid); });
  Object.keys(existingBudByProjDate).forEach(pid => { if (pid !== '__unknown__' && getProject(pid)) projIdsSet.add(pid); });
  if (defProjId) projIdsSet.add(defProjId);
  if (projIdsSet.size === 0 && state.projects[0]) projIdsSet.add(state.projects[0].id);

  const orderedProjIds = Array.from(projIdsSet).sort((a, b) => {
    if (a === defProjId) return -1;
    if (b === defProjId) return 1;
    return (getProject(a)?.name || '').localeCompare(getProject(b)?.name || '');
  });

  const rows = orderedProjIds.map((pid, idx) => {
    const hoursByDate = {};
    seedDates.forEach(dStr => {
      if (idx === 0) {
        const alreadyCommitted = (actualDayTotals[dStr] || 0) + (existingBudDayTotals[dStr] || 0);
        hoursByDate[dStr] = Math.max(0, Math.round((8 - alreadyCommitted) * 4) / 4);
      } else {
        hoursByDate[dStr] = 0;
      }
    });
    return { projectId: pid, hoursByDate };
  });

  tempBudgetMatrix = { dates: seedDates, rows };

  openModal(`
    <div class="modal-header">
      <h3>🔮 Plan Month-End Budget</h3>
      <button class="btn btn-xs btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <form onsubmit="saveMonthEndBudgetForm(event)">
      <div id="monthEndBudgetMatrixWrap"></div>
      <div class="modal-footer" style="justify-content:space-between;flex-wrap:wrap;">
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button type="button" class="btn btn-xs" onclick="autoFillBudgetRemainingTo8h()" title="Top up any day below 8.00h on the first project row">⚡ Top Up to 8.00h</button>
          <button type="button" class="btn btn-xs btn-ghost" onclick="clearBudgetMatrixInputs()" title="Reset all budgeted inputs to 0">Clear</button>
        </div>
        <div style="display:flex;gap:8px;">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">🔮 Save Budgeted</button>
        </div>
      </div>
    </form>
  `, { wideContent: true });

  renderMonthEndBudgetMatrix();
}

function addProjectToBudgetMatrix(projectId = '') {
  const sel = document.getElementById('budgetAddProjectSelect');
  const chosenProjId = projectId || sel?.value || '';
  if (!chosenProjId) return;
  if (tempBudgetMatrix.rows.some(r => r.projectId === chosenProjId)) {
    showToast('Project is already in the table');
    return;
  }
  const hoursByDate = {};
  tempBudgetMatrix.dates.forEach(d => { hoursByDate[d] = 0; });
  tempBudgetMatrix.rows.push({ projectId: chosenProjId, hoursByDate });
  renderMonthEndBudgetMatrix();
}

function removeBudgetMatrixRow(rowIdx) {
  if (tempBudgetMatrix.rows.length <= 1) return;
  tempBudgetMatrix.rows.splice(rowIdx, 1);
  renderMonthEndBudgetMatrix();
}

function addDateToBudgetMatrix() {
  const inp = document.getElementById('budgetAddDateInput');
  const rawDate = inp?.value || '';
  if (!rawDate) return;
  const effDate = getEffectiveTimeEntryDate(rawDate);
  if (tempBudgetMatrix.dates.includes(effDate)) {
    showToast(`${effDate} is already in the table`);
    return;
  }
  tempBudgetMatrix.dates.push(effDate);
  tempBudgetMatrix.dates.sort();
  tempBudgetMatrix.rows.forEach(r => {
    if (r.hoursByDate[effDate] === undefined) r.hoursByDate[effDate] = 0;
  });
  renderMonthEndBudgetMatrix();
}

function removeDateFromBudgetMatrix(dateStr) {
  if (tempBudgetMatrix.dates.length <= 1) return;
  tempBudgetMatrix.dates = tempBudgetMatrix.dates.filter(d => d !== dateStr);
  tempBudgetMatrix.rows.forEach(r => { delete r.hoursByDate[dateStr]; });
  renderMonthEndBudgetMatrix();
}

function onBudgetMatrixRowProjectChange(rowIdx, newProjId) {
  const row = tempBudgetMatrix.rows[rowIdx];
  if (!row) return;
  row.projectId = newProjId;
  renderMonthEndBudgetMatrix();
}

function onBudgetMatrixCellInput(rowIdx, dateStr, val) {
  const row = tempBudgetMatrix.rows[rowIdx];
  if (!row) return;
  row.hoursByDate[dateStr] = Math.max(0, Number(val || 0));
  updateBudgetMatrixTotalsOnly();
}

function autoFillBudgetRemainingTo8h() {
  if (tempBudgetMatrix.rows.length === 0) return;
  const { actualDayTotals, existingBudDayTotals } = getExistingHoursMapForDates(tempBudgetMatrix.dates);
  tempBudgetMatrix.dates.forEach(dStr => {
    const otherRowsBud = tempBudgetMatrix.rows.slice(1).reduce((s, r) => s + Number(r.hoursByDate[dStr] || 0), 0);
    const already = (actualDayTotals[dStr] || 0) + (existingBudDayTotals[dStr] || 0) + otherRowsBud;
    tempBudgetMatrix.rows[0].hoursByDate[dStr] = Math.max(0, Math.round((8 - already) * 4) / 4);
  });
  renderMonthEndBudgetMatrix();
}

function clearBudgetMatrixInputs() {
  tempBudgetMatrix.rows.forEach(r => {
    tempBudgetMatrix.dates.forEach(d => { r.hoursByDate[d] = 0; });
  });
  renderMonthEndBudgetMatrix();
}

function updateBudgetMatrixTotalsOnly() {
  const dates = tempBudgetMatrix.dates;
  const rows = tempBudgetMatrix.rows;
  const { actualByProjDate, existingBudByProjDate, actualDayTotals, existingBudDayTotals } = getExistingHoursMapForDates(dates);

  const firstRowForProj = {};
  rows.forEach((r, idx) => {
    if (firstRowForProj[r.projectId] === undefined) firstRowForProj[r.projectId] = idx;
  });

  rows.forEach((r, idx) => {
    const rowTotalEl = document.getElementById(`bmRowTotal_${idx}`);
    if (!rowTotalEl) return;
    let newBudSum = 0;
    let actSum = 0;
    let exBudSum = 0;
    dates.forEach(d => {
      newBudSum += Number(r.hoursByDate[d] || 0);
      if (firstRowForProj[r.projectId] === idx) {
        actSum += (actualByProjDate[r.projectId]?.[d] || 0);
        exBudSum += (existingBudByProjDate[r.projectId]?.[d] || 0);
      }
    });
    const combined = actSum + exBudSum + newBudSum;
    rowTotalEl.textContent = `${combined.toFixed(2)}h`;
    rowTotalEl.title = `Total: ${combined.toFixed(2)}h (${actSum.toFixed(2)}h actual + ${(exBudSum + newBudSum).toFixed(2)}h budgeted)`;
  });

  let grandCombined = 0;
  let grandAct = 0;
  let grandBud = 0;

  dates.forEach(d => {
    const actDay = actualDayTotals[d] || 0;
    const exBudDay = existingBudDayTotals[d] || 0;
    const newBudDay = rows.reduce((s, r) => s + Number(r.hoursByDate[d] || 0), 0);
    const totalBudDay = exBudDay + newBudDay;
    const combinedDay = actDay + totalBudDay;

    grandAct += actDay;
    grandBud += totalBudDay;
    grandCombined += combinedDay;

    const dayTotalEl = document.getElementById(`bmDayTotal_${d}`);
    if (dayTotalEl) {
      const color = Math.abs(combinedDay - 8) < 0.01
        ? 'color:var(--success);'
        : (combinedDay > 8 ? 'color:var(--warning);' : 'color:var(--text);');
      dayTotalEl.innerHTML = `<span style="${color}">${combinedDay.toFixed(2)}h</span>`;
      dayTotalEl.title = `${d}: ${combinedDay.toFixed(2)}h total (${actDay.toFixed(2)}h actual + ${totalBudDay.toFixed(2)}h budgeted)`;
    }
  });

  const grandEl = document.getElementById('bmGrandTotal');
  if (grandEl) {
    grandEl.textContent = `${grandCombined.toFixed(2)}h`;
    grandEl.title = `Grand Total: ${grandCombined.toFixed(2)}h (${grandAct.toFixed(2)}h actual + ${grandBud.toFixed(2)}h budgeted)`;
  }
}

                        ${exBudHrs > 0 ? `<span class="budget-existing-pill" title="${exBudHrs.toFixed(2)}h budgeted already saved on ${d}">🔮${exBudHrs.toFixed(2)}+</span>` : ''}
                        <input type="number" class="budget-hrs-input" min="0" max="24" step="0.25"

          <tr class="tt-total-row">

function updateReconcilePreview(budSec) {
  const prev = document.getElementById('recVariancePreview');
  if (!prev) return;
  const h = Number(document.getElementById('recActHours')?.value || 0);
  const m = Number(document.getElementById('recActMins')?.value || 0);
  const actSec = Math.round(h * 3600 + m * 60);
  const diffSec = actSec - budSec;
  const diffHrs = (diffSec / 3600).toFixed(2);
  if (diffSec === 0) {
    prev.innerHTML = `<span style="color:var(--success);font-weight:700;">✓ Exact Match (0.00h variance):</span> Marks budgeted entry reconciled with no adjustment needed.`;
  } else if (diffSec > 0) {
    prev.innerHTML = `<span style="color:var(--info);font-weight:700;">➕ Under-budgeted by +${formatDuration(diffSec)} (+${diffHrs}h):</span> Logs a <strong>+${diffHrs}h Variance Adjustment</strong> entry on the selected next-month date under the same project.`;
  } else {
    prev.innerHTML = `<span style="color:var(--danger);font-weight:700;">➖ Over-budgeted by ${formatDuration(diffSec)} (${diffHrs}h):</span> Logs a <strong>${diffHrs}h Variance Adjustment</strong> entry on the selected next-month date under the same project.`;
  }
}

function executeReconcileBudget(e, entryId) {
  e.preventDefault();
  const entry = state.timeEntries.find(x => x.id === entryId);
  if (!entry) return;
  const budSec = Math.abs(entry.durationSeconds || 0);
  const h = Number(document.getElementById('recActHours')?.value || 0);
  const m = Number(document.getElementById('recActMins')?.value || 0);
  const actSec = Math.round(h * 3600 + m * 60);
  const diffSec = actSec - budSec;
  const adjDate = getEffectiveTimeEntryDate(document.getElementById('recAdjDate')?.value || getFirstWorkingDayOfNextMonth(entry.date));
  const customNote = (document.getElementById('recAdjNote')?.value || '').trim();

  entry.reconciled = true;
  entry.reconciledActualSeconds = actSec;
  entry.reconciledDate = adjDate;

  if (diffSec !== 0) {
    const signStr = diffSec > 0 ? '+' : '';
    const autoNote = `Variance true-up for ${entry.date} (${(budSec / 3600).toFixed(2)}h budgeted vs ${(actSec / 3600).toFixed(2)}h actual; ${signStr}${(diffSec / 3600).toFixed(2)}h)`;
    state.timeEntries.unshift({
      id: uid('time'),
      projectId: entry.projectId,
      taskId: entry.taskId,
      subtaskId: entry.subtaskId || null,
      entryType: 'adjustment',
      sourceBudgetId: entry.id,
      billable: entry.billable,
      date: adjDate,
      durationSeconds: diffSec,
      note: customNote || autoNote
    });
    showToast(`⚖️ Logged ${signStr}${(diffSec / 3600).toFixed(2)}h variance adjustment on ${adjDate}`);
  } else {
    showToast('✓ Budgeted entry reconciled (0.00h variance)');
  }

  saveState();
  closeModal();
  render();
}
