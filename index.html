<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<title>Cadence — Personal Work Manager</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #eef2ff;
    --success: #10b981;
    --success-soft: #ecfdf5;
    --warning: #f59e0b;
    --warning-soft: #fffbeb;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --info: #0ea5e9;
    --info-soft: #f0f9ff;
    --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.12);
    --search-hl-bg: #fef08a;
    --search-hl-text: #713f12;
    --search-hl-border: rgba(202, 138, 4, 0.35);
    --budgeted: #8b5cf6;
    --budgeted-soft: rgba(139, 92, 246, 0.14);
    --radius: 10px;
    --sidebar-w: 250px;
  }

  [data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #0f172a;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --primary: #6366f1;
    --primary-hover: #818cf8;
    --primary-soft: rgba(99, 102, 241, 0.18);
    --success: #34d399;
    --success-soft: rgba(16, 185, 129, 0.15);
    --warning: #fbbf24;
    --warning-soft: rgba(245, 158, 11, 0.15);
    --danger: #f87171;
    --danger-soft: rgba(239, 68, 68, 0.15);
    --info: #38bdf8;
    --info-soft: rgba(14, 165, 233, 0.15);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.45);
    --search-hl-bg: rgba(250, 204, 21, 0.28);
    --search-hl-text: #fef08a;
    --search-hl-border: rgba(250, 204, 21, 0.45);
    --budgeted: #a78bfa;
    --budgeted-soft: rgba(167, 139, 250, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 40;
    transition: transform 0.2s ease;
  }
  .sidebar-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text);
  }
  .brand-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 0.95rem;
  }
  .nav-list {
    padding: 12px 10px;
    flex: 1;
    overflow-y: auto;
  }
  .nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.94rem;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    margin-bottom: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .nav-badge {
    margin-left: auto;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .sidebar-footer {
    padding: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .storage-notice {
    font-size: 0.74rem;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 8px 10px;
    border-radius: 8px;
    line-height: 1.35;
  }
  .sidebar-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  /* Main wrapper */
  .main-wrap {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* Topbar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .menu-btn {
    display: none;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .page-title { font-size: 1.25rem; font-weight: 700; }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* Active Timer Banner */
  .active-timer-pill {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .active-timer-pill.visible { display: inline-flex; }
  .pulse-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* Content */
  .content {
    padding: 24px;
    max-width: 1360px;
    width: 100%;
    margin: 0 auto;
  }
  .helper-banner {
    font-size: 0.86rem;
    color: var(--text-muted);
    margin-bottom: 18px;
  }

  /* Cards & Grids */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .card-title { font-size: 1.02rem; font-weight: 700; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .kpi-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-value { font-size: 1.65rem; font-weight: 800; margin-top: 4px; }
  .kpi-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { opacity: 0.9; }
  .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
  .btn-sm { padding: 5px 10px; font-size: 0.78rem; }
  .btn-xs { padding: 3px 7px; font-size: 0.73rem; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }

  /* Inputs */
  .form-group { margin-bottom: 14px; }
  .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .form-row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--text);
  }
  .field-hint {
    font-size: 0.74rem;
    color: var(--text-muted);
    margin-top: 3px;
  }
  input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="url"], select, textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.88rem;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--primary);
    outline-offset: -1px;
  }
  textarea { resize: vertical; min-height: 75px; }

  /* Badges & Pills */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.73rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .b-todo { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
  .b-progress { background: var(--info-soft); color: var(--info); }
  .b-blocked { background: var(--danger-soft); color: var(--danger); }
  .b-done { background: var(--success-soft); color: var(--success); }
  .b-high { background: var(--danger-soft); color: var(--danger); }
  .b-medium { background: var(--warning-soft); color: var(--warning); }
  .b-low { background: var(--success-soft); color: var(--success); }
  .b-cat { background: var(--primary-soft); color: var(--primary); }
  .b-billable { background: var(--success-soft); color: var(--success); }
  .b-nonbillable { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
  .b-warn { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning); }

  /* Filter bar */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }
  .filter-bar input, .filter-bar select {
    width: auto;
    min-width: 135px;
    flex: 1 1 135px;
    max-width: 220px;
  }

  /* Task items */
  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .task-item:hover { border-color: var(--primary); }
  .task-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .task-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .task-title { font-weight: 700; font-size: 0.96rem; }
  .task-title.done { text-decoration: line-through; color: var(--text-muted); }
  .task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .task-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* Progress bar */
  .progress-wrap {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-track {
    flex: 1;
    height: 7px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    max-width: 240px;
  }
  .progress-fill {
    height: 100%;
    background: var(--success);
    border-radius: 999px;
    transition: width 0.2s;
  }
  .progress-text { font-size: 0.76rem; color: var(--text-muted); font-weight: 600; }

  .task-actions-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
  }

  /* Subtasks list inside task */
  .subtasks-box {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .subtask-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 7px;
    padding: 8px 10px;
    border-radius: 7px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    margin-bottom: 7px;
    font-size: 0.84rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .subtask-row:hover { border-color: var(--primary); }
  .subtask-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .subtask-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .subtask-actions-left {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .subtask-tags-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  /* Kanban Board */
  .kanban-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(230px, 1fr));
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .kanban-col {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    min-height: 360px;
    display: flex;
    flex-direction: column;
  }
  .kanban-col.drag-over {
    border: 2px dashed var(--primary);
    background: var(--primary-soft);
  }
  .kanban-col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .kanban-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px;
    margin-bottom: 9px;
    cursor: grab;
    box-shadow: var(--shadow);
  }
  .kanban-card:active { cursor: grabbing; }

  /* Stages list in project modal */
  .stage-chip-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  /* Rich text toolbar for Notes */
  
  
  /* Google Keep-style Masonry Notes Grid & Hashtag Chips */
  .keep-masonry-grid {
    column-count: 3;
    column-gap: 16px;
  }
  @media (max-width: 1100px) {
    .keep-masonry-grid { column-count: 2; }
  }
  @media (max-width: 700px) {
    .keep-masonry-grid { column-count: 1; }
  }
  .keep-note-card {
    display: inline-block;
    width: 100%;
    margin-bottom: 16px;
    break-inside: avoid;
    page-break-inside: avoid;
    vertical-align: top;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .keep-note-card:hover {
    border-color: var(--primary);
  }
  .keep-note-card .card-title {
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .hashtag-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.74rem;
    font-weight: 600;
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid rgba(79, 70, 229, 0.22);
    cursor: pointer;
    transition: all 0.14s ease;
  }
  .hashtag-chip:hover {
    background: var(--primary);
    color: #fff;
  }
  .hashtag-chip.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 0 0 2px var(--primary-soft);
  }
  .hashtag-filter-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }

  .import-notes-box {
    background: var(--surface-2);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    font-size: 0.82rem;
  }

  .rte-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    padding: 6px 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
  }
  .rte-sep {
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 2px;
  }
  .rte-editor {
    min-height: 150px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 0 0 8px 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.92rem;
    outline: none;
    overflow-y: auto;
    overflow-x: auto;
  }
  .rte-editor.desc-editor {
    min-height: 190px;
  }
  .rte-editor ol { padding-left: 22px; margin: 6px 0; }
  .rte-rendered { display: inline; }
  div.rte-rendered, .note-body {
    display: block;
    overflow-x: auto;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .rte-rendered ul, .rte-rendered ol,
  .note-body ul, .note-body ol {
    padding-left: 22px;
    margin: 6px 0;
  }
  .note-body li { margin-bottom: 3px; }
  .note-body p { margin: 4px 0; }
  .rte-rendered p { margin: 4px 0; }
  .rte-rendered h3 { margin: 6px 0 3px; font-size: 1rem; }
  .rte-editor:focus { border-color: var(--primary); }
  .rte-editor ul { padding-left: 22px; margin: 6px 0; }
  .rte-editor h3 { margin: 8px 0 4px; font-size: 1.05rem; }
  .rte-editor table, .rte-rendered table, .note-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 0.84rem;
    background: var(--surface);
  }
  .rte-editor th, .rte-editor td,
  .rte-rendered th, .rte-rendered td,
  .note-body th, .note-body td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    vertical-align: top;
    text-align: left;
    min-width: 48px;
    text-transform: none;
    letter-spacing: normal;
    font-size: 0.84rem;
    color: var(--text);
  }
  .rte-editor th, .rte-rendered th, .note-body th {
    background: var(--surface-2);
    font-weight: 700;
  }
  .rte-editor td.rte-cell-active, .rte-editor th.rte-cell-active {
    outline: 2px solid var(--primary);
    outline-offset: -2px;
    background: var(--primary-soft);
  }

  /* Time Tracker Weekly Summary Matrix */
  .tt-week-nav {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px 6px;
  }
  .tt-week-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text);
    padding: 0 4px;
    white-space: nowrap;
  }
  .tt-summary-table th, .tt-summary-table td {
    text-align: right;
    padding: 8px 10px;
    white-space: nowrap;
  }
  .tt-summary-table th:first-child, .tt-summary-table td:first-child {
    text-align: left;
    white-space: normal;
    min-width: 160px;
  }
  .tt-summary-table th.is-today-col, .tt-summary-table td.is-today-col {
    background: var(--primary-soft);
  }
  .tt-summary-table tr.tt-total-row td {
    font-weight: 800;
    background: var(--surface-2);
    border-top: 2px solid var(--border);
    border-bottom: none;
  }
  .tt-summary-table td.tt-row-total {
    font-weight: 800;
    background: var(--surface-2);
    border-left: 1px solid var(--border);
  }
  .tt-summary-table tr.tt-total-row td.tt-row-total {
    color: var(--primary);
  }

  /* Time Tracker Groups */
  .time-group-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    background: var(--surface);
  }
  .time-group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .time-group-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  th {
    font-size: 0.76rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    background: var(--surface-2);
  }

  /* Charts */
  .bar-row {
    margin-bottom: 10px;
  }
  .bar-row-top {
    display: flex;
    justify-content: space-between;
    font-size: 0.84rem;
    margin-bottom: 4px;
  }
  .bar-track {
    height: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--primary);
  }
  .day-chart {
    overflow-x: auto;
    padding-top: 6px;
  }
  .day-chart-inner {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    min-width: 100%;
    width: max-content;
    padding: 26px 8px 0 42px;
    box-sizing: border-box;
  }
  .day-guide-line {
    position: absolute;
    left: 0;
    right: 0;
    border-top: 1.5px dashed var(--warning);
    pointer-events: none;
    z-index: 2;
  }
  .day-guide-label {
    position: absolute;
    left: 0;
    top: -10px;
    font-size: 0.66rem;
    font-weight: 700;
    color: var(--warning);
    background: var(--surface);
    padding: 0 4px 0 0;
    line-height: 1.2;
  }
  .day-col {
    flex: 1 0 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
    z-index: 3;
  }
  .day-bar-slot {
    height: 164px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .day-bar {
    width: 26px;
    flex-shrink: 0;
    border-radius: 6px 6px 0 0;
    min-height: 2px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: var(--border);
    transition: height 0.2s;
  }
  .day-bar-nonbill {
    width: 100%;
    background: var(--text-muted);
    opacity: 0.45;
  }
  .day-bar-bill {
    width: 100%;
    background: var(--success);
  }
  .day-bar-budget {
    width: 100%;
    background: repeating-linear-gradient(
      -45deg,
      var(--budgeted),
      var(--budgeted) 4px,
      rgba(255, 255, 255, 0.28) 4px,
      rgba(255, 255, 255, 0.28) 7px
    );
  }
  .bar-track-dual {
    height: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    display: flex;
  }
  .bar-fill-budget {
    height: 100%;
    background: repeating-linear-gradient(
      -45deg,
      var(--budgeted),
      var(--budgeted) 5px,
      rgba(255, 255, 255, 0.26) 5px,
      rgba(255, 255, 255, 0.26) 9px
    );
  }
  .b-budgeted {
    background: var(--budgeted-soft);
    color: var(--budgeted);
    border: 1px dashed var(--budgeted);
  }
  .b-adjustment {
    background: var(--warning-soft);
    color: var(--warning);
    border: 1px solid rgba(245, 158, 11, 0.35);
  }
  tr.tt-row-budgeted {
    background: var(--budgeted-soft);
  }
  .tt-cell-has-budget {
    text-decoration: underline dotted var(--budgeted);
    text-underline-offset: 3px;
  }
  .reconcile-banner {
    background: var(--budgeted-soft);
    border: 1px solid var(--budgeted);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .budget-matrix-table th, .budget-matrix-table td {
    padding: 6px 8px;
    vertical-align: middle;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .budget-matrix-table th {
    text-align: center;
  }
  .budget-matrix-table th:first-child, .budget-matrix-table td:first-child {
    text-align: left;
    min-width: 210px;
    max-width: 280px;
  }
  .budget-matrix-table th:last-child, .budget-matrix-table td:last-child {
    text-align: right;
    min-width: 86px;
    background: var(--surface-2);
    border-left: 1px solid var(--border);
  }
  .budget-matrix-cell {
    min-width: 105px;
    text-align: center;
  }
  .budget-matrix-cell.is-today-col, .budget-matrix-table th.is-today-col {
    background: var(--primary-soft);
  }
  .budget-cell-inline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
  }
  .budget-act-pill {
    display: inline-block;
    font-size: 0.71rem;
    font-weight: 700;
    color: var(--success);
    background: var(--success-soft);
    border-radius: 999px;
    padding: 1px 6px;
    white-space: nowrap;
  }
  .budget-existing-pill {
    display: inline-block;
    font-size: 0.69rem;
    font-weight: 700;
    color: var(--budgeted);
    background: var(--budgeted-soft);
    border-radius: 999px;
    padding: 1px 5px;
    white-space: nowrap;
  }
  .budget-hrs-input {
    width: 64px !important;
    text-align: right;
    padding: 4px 6px !important;
    font-size: 0.84rem !important;
    font-weight: 700;
    border-color: rgba(139, 92, 246, 0.45) !important;
  }
  .budget-hrs-input:focus {
    outline: 2px solid var(--budgeted) !important;
  }
  .reconcile-item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 7px 10px;
    margin-top: 6px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 0.83rem;
  }
  .day-legend {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.74rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .day-legend-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .day-val { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 3px; white-space: nowrap; font-weight: 600; }
  .day-lbl { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; height: 16px; line-height: 16px; white-space: nowrap; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    padding: 22px;
  }
  .modal.modal-wide-content {
    max-width: calc(min(1360px, 100vw - var(--sidebar-w)) - 48px);
  }
  .modal.modal-note-editor {
    display: flex;
    flex-direction: column;
    max-height: 90vh;
    overflow: hidden;
  }
  .modal.modal-note-editor .modal-header {
    flex-shrink: 0;
    margin-bottom: 12px;
  }
  .modal.modal-note-editor .note-modal-form {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .modal.modal-note-editor .note-modal-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }
  .modal.modal-note-editor .rte-toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .modal.modal-note-editor .rte-editor {
    min-height: 240px;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .modal.modal-note-editor .modal-footer {
    flex-shrink: 0;
    margin-top: 12px;
    background: var(--surface);
  }
  @media (max-width: 900px) {
    .modal.modal-wide-content {
      max-width: calc(100vw - 32px);
    }
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .modal-subtask-grid-wrap {
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .modal-subtask-grid-row {
    display: grid;
    grid-template-columns: auto auto minmax(160px, 1.4fr) minmax(170px, 1.5fr) minmax(125px, 1fr) auto auto;
    gap: 7px;
    align-items: center;
    margin-bottom: 6px;
    padding: 5px 7px;
    border-radius: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.12s, background 0.12s;
  }
  .modal-subtask-grid-row.drag-over {
    border: 2px dashed var(--primary);
    background: var(--primary-soft);
  }
  .modal-subtask-grid-row.is-done-row {
    opacity: 0.85;
  }
  .modal-subtask-grid-row.is-done-row .st-grid-title-input {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .st-drag-handle {
    cursor: grab;
    color: var(--text-muted);
    font-size: 0.88rem;
    padding: 2px 4px;
    user-select: none;
  }
  .st-drag-handle:active { cursor: grabbing; }
  .modal-subtask-grid-row input {
    padding: 6px 8px;
    font-size: 0.82rem;
  }
  @media (max-width: 720px) {
    .modal-subtask-grid-row {
      grid-template-columns: 1fr;
    }
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--text);
    color: var(--surface);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 0.86rem;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .empty-state {
    text-align: center;
    padding: 36px 20px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .tab-switch {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 3px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 35;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .main-wrap { margin-left: 0; }
    .menu-btn { display: inline-flex; }
    .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .form-row, .form-row-3 { grid-template-columns: 1fr; }
  }

  
  /* Calendar Styles */
  .cal-layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    gap: 16px;
    align-items: start;
  }
  .cal-tray {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    max-height: 76vh;
    overflow-y: auto;
  }
  .cal-tray-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 9px;
    margin-bottom: 7px;
    font-size: 0.8rem;
    cursor: grab;
  }
  .cal-tray-item:active { cursor: grabbing; }
  .cal-tray-item:hover { border-color: var(--primary); }

  .cal-month-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .cal-day-header {
    padding: 8px 6px;
    text-align: center;
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }
  .cal-cell {
    min-height: 112px;
    padding: 6px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: background 0.12s;
  }
  .cal-cell.other-month { background: var(--surface-2); opacity: 0.6; }
  .cal-cell.is-today { background: var(--primary-soft); }
  .cal-cell.drag-over { outline: 2px dashed var(--primary); outline-offset: -2px; background: var(--primary-soft); }
  .cal-date-num {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
  }
  .cal-cell.is-today .cal-date-num { color: var(--primary); }

  .cal-pill {
    font-size: 0.72rem;
    padding: 3px 6px;
    border-radius: 5px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .cal-pill[draggable="true"] { cursor: grab; }
  .cal-pill.pill-planned { background: var(--primary-soft); color: var(--primary); border-color: rgba(79,70,229,0.25); }
  .cal-pill.pill-subtask { background: var(--info-soft); color: var(--info); border-color: rgba(14,165,233,0.25); }
  .cal-pill.pill-due { background: var(--warning-soft); color: var(--warning); border-color: rgba(245,158,11,0.3); }
  .cal-pill.pill-time { background: var(--success-soft); color: var(--success); }
  .cal-pill.pill-ics { background: var(--surface-2); color: var(--text); border-color: var(--border); }

  /* Week & Day Time Grid */
  .cal-time-grid-wrap {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .cal-time-grid {
    display: grid;
    min-width: 720px;
  }
  .cal-time-grid.week-cols { grid-template-columns: 64px repeat(7, minmax(95px, 1fr)); }
  .cal-time-grid.day-cols { grid-template-columns: 64px 1fr; min-width: 320px; }
  .cal-hour-label {
    padding: 6px;
    font-size: 0.72rem;
    color: var(--text-muted);
    text-align: right;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .cal-hour-slot {
    min-height: 48px;
    padding: 3px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cal-hour-slot.drag-over { background: var(--primary-soft); outline: 2px dashed var(--primary); outline-offset: -2px; }
  .cal-allday-slot {
    min-height: 44px;
    padding: 4px;
    border-right: 1px solid var(--border);
    border-bottom: 2px solid var(--border);
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cal-allday-slot.drag-over { background: var(--primary-soft); outline: 2px dashed var(--primary); outline-offset: -2px; }

  @media (max-width: 900px) {
    .cal-layout { grid-template-columns: 1fr; }
    .cal-tray { max-height: 240px; }
  }

  
  /* Phase 3 Polish: Quick-Add & Shortcuts */
  .quick-add-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    align-items: center;
  }
  .quick-add-bar input[type="text"] {
    flex: 2 1 220px;
    margin: 0;
  }
  .quick-add-bar select {
    flex: 1 1 150px;
    max-width: 220px;
    margin: 0;
  }
  kbd {
    display: inline-block;
    padding: 2px 7px;
    font-size: 0.78rem;
    font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    box-shadow: 0 1px 0 var(--border);
  }
  .shortcut-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .shortcut-row:last-child { border-bottom: none; }

  
  /* Phase 4: Integration Action Chips & Learning Bar */
  .integration-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
  }
  .btn-int {
    padding: 3px 9px;
    font-size: 0.74rem;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    transition: all 0.15s;
  }
  .btn-int:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-soft);
  }
  .learning-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--info);
    background: var(--info-soft);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .learning-mini-track {
    width: 48px;
    height: 5px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    display: inline-block;
  }
  .learning-mini-fill {
    height: 100%;
    background: var(--info);
  }

  
  /* Day View Proportional Timeline & Resize Handle */
  .cal-day-timeline {
    display: grid;
    grid-template-columns: 64px 1fr;
    position: relative;
    max-height: calc(100vh - 280px);
    min-height: 360px;
    overflow-y: auto;
  }
  .cal-day-hours-col {
    display: flex;
    flex-direction: column;
  }
  .cal-day-hour-cell {
    padding: 3px 6px;
    font-size: 0.72rem;
    color: var(--text-muted);
    text-align: right;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    box-sizing: border-box;
    line-height: 1.2;
  }
  .cal-day-hour-cell.is-subhour {
    font-size: 0.65rem;
    opacity: 0.78;
    border-bottom-style: dashed;
  }
  .cal-day-events-col {
    position: relative;
    background: var(--surface);
  }
  .cal-day-bg-slot {
    border-bottom: 1px solid var(--border);
    box-sizing: border-box;
    position: relative;
  }
  .cal-day-bg-slot.is-subhour {
    border-bottom: 1px dashed var(--border);
  }
  .cal-zoom-float {
    position: fixed;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 70;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cal-zoom-fab {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font-size: 0.9rem;
    line-height: 1;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .cal-zoom-fab:hover, .cal-zoom-fab.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary);
  }
  .cal-zoom-fab-lbl {
    font-size: 0.62rem;
    font-weight: 800;

const VALID_VIEWS = ['today', 'projects', 'tasks', 'assignees', 'calendar', 'notes', 'time', 'reports', 'settings'];
const IDB_NAME = 'WorkFlowManagerDB';
const IDB_STORE = 'appState';
const IDB_KEY = 'main';

function openAppDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGetState() {
  const db = await openAppDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbSetState(data) {
  const db = await openAppDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(data, IDB_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function uid(prefix = 'id') {

function formatLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}


function normalizeWeekendDateToMonday(dateStr) {
  if (!dateStr) return dateStr;
  const parts = String(dateStr).trim().split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return dateStr;
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  const day = dt.getDay(); // 0 = Sun, 6 = Sat
  if (day === 6) {
    dt.setDate(dt.getDate() + 2);
  } else if (day === 0) {
    dt.setDate(dt.getDate() + 1);
  } else {
    return dateStr;
  }
  return formatLocalDate(dt);
}

function getEffectiveTimeEntryDate(dateStr) {
  return normalizeWeekendDateToMonday(dateStr || todayStr());
}

function todayStr() {
  return formatLocalDate(new Date());
}

function addDaysStr(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// ===================== HELPERS =====================
function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escapeRegExp(str) {
  return String(str || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightSearchInContainer(containerEl, query) {
  if (!containerEl) return;
  const q = String(query || '').trim();
  if (!q) return;
  const re = new RegExp(escapeRegExp(q), 'gi');
  const skipTags = new Set(['SCRIPT', 'STYLE', 'INPUT', 'TEXTAREA', 'SELECT', 'OPTION', 'BUTTON', 'MARK']);

  const walker = document.createTreeWalker(containerEl, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      let p = node.parentNode;
      while (p && p !== containerEl) {
        if (p.nodeType === 1 && skipTags.has(p.tagName)) return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  const textNodes = [];
  let cur;
  while ((cur = walker.nextNode())) textNodes.push(cur);

  textNodes.forEach(node => {
    const text = node.nodeValue;
    re.lastIndex = 0;
    if (!re.test(text)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let lastIdx = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > lastIdx) {
        frag.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
      }
      const mark = document.createElement('mark');
      mark.className = 'search-hl';
      mark.textContent = m[0];
      frag.appendChild(mark);
      lastIdx = m.index + m[0].length;
      if (m[0].length === 0) break;
    }
    if (lastIdx < text.length) {
      frag.appendChild(document.createTextNode(text.slice(lastIdx)));
    }
    if (node.parentNode) node.parentNode.replaceChild(frag, node);
  });
}

function sanitizeNoteHtml(html) {
  const div = document.createElement('div');
  div.innerHTML = html || '';
  const allowed = new Set([
    'B', 'STRONG', 'I', 'EM', 'U', 'H3', 'H2', 'UL', 'OL', 'LI', 'P', 'BR', 'DIV', 'SPAN',
    'TABLE', 'THEAD', 'TBODY', 'TFOOT', 'TR', 'TH', 'TD'
  ]);
  const dropCompletely = new Set(['SCRIPT', 'STYLE', 'META', 'LINK', 'TITLE', 'COLGROUP', 'COL', 'HEAD']);
  function walk(node) {
    for (let i = node.childNodes.length - 1; i >= 0; i--) {
      const child = node.childNodes[i];
      if (child.nodeType === 1) {
        if (dropCompletely.has(child.tagName)) {
          node.removeChild(child);
        } else if (!allowed.has(child.tagName)) {
          const text = document.createTextNode(child.textContent);
          node.replaceChild(text, child);
        } else {
          const keepColspan = (child.tagName === 'TD' || child.tagName === 'TH') ? parseInt(child.getAttribute('colspan'), 10) : NaN;
          const keepRowspan = (child.tagName === 'TD' || child.tagName === 'TH') ? parseInt(child.getAttribute('rowspan'), 10) : NaN;
          while (child.attributes.length > 0) child.removeAttribute(child.attributes[0].name);
          if (keepColspan > 1 && keepColspan <= 50) child.setAttribute('colspan', String(keepColspan));
          if (keepRowspan > 1 && keepRowspan <= 200) child.setAttribute('rowspan', String(keepRowspan));
          walk(child);
        }
      }
    }
  }
  walk(div);
  return div.innerHTML;
}

function isTaskPlanned(task) {

  return Boolean((task.plannedDate && task.plannedDate.trim()) || (task.plannedStartTime && task.plannedStartTime.trim()) || Number(task.estimatedHours || 0) > 0);
}

}

function getTimeEntryType(entry) {

}

function getFirstWorkingDayOfNextMonth(dateStr) {
  const parts = String(dateStr || todayStr()).split('-').map(Number);
  const y = parts[0] || new Date().getFullYear();
  const m = parts[1] || (new Date().getMonth() + 1);
  // m is 1-based; new Date(y, m, 1) gives 1st of next month
  const dt = new Date(y, m, 1);
  const day = dt.getDay();
  if (day === 6) dt.setDate(dt.getDate() + 2);
  else if (day === 0) dt.setDate(dt.getDate() + 1);
  return formatLocalDate(dt);
}

function getRemainingMonthWeekdays(fromDateStr = todayStr()) {
  const parts = String(fromDateStr || todayStr()).split('-').map(Number);
  const start = (parts.length === 3 && !parts.some(isNaN))
    ? new Date(parts[0], parts[1] - 1, parts[2])
    : new Date();
  const lastOfMonth = new Date(start.getFullYear(), start.getMonth() + 1, 0);
  const days = [];
  const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  while (cur <= lastOfMonth) {
    const dow = cur.getDay();
    if (dow >= 1 && dow <= 5) {
      days.push(formatLocalDate(cur));
    }
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}

function getActualSecondsForTask(taskId, includeSubtasks = true) {
  let total = 0;
  state.timeEntries.forEach(e => {
    if (getTimeEntryType(e) === 'budgeted') return;
    if (e.taskId === taskId) {
      if (includeSubtasks || !e.subtaskId) total += (e.durationSeconds || 0);
    }
  });
  if (state.activeTimer && state.activeTimer.taskId === taskId) {
    if (includeSubtasks || !state.activeTimer.subtaskId) {
      total += Math.max(0, Math.floor((Date.now() - state.activeTimer.startedAt) / 1000));
    }
  }
  return total;
}

function getActualSecondsForSubtask(taskId, subtaskId) {
  let total = 0;
  state.timeEntries.forEach(e => {
    if (getTimeEntryType(e) === 'budgeted') return;
    if (e.taskId === taskId && e.subtaskId === subtaskId) total += (e.durationSeconds || 0);
  });
  if (state.activeTimer && state.activeTimer.taskId === taskId && state.activeTimer.subtaskId === subtaskId) {
    total += Math.max(0, Math.floor((Date.now() - state.activeTimer.startedAt) / 1000));
  }
  return total;
}

function formatDuration(sec) {
  const raw = Math.round(Number(sec || 0));
  const sign = raw < 0 ? '-' : '';
  const abs = Math.abs(raw);
  const h = Math.floor(abs / 3600);
  const m = Math.floor((abs % 3600) / 60);
  const s = abs % 60;
  if (h > 0) return `${sign}${h}h ${m}m`;
  if (m > 0) return `${sign}${m}m`;
  return `${sign}${s}s`;
}

function formatClock(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = String(Math.floor(sec / 3600)).padStart(2, '0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${h}:${m}:${s}`;
}

function formatHoursNum(sec) {
  return (sec / 3600).toFixed(2);
}

function statusBadgeClass(status) {

function priorityBadgeClass(prio) {

function isSubtaskOverdue(sub, today = todayStr()) {
  return Boolean(sub && sub.status !== 'Done' && sub.dueDate && sub.dueDate < today);
}

function isTaskDirectlyOverdue(t, today = todayStr()) {
  return Boolean(t && t.status !== 'Done' && t.dueDate && t.dueDate < today);
}

function taskHasOverdue(t, today = todayStr()) {
  return Boolean(t && t.status !== 'Done' && (
    isTaskDirectlyOverdue(t, today) ||
    (t.subtasks || []).some(s => isSubtaskOverdue(s, today))
  ));
}

function isSubtaskDueToday(sub, today = todayStr()) {
  return Boolean(sub && sub.status !== 'Done' && sub.dueDate === today);
}

function isTaskDirectlyDueToday(t, today = todayStr()) {
  return Boolean(t && t.status !== 'Done' && t.dueDate === today);
}

function taskHasDueToday(t, today = todayStr()) {
  return Boolean(t && t.status !== 'Done' && (
    isTaskDirectlyDueToday(t, today) ||
    (t.subtasks || []).some(s => isSubtaskDueToday(s, today))
  ));
}

function collectTodayFocusData(today = todayStr()) {
  const overdue = [];
  const dueToday = [];
  const inProgress = [];
  const uniqueMap = new Map();

  const registerItem = (key, label, reason) => {
    if (!uniqueMap.has(key)) {
      uniqueMap.set(key, { key, label, reasons: [reason] });
    } else {
      const entry = uniqueMap.get(key);
      if (!entry.reasons.includes(reason)) entry.reasons.push(reason);
    }
  };

  state.tasks.forEach(t => {
    if (t.status === 'Done') return;
    const isCalWrapper = isCalendarContainerTask(t);

    if (isTaskDirectlyOverdue(t, today)) {
      overdue.push({ kind: 'task', task: t });
      registerItem(`task:${t.id}`, `Task: ${t.title}`, 'Overdue');
    }
    if (isTaskDirectlyDueToday(t, today)) {
      dueToday.push({ kind: 'task', task: t });
      registerItem(`task:${t.id}`, `Task: ${t.title}`, 'Due Today');
    }
    if (!isCalWrapper && t.status === 'In progress') {
      inProgress.push({ kind: 'task', task: t });
      registerItem(`task:${t.id}`, `Task: ${t.title}`, 'In Progress');
    }

    (t.subtasks || []).forEach(sub => {
      if (sub.status === 'Done') return;
      if (isSubtaskOverdue(sub, today)) {
        overdue.push({ kind: 'subtask', task: t, subtask: sub });
        registerItem(`sub:${t.id}:${sub.id}`, `Subtask: ${sub.title} (${t.title})`, 'Overdue');
      }
      if (isSubtaskDueToday(sub, today)) {
        dueToday.push({ kind: 'subtask', task: t, subtask: sub });
        registerItem(`sub:${t.id}:${sub.id}`, `Subtask: ${sub.title} (${t.title})`, 'Due Today');
      }
      if (sub.status === 'In progress') {
        inProgress.push({ kind: 'subtask', task: t, subtask: sub });
        registerItem(`sub:${t.id}:${sub.id}`, `Subtask: ${sub.title} (${t.title})`, 'In Progress');
      }
    });
  });

  return {
    overdue,
    dueToday,
    inProgress,
    badgeItems: Array.from(uniqueMap.values())
  };
}

function updateTodayBadge() {
  const data = collectTodayFocusData(todayStr());
  const count = data.badgeItems.length;
  const badge = document.getElementById('todayBadge');
  if (!badge) return;
  badge.textContent = count;
  badge.style.display = count > 0 ? 'inline-block' : 'none';

  const summary = count > 0
    ? `Today's Focus (${count}): ${data.overdue.length} Overdue, ${data.dueToday.length} Due Today, ${data.inProgress.length} In Progress\n` +
      data.badgeItems.slice(0, 12).map(it => `• [${it.reasons.join(', ')}] ${it.label}`).join('\n') +
      (data.badgeItems.length > 12 ? `\n… and ${data.badgeItems.length - 12} more` : '')
    : 'No overdue, due-today, or in-progress items';

  badge.title = summary;
  const navBtn = document.querySelector('.nav-item[data-view="today"]');
  if (navBtn) navBtn.title = summary;
}

// ===================== TIMER ENGINE =====================
function startTimer(taskId, subtaskId = null) {
  // Stop any currently running timer first
  if (state.activeTimer) {
    stopActiveTimer(true);
  }
  state.activeTimer = {
    taskId,
    subtaskId: subtaskId || null,
    startedAt: Date.now()
  };
  saveState();
  updateTimerUI();
  render();
  showToast('Timer started');
}

function roundUpTo15MinBlock(elapsedSec) {
  const FIFTEEN_MIN_SEC = 15 * 60;
  const safeElapsed = Math.max(1, Math.floor(elapsedSec || 0));
  return Math.ceil(safeElapsed / FIFTEEN_MIN_SEC) * FIFTEEN_MIN_SEC;
}

function stopActiveTimer(silent = false) {
  if (!state.activeTimer) return;
  const { taskId, subtaskId, startedAt } = state.activeTimer;
  const rawElapsedSec = Math.max(1, Math.floor((Date.now() - startedAt) / 1000));
  const roundedSec = roundUpTo15MinBlock(rawElapsedSec);
  const task = getTask(taskId);
  let note = `Tracked via timer (${formatDuration(rawElapsedSec)} actual → ${formatDuration(roundedSec)})`;
  if (task && subtaskId) {
    const sub = (task.subtasks || []).find(s => s.id === subtaskId);
    if (sub) {
      note = `Subtask: ${sub.title} (${formatDuration(rawElapsedSec)} actual → ${formatDuration(roundedSec)})`;
    }
  }
  if (task) {
    const rawDate = todayStr();
    const effDate = getEffectiveTimeEntryDate(rawDate);
    const shiftedNote = effDate !== rawDate ? `${note} [Weekend time counted toward ${effDate}]` : note;
    state.timeEntries.unshift({
      id: uid('time'),
      projectId: task.projectId,
      taskId: task.id,
      subtaskId: subtaskId || null,
      billable: isTaskBillable(task),
      date: effDate,
      durationSeconds: roundedSec,
      note: shiftedNote
    });
  }
  state.activeTimer = null;
  saveState();
  updateTimerUI();
  if (!silent) {
    render();
    showToast(`Logged ${formatDuration(roundedSec)} (rounded up from ${formatDuration(rawElapsedSec)})`);
  }
}

function isTimerRunningFor(taskId, subtaskId = null) {
  if (!state.activeTimer) return false;
  return state.activeTimer.taskId === taskId && (state.activeTimer.subtaskId || null) === (subtaskId || null);
}

function updateTimerUI() {
  const pill = document.getElementById('activeTimerPill');
  if (!state.activeTimer) {
    pill.classList.remove('visible');
    return;
  }
  const task = getTask(state.activeTimer.taskId);
  let label = task ? task.title : 'Task';
  if (task && state.activeTimer.subtaskId) {
    const sub = (task.subtasks || []).find(s => s.id === state.activeTimer.subtaskId);
    if (sub) label = `${task.title} → ${sub.title}`;
  }
  if (label.length > 34) label = label.slice(0, 34) + '…';
  document.getElementById('activeTimerLabel').textContent = label;
  const elapsed = Math.floor((Date.now() - state.activeTimer.startedAt) / 1000);
  document.getElementById('activeTimerClock').textContent = formatClock(elapsed);
  pill.classList.add('visible');
}

setInterval(() => {
  if (state.activeTimer) updateTimerUI();
}, 1000);

// ===================== BACKUP & RESTORE =====================
function exportBackup() {
  const data = {
    exportedAt: new Date().toISOString(),
    app: 'Cadence Personal Work Manager',
    version: 1,
    projects: state.projects,
    tasks: state.tasks,
    notes: state.notes,
    timeEntries: state.timeEntries,
    calendarEvents: state.calendarEvents,
    assignees: state.assignees,
    savedTaskFilters: state.savedTaskFilters,
    defaultTaskFilter: state.defaultTaskFilter,
    settings: state.settings
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cadence-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Backup file downloaded');
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed.projects) || !Array.isArray(parsed.tasks)) {
        alert('This file does not look like a valid Cadence backup.');
        return;
      }
      if (!confirm('Importing this backup will replace your current data in this browser. Continue?')) return;
      state.projects = parsed.projects || [];
      state.tasks = parsed.tasks || [];
      state.notes = parsed.notes || [];
      state.timeEntries = parsed.timeEntries || [];
      state.calendarEvents = parsed.calendarEvents || [];
      state.assignees = parsed.assignees || [];
      syncAssigneesFromTasks();
      state.savedTaskFilters = parsed.savedTaskFilters || [];
      state.defaultTaskFilter = parsed.defaultTaskFilter || null;
      state.settings = Object.assign({ proxyUrl: '', calendarIcsUrl: '', myTeam: '' }, parsed.settings || {});
      state.activeTimer = null;
      state.ui.taskFilters.defaultApplied = false;
      ensureAllProjectsHaveCalendarEventsTask();
      applyDefaultTaskFilterOnLoad();
      saveState();
      updateTimerUI();
      render();
      showToast('Backup restored successfully');
    } catch (err) {
      alert('Could not read the backup file. Make sure it is a valid .json backup.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function confirmResetData() {
  if (!confirm('Are you sure you want to delete ALL projects, tasks, notes, and time entries? Export a backup first if you want to keep them.')) return;
  state.projects = [];
  state.tasks = [];
  state.notes = [];
  state.timeEntries = [];
  state.calendarEvents = [];
  state.assignees = [];
  state.savedTaskFilters = [];
  state.defaultTaskFilter = null;
  state.activeTimer = null;
  saveState();
  updateTimerUI();
  render();
  showToast('All data cleared');
}

          <label>Client (optional)</label>

      </div>

function renderStagesEditor() {
  const wrap = document.getElementById('stagesEditor');
  if (!wrap) return;
  wrap.innerHTML = tempProjectStages.map((s, i) => `
    <div class="stage-chip-row">
      <input type="text" value="${esc(s.name)}" oninput="tempProjectStages[${i}].name=this.value" placeholder="Stage name" required />
      <button type="button" class="btn btn-xs" onclick="moveTempStage(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
      <button type="button" class="btn btn-xs" onclick="moveTempStage(${i}, 1)" ${i === tempProjectStages.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
      <button type="button" class="btn btn-xs btn-ghost" style="color:var(--danger)" onclick="removeTempStage(${i})" ${tempProjectStages.length <= 1 ? 'disabled' : ''} title="Delete stage">✕</button>
    </div>
  `).join('');
}

function addTempStage() {
  tempProjectStages.push({ id: uid('stg'), name: '' });
  renderStagesEditor();
}
function moveTempStage(idx, dir) {
  const target = idx + dir;
  if (target < 0 || target >= tempProjectStages.length) return;
  const [item] = tempProjectStages.splice(idx, 1);
  tempProjectStages.splice(target, 0, item);
  renderStagesEditor();
}
function removeTempStage(idx) {
  if (tempProjectStages.length <= 1) return;
  tempProjectStages.splice(idx, 1);
  renderStagesEditor();
}

function saveProjectForm(e, projectId) {
  e.preventDefault();
  const cleanStages = tempProjectStages
    .map(s => ({ id: s.id, name: (s.name || '').trim() }))
    .filter(s => s.name);
  if (cleanStages.length === 0) {
    alert('Please keep at least one stage.');
    return;
  }
  const billable = document.getElementById('pBillable').value === 'true';
  const isDefault = Boolean(document.getElementById('pIsDefault')?.checked);
  if (isDefault) {
    state.projects.forEach(pr => { pr.isDefault = false; });
  }
  const rawLogIds = (document.getElementById('pLogIds')?.value || '');
  const cleanLogIds = Array.from(new Set(
    rawLogIds
      .split(/[,\s;]+/)
      .map(x => x.trim().replace(/^#/, ''))
      .filter(Boolean)
  ));
  const payload = {
    name: document.getElementById('pName').value.trim(),
    client: document.getElementById('pClient').value.trim(),
    logIds: cleanLogIds,
    repoLink: (document.getElementById('pRepoLink')?.value || '').trim(),
    description: document.getElementById('pDesc').value.trim(),
    status: document.getElementById('pStatus').value,
    isDefault,
    billable,
    hourlyRate: billable ? Number(document.getElementById('pRate').value || 0) : 0,
    stages: cleanStages
  };

  if (projectId) {
    const p = getProject(projectId);
    Object.assign(p, payload);
    if (isDefault) state.ui.taskFilters.projectId = p.id;
    showToast('Project updated');
  } else {
    const newProj = { id: uid('proj'), archived: false, ...payload };
    state.projects.push(newProj);
    ensureProjectCalendarEventsTask(newProj.id);
    if (isDefault) state.ui.taskFilters.projectId = newProj.id;
    showToast('Project created');
  }
  saveState();
  closeModal();
  render();
}


function setDefaultProject(projectId) {
  state.projects.forEach(p => { p.isDefault = (p.id === projectId); });
  state.ui.taskFilters.projectId = projectId;
  state.ui.taskFilters.stageId = '';
  saveState();
  render();
  const p = getProject(projectId);
  showToast(`⭐ "${p ? p.name : 'Project'}" set as default`);
}

function toggleArchiveProject(id) {
  const p = getProject(id);
  if (!p) return;
  p.archived = !p.archived;
  saveState();
  render();
  showToast(p.archived ? 'Project archived' : 'Project unarchived');
}

function deleteProject(id) {
  const projTasks = state.tasks.filter(t => t.projectId === id);
  const taskIds = new Set(projTasks.map(t => t.id));
  const timeCount = state.timeEntries.filter(e => e.projectId === id || taskIds.has(e.taskId)).length;
  const parts = [];
  if (projTasks.length) parts.push(`${projTasks.length} task(s)`);
  if (timeCount) parts.push(`${timeCount} time entr${timeCount === 1 ? 'y' : 'ies'}`);
  if (!confirm(`Delete this project${parts.length ? ` and its ${parts.join(' and ')}` : ''}? This cannot be undone.`)) return;
  if (state.activeTimer && taskIds.has(state.activeTimer.taskId)) {
    state.activeTimer = null;
    updateTimerUI();
  }
  state.projects = state.projects.filter(p => p.id !== id);
  state.tasks = state.tasks.filter(t => t.projectId !== id);
  state.timeEntries = state.timeEntries.filter(e => e.projectId !== id && !taskIds.has(e.taskId));
  saveState();
  render();
  showToast('Project deleted');
}

// ===================== 3. TASKS VIEW (LIST & KANBAN) =====================
function syncAssigneesFromTasks() {
  if (!Array.isArray(state.assignees)) state.assignees = [];
  const knownLower = new Set(state.assignees.map(a => (a.name || '').trim().toLowerCase()).filter(Boolean));
  const addIfNew = (rawName) => {
    const clean = (rawName || '').trim();
    if (!clean) return;
    const key = clean.toLowerCase();
    if (!knownLower.has(key)) {
      knownLower.add(key);
      state.assignees.push({ id: uid('asg'), name: clean, email: '', team: '', leftOrg: false });
    }
  };
  state.tasks.forEach(t => {
    addIfNew(t.assignee);
    (t.subtasks || []).forEach(s => addIfNew(s.assignee));
  });
}

function ensureAssigneeRecord(rawName) {
  const clean = (rawName || '').trim();
  if (!clean) return null;
  if (!Array.isArray(state.assignees)) state.assignees = [];
  let found = state.assignees.find(a => (a.name || '').trim().toLowerCase() === clean.toLowerCase());
  if (!found) {
    found = { id: uid('asg'), name: clean, email: '', team: '', leftOrg: false };
    state.assignees.push(found);
  }
  return found;
}

function getAssigneeMeta(rawName) {
  const clean = (rawName || '').trim();
  if (!clean || !Array.isArray(state.assignees)) return null;
  return state.assignees.find(a => (a.name || '').trim().toLowerCase() === clean.toLowerCase()) || null;
}

function getAllAssignees(includeLeft = true) {
  syncAssigneesFromTasks();
  return state.assignees
    .filter(a => includeLeft ? true : !a.leftOrg)
    .map(a => a.name)
    .sort((a, b) => a.localeCompare(b));
}

function getMyTeam() {
  return (state.settings?.myTeam || '').trim();
}

function setMyTeam(teamName) {
  if (!state.settings) state.settings = {};
  state.settings.myTeam = (teamName || '').trim();
  saveState();
  render();
  showToast(state.settings.myTeam ? `🙋 Your team set to "${state.settings.myTeam}"` : '🙋 Removed your team tag');
}

function getAllTeams() {
  syncAssigneesFromTasks();
  const set = new Set();
  const myTm = getMyTeam();
  if (myTm) set.add(myTm);
  state.assignees.forEach(a => {
    if (a.team && a.team.trim()) set.add(a.team.trim());
  });
  return Array.from(set).sort((a, b) => a.localeCompare(b));
}


function captureTaskFilterSnapshot() {
  const f = state.ui.taskFilters || {};
  return {
    search: f.search || '',
    projectId: f.projectId || '',
    stageId: f.stageId || '',
    status: f.status !== undefined ? f.status : '__open__',
    priority: f.priority || '',
    due: f.due || '',
    assignees: Array.isArray(f.assignees) ? [...f.assignees] : [],
    team: f.team || '',
    planned: f.planned || ''
  };
}

function applyDefaultTaskFilterOnLoad() {
  const f = state.ui.taskFilters;
  if (f.defaultApplied) return;
  if (state.defaultTaskFilter && state.defaultTaskFilter.filters) {
    Object.assign(f, JSON.parse(JSON.stringify(state.defaultTaskFilter.filters)));
    f.defaultApplied = true;
    return;
  }
  applyDefaultProjectFilterIfNeeded();
}

function saveCurrentFiltersAsDefault() {
  const snap = captureTaskFilterSnapshot();
  state.defaultTaskFilter = {
    savedAt: new Date().toISOString(),
    filters: snap
  };
  saveState();
  render();
  showToast('⭐ Current task filters saved as default');
}

function clearSavedDefaultTaskFilter() {
  if (!state.defaultTaskFilter) return;
  state.defaultTaskFilter = null;
  saveState();
  render();
  showToast('Saved default filter cleared');
}

function openSaveFilterPresetModal(presetId = null) {
  const existing = presetId ? (state.savedTaskFilters || []).find(p => p.id === presetId) : null;
  const snap = existing ? existing.filters : captureTaskFilterSnapshot();
  const summaryParts = [];
  if (snap.projectId) {
    const pr = getProject(snap.projectId);
    summaryParts.push(`Project: ${pr ? pr.name : snap.projectId}`);
  }
  if (snap.stageId) summaryParts.push('Stage filtered');
  if (snap.status && snap.status !== '__open__') summaryParts.push(`Status: ${snap.status}`);
  else if (snap.status === '__open__') summaryParts.push('Open statuses');
  if (snap.team) summaryParts.push(`Team: ${snap.team === '__unassigned__' ? 'No Team' : snap.team}`);
  if (snap.planned) summaryParts.push(`Type: ${snap.planned}`);
  if (snap.assignees && snap.assignees.length) summaryParts.push(`Assignees: ${snap.assignees.join(', ')}`);
  if (snap.priority) summaryParts.push(`Priority: ${snap.priority}`);
  if (snap.due) summaryParts.push(`Due: ${snap.due}`);
  if (snap.search) summaryParts.push(`Search: "${snap.search}"`);

  openModal(`
    <div class="modal-header">
      <h3>${existing ? 'Edit Saved Filter' : 'Save Filter with Description'}</h3>
      <button class="btn btn-xs btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <p class="field-hint" style="margin-bottom:12px;">
      Active filter snapshot: <strong>${esc(summaryParts.length ? summaryParts.join(' • ') : 'All / Default criteria')}</strong>
    </p>
    <form onsubmit="saveFilterPresetForm(event, '${existing ? existing.id : ''}')">
      <div class="form-group">
        <label>Filter Label / Name *</label>
        <input type="text" id="fpName" required value="${esc(existing?.name || '')}" placeholder="e.g. Urgent Client Bugs" />
      </div>
      <div class="form-group">
        <label>Description *</label>
        <textarea id="fpDesc" required placeholder="Describe what tasks this filter shows (e.g. High-priority open Jira tasks for Platform team)">${esc(existing?.description || '')}</textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Filter</button>
      </div>
    </form>
  `);
}

function saveFilterPresetForm(e, presetId) {
  e.preventDefault();
  const name = (document.getElementById('fpName')?.value || '').trim();
  const description = (document.getElementById('fpDesc')?.value || '').trim();
  if (!name || !description) return;
  if (!Array.isArray(state.savedTaskFilters)) state.savedTaskFilters = [];

  if (presetId) {
    const found = state.savedTaskFilters.find(x => x.id === presetId);
    if (found) {
      found.name = name;
      found.description = description;
      showToast('Saved filter updated');
    }
  } else {
    const created = {
      id: uid('flt'),
      name,
      description,
      filters: captureTaskFilterSnapshot()
    };
    state.savedTaskFilters.push(created);
    state.ui.activeTaskPresetId = created.id;
    showToast(`Saved filter "${name}"`);
  }
  saveState();
  closeModal();
  render();
}

function applySavedTaskPreset(presetId) {
  const preset = (state.savedTaskFilters || []).find(x => x.id === presetId);
  if (!preset || !preset.filters) return;
  const f = state.ui.taskFilters;
  Object.assign(f, JSON.parse(JSON.stringify(preset.filters)));
  f.defaultApplied = true;
  state.ui.activeTaskPresetId = preset.id;
  render();
  showToast(`Applied "${preset.name}"`);
}

function deleteSavedTaskPreset(presetId) {
  state.savedTaskFilters = (state.savedTaskFilters || []).filter(x => x.id !== presetId);
  if (state.ui.activeTaskPresetId === presetId) state.ui.activeTaskPresetId = '';
  saveState();
  render();
  showToast('Saved filter removed');
}

function countActiveExtraFilters() {
  const f = state.ui.taskFilters || {};
  let cnt = 0;
  if (f.team) cnt++;
  if (f.stageId) cnt++;
  if (f.status !== '__open__' && f.status !== 'Blocked') cnt++;
  if (f.priority) cnt++;
  if (f.planned) cnt++;
  const namedAssignees = (Array.isArray(f.assignees) ? f.assignees : []).filter(x => x !== '__me__' && x !== '__delegated__');
  if (namedAssignees.length > 0) cnt++;
  return cnt;
}

function filterByTeamName(teamName) {

  render();

function matchesAssigneeToken(rawName, token) {
  const clean = (rawName || '').trim();
  if (token === '__me__') return !clean;
  if (token === '__delegated__') return Boolean(clean);
  return clean.toLowerCase() === token.toLowerCase();
}

function getEarliestTaskSortDate(t) {
  const dates = [];
  if (t.dueDate) dates.push(t.dueDate);
  if (t.plannedDate) dates.push(t.plannedDate);
  (t.subtasks || []).forEach(s => {
    if (s.status !== 'Done') {
      if (s.dueDate) dates.push(s.dueDate);
      if (s.plannedDate) dates.push(s.plannedDate);
    }
  });
  if (dates.length === 0) return '9999-12-31';
  dates.sort();
  return dates[0];
}

function getFilteredTasks() {
  const f = state.ui.taskFilters;
  const today = todayStr();
  const weekEnd = addDaysStr(7);
  const selectedAssignees = getSelectedAssignees();

  const filtered = state.tasks.filter(t => {
    if (f.projectId && t.projectId !== f.projectId) return false;
    if (f.stageId && t.stageId !== f.stageId) return false;
    if (f.status === '__open__' && t.status === 'Done') return false;
    if (f.status && f.status !== '__open__' && t.status !== f.status) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (f.planned === 'planned' && !isTaskPlanned(t)) return false;
    if (f.planned === 'nonplanned' && isTaskPlanned(t)) return false;
    if (f.team) {
      const matchesTeam = (rawName) => {
        const clean = (rawName || '').trim();
        const teamName = !clean ? getMyTeam() : ((getAssigneeMeta(clean)?.team || '').trim());
        if (f.team === '__unassigned__') return !teamName;
        return teamName === f.team;
      };
      const taskMatches = matchesTeam(t.assignee);
      const subMatches = (t.subtasks || []).some(s => matchesTeam(s.assignee));
      if (!taskMatches && !subMatches) return false;
    }
    if (selectedAssignees.length > 0) {
      if (t.status === 'Done') return false;
      const matchesAnySelected = selectedAssignees.some(token => {
        const taskMatch = matchesAssigneeToken(t.assignee, token);
        const subMatch = (t.subtasks || []).some(s => s.status !== 'Done' && matchesAssigneeToken(s.assignee, token));
        return taskMatch || subMatch;
      });
      if (!matchesAnySelected) return false;
    }
    if (f.due === 'overdue' && !taskHasOverdue(t, today)) return false;
    if (f.due === 'today' && !taskHasDueToday(t, today)) return false;
    if (f.due === 'week' && !((t.dueDate && t.dueDate >= today && t.dueDate <= weekEnd) || (t.subtasks || []).some(s => s.status !== 'Done' && s.dueDate && s.dueDate >= today && s.dueDate <= weekEnd))) return false;
    if (f.due === 'none' && t.dueDate) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      const hay = `${t.title} ${(t.description || '').replace(/<[^>]+>/g, ' ')} ${t.assignee || ''} ${t.externalRef || ''} ${(t.subtasks||[]).map(s=>`${s.title} ${(s.description || '').replace(/<[^>]+>/g, ' ')} ${s.assignee || ''}`).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // Keep Imported Calendar Events always at the bottom, then sort by earliest due/planned date ascending
  return filtered.sort((a, b) => {
    const aCal = isCalendarContainerTask(a) ? 1 : 0;
    const bCal = isCalendarContainerTask(b) ? 1 : 0;
    if (aCal !== bCal) return aCal - bCal;
    const da = getEarliestTaskSortDate(a);
    const db = getEarliestTaskSortDate(b);
    if (da !== db) return da.localeCompare(db);
    return (a.title || '').localeCompare(b.title || '');
  });
}

function computeAssigneeStats(matchFn, today, projectIdFilter = '') {
  let total = 0, done = 0, overdue = 0, blocked = 0;
  state.tasks.forEach(t => {
    if (projectIdFilter && t.projectId !== projectIdFilter) return;
    if (matchFn((t.assignee || '').trim())) {
      total++;
      if (t.status === 'Done') done++;
      else {
        if (t.dueDate && t.dueDate < today) overdue++;
        if (t.status === 'Blocked') blocked++;
      }
    }
    (t.subtasks || []).forEach(s => {
      if (matchFn((s.assignee || '').trim())) {
        total++;
        if (s.status === 'Done') done++;
        else {
          if (s.dueDate && s.dueDate < today) overdue++;
          if (s.status === 'Blocked') blocked++;
        }
      }
    });
  });
  return { total, done, open: total - done, overdue, blocked };
}

function buildAssigneePillHtml({ labelText, icon, leftOrg, stats, isSelected, onClickExpr, titleText }) {
  return `

        ${stats.overdue ? `<span class="ap-badge-warn" title="${stats.overdue} overdue">🔥${stats.overdue}</span>` : ''}
        ${stats.blocked ? `<span class="ap-badge-blk" title="${stats.blocked} blocked">⛔${stats.blocked}</span>` : ''}
      </span>
