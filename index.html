function executeFilteredIcsImport(e) {
  e.preventDefault();
  const chosen = getFilteredPendingIcs();
  const trimDesc = document.getElementById('icsTrimDesc')?.checked;
  let fallbackInboxTask = null;
  let added = 0;
  let updated = 0;
  let autoAssigned = 0;
  const touchedContainers = new Set();

  chosen.forEach(ev => {
    let desc = ev.description || '';
    if (trimDesc && desc.length > 250) desc = desc.slice(0, 250) + '…';

    const matchedProj = matchProjectByTitlePrefix(ev.title);
    const existing = findExistingIcsItem(ev.icsUid, ev.title, ev.date);
    if (existing) {
      const target = existing.item;
      target.title = ev.title;
      target.plannedDate = ev.date;
      target.plannedStartTime = ev.startTime;
      target.estimatedHours = ev.estimatedHours;
      if (desc) target.description = desc;

      // If still in generic Calendar inbox and now matches a project prefix, auto-move as subtask
      if (matchedProj && existing.isSubtask && existing.parent && existing.parent.isCalendarInbox) {
        const destTask = ensureProjectCalendarEventsTask(matchedProj.id);
        if (destTask.id !== existing.parent.id) {
          existing.parent.subtasks = (existing.parent.subtasks || []).filter(s => s.id !== target.id);
          destTask.subtasks.push(target);
          state.timeEntries.forEach(entry => {
            if (entry.taskId === existing.parent.id && entry.subtaskId === target.id) {
              entry.projectId = matchedProj.id;
              entry.taskId = destTask.id;
            }
          });
          if (state.activeTimer && state.activeTimer.taskId === existing.parent.id && state.activeTimer.subtaskId === target.id) {
            state.activeTimer.taskId = destTask.id;
          }
          touchedContainers.add(existing.parent);
          touchedContainers.add(destTask);
          autoAssigned++;
        }
      }
      updated++;
      return;
    }

    let destTask;
    if (matchedProj) {
      destTask = ensureProjectCalendarEventsTask(matchedProj.id);
      autoAssigned++;
    } else {
      if (!fallbackInboxTask) fallbackInboxTask = ensureCalendarInboxTask();
      destTask = fallbackInboxTask;
    }

    destTask.subtasks.push({
      id: uid('sub'),
      title: ev.title,
      description: desc,
      status: 'To do',
      dueDate: '',
      category: 'Administrative',
      plannedDate: ev.date,
      plannedStartTime: ev.startTime,
      estimatedHours: ev.estimatedHours,
      icsUid: ev.icsUid
    });
    touchedContainers.add(destTask);
    added++;
  });

  touchedContainers.forEach(ct => {
    orderTaskSubtasks(ct);
    syncCalendarContainerStatus(ct);
  });

  pendingIcsEvents = [];
  closeModal();

  if (added > 0 || updated > 0) {
    saveState();
    render();
    const parts = [];
    if (added > 0) parts.push(`${added} new`);
    if (updated > 0) parts.push(`${updated} updated`);
    if (autoAssigned > 0) parts.push(`${autoAssigned} auto-assigned to projects`);
    showToast(`Calendar sync complete: ${parts.join(', ')}`);
  } else {
    showToast('No events matched the selected date range');
  }
}


// ===================== 8. PHASE 3: RECURRING, REMINDERS, SHORTCUTS & EXTRAS =====================
const REMINDER_KEY = 'workflow_reminders_enabled_v1';
const NOTIFIED_KEY = 'workflow_notified_ids_v1';

function shiftDateByRecurrence(dateStr, recurrence) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  if (recurrence === 'daily') dt.setDate(dt.getDate() + 1);
  else if (recurrence === 'weekdays') {
    do {
      dt.setDate(dt.getDate() + 1);
    } while (dt.getDay() === 0 || dt.getDay() === 6);
  }
  else if (recurrence === 'weekly') dt.setDate(dt.getDate() + 7);
  else if (recurrence === 'monthly') dt.setMonth(dt.getMonth() + 1);
  return formatLocalDate(dt);
}

function spawnNextRecurringTask(task) {
  if (!task || !task.recurrence || task.recurrence === 'none') return;
  const baseDate = task.dueDate || task.plannedDate || todayStr();
  const nextDue = task.dueDate ? shiftDateByRecurrence(task.dueDate, task.recurrence) : shiftDateByRecurrence(baseDate, task.recurrence);
  const nextPlanned = task.plannedDate ? shiftDateByRecurrence(task.plannedDate, task.recurrence) : '';

  const nextSubs = (task.subtasks || []).map(s => ({
    ...s,
    id: uid('sub'),
    status: 'To do',
    dueDate: s.dueDate ? shiftDateByRecurrence(s.dueDate, task.recurrence) : '',
    plannedDate: s.plannedDate ? shiftDateByRecurrence(s.plannedDate, task.recurrence) : ''
  }));

  const clone = {
    ...task,
    id: uid('task'),
    status: 'To do',
    dueDate: nextDue,
    plannedDate: nextPlanned,
    subtasks: nextSubs
  };
  // Prevent the completed copy from spawning again if toggled later
  task.recurrence = 'none';
  state.tasks.unshift(clone);
  showToast(`🔁 Next ${clone.recurrence} task scheduled for ${nextDue}`);
}

function handleQuickAddTask(e) {
  e.preventDefault();
  const titleEl = document.getElementById('quickAddTitle');
  const projEl = document.getElementById('quickAddProject');
  const catEl = document.getElementById('quickAddCat');
  const title = (titleEl?.value || '').trim();
  const projectId = projEl?.value || '';
  if (!title) return;
  if (!projectId) {
    alert('Please create a Project first.');
    switchView('projects');
    openProjectModal();
    return;
  }
  const quickTask = {
    id: uid('task'),
    projectId,
    stageId: '',
    title,
    description: '',
    dueDate: todayStr(),
    priority: 'Medium',
    status: 'To do',
    billableOverride: 'inherit',
    category: catEl?.value || 'Administrative',
    externalRef: '',
    blockedByTaskId: '',
    plannedDate: todayStr(),
    plannedStartTime: '',
    estimatedHours: 0,
    recurrence: 'none',
    subtasks: []
  };

}

function duplicateTask(taskId) {
  const t = getTask(taskId);
  if (!t) return;
  const copy = {
    ...JSON.parse(JSON.stringify(t)),
    id: uid('task'),
    title: `${t.title} (Copy)`,
    status: 'To do',
    subtasks: (t.subtasks || []).map(s => ({ ...s, id: uid('sub'), status: 'To do' }))
  };
  state.tasks.unshift(copy);
  saveState();
  render();
  showToast('Task duplicated');
}

// Browser Notification Reminders
function updateReminderButtonUI() {
  const btn = document.getElementById('reminderBtn');
  if (!btn) return;
  const enabled = localStorage.getItem(REMINDER_KEY) === 'true';
  btn.textContent = enabled ? '🔔 Reminders: On' : '🔔 Reminders: Off';
  btn.classList.toggle('btn-success', enabled);
}

async function toggleReminders() {
  const currentlyOn = localStorage.getItem(REMINDER_KEY) === 'true';
  if (currentlyOn) {
    localStorage.setItem(REMINDER_KEY, 'false');
    updateReminderButtonUI();
    showToast('Reminders turned off');
    return;
  }
  if (!('Notification' in window)) {
    localStorage.setItem(REMINDER_KEY, 'true');
    updateReminderButtonUI();
    showToast('In-app reminders enabled (browser notifications not supported here)');
    return;
  }
  let perm = Notification.permission;
  if (perm === 'default') {
    try { perm = await Notification.requestPermission(); } catch (e) {}
  }
  localStorage.setItem(REMINDER_KEY, 'true');
  updateReminderButtonUI();
  if (perm === 'granted') {
    new Notification('Cadence Reminders Active', { body: 'You will be reminded about due and upcoming planned tasks while this tab is open.' });
    showToast('Browser reminders enabled');
  } else {
    showToast('Reminders on (using in-app alerts since browser notifications are blocked)');
  }
  checkDueReminders();
}

function checkDueReminders() {
  if (localStorage.getItem(REMINDER_KEY) !== 'true') return;
  const today = todayStr();
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();

  let notifiedMap = {};
  try {
    const raw = JSON.parse(localStorage.getItem(NOTIFIED_KEY) || '{}');
    if (raw.date === today) notifiedMap = raw.ids || {};
  } catch (e) {}

  const fire = (key, title, body) => {
    if (notifiedMap[key]) return;
    notifiedMap[key] = true;
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification(title, { body }); } catch (e) { showToast(`🔔 ${title}: ${body}`); }
    } else {
      showToast(`🔔 ${title}: ${body}`);
    }
  };

  state.tasks.forEach(t => {
    if (t.status === 'Done') return;
    if (t.dueDate && t.dueDate <= today) {
      fire(`due_${t.id}`, t.dueDate < today ? 'Overdue Task' : 'Task Due Today', t.title);
    }
    if (t.plannedDate === today && t.plannedStartTime) {
      const [hh, mm] = t.plannedStartTime.split(':').map(Number);
      const targetMins = (hh || 0) * 60 + (mm || 0);
      if (targetMins >= nowMins && targetMins - nowMins <= 15) {
        fire(`plan_${t.id}`, `Starting Soon (${t.plannedStartTime})`, t.title);
      }
    }
    (t.subtasks || []).forEach(s => {
      if (s.status === 'Done') return;
      if (s.dueDate && s.dueDate <= today) {
        fire(`subdue_${s.id}`, s.dueDate < today ? 'Overdue Subtask' : 'Subtask Due Today', `${t.title} → ${s.title}`);
      }
      if (s.plannedDate === today && s.plannedStartTime) {
        const [hh, mm] = s.plannedStartTime.split(':').map(Number);
        const targetMins = (hh || 0) * 60 + (mm || 0);
        if (targetMins >= nowMins && targetMins - nowMins <= 15) {
          fire(`sub_${s.id}`, `Starting Soon (${s.plannedStartTime})`, `${t.title} → ${s.title}`);
        }
      }
    });
  });

  localStorage.setItem(NOTIFIED_KEY, JSON.stringify({ date: today, ids: notifiedMap }));
}

setInterval(checkDueReminders, 60000);

// Keyboard Shortcuts
function openShortcutsModal() {
  openModal(`
    <div class="modal-header">
      <h3>⌨️ Keyboard Shortcuts</h3>
      <button class="btn btn-xs btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <p class="field-hint" style="margin-bottom:12px;">Press these keys anywhere (when not typing in a text box):</p>
    <div>
      <div class="shortcut-row"><span>Quick Add Task (concise popup)</span><span><kbd>Q</kbd> or <kbd>N</kbd></span></div>
      <div class="shortcut-row"><span>Create a new project</span><kbd>P</kbd></div>
      <div class="shortcut-row"><span>Focus search box</span><kbd>/</kbd></div>
      <div class="shortcut-row"><span>Switch views (Today → Settings)</span><span><kbd>1</kbd> – <kbd>9</kbd></span></div>
      <div class="shortcut-row"><span>Toggle Light / Dark mode</span><kbd>D</kbd></div>
      <div class="shortcut-row"><span>Open this shortcuts help</span><kbd>?</kbd></div>
      <div class="shortcut-row"><span>Close any popup window</span><kbd>Esc</kbd></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-sm" onclick="closeModal()">Got it</button>
    </div>
  `);
}

document.addEventListener('click', () => {
  let changed = false;
  if (state.ui && state.ui.showViewsMenu) {
    state.ui.showViewsMenu = false;
    changed = true;
  }
  if (state.ui && state.ui.calendarZoomOpen) {
    state.ui.calendarZoomOpen = false;
    changed = true;
  }
  if (changed) render();
});

document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

  if (e.key === 'Escape') {
    closeModal();
    toggleSidebar(false);
    return;
  }
  if (isTyping || e.ctrlKey || e.metaKey || e.altKey) return;

  const k = e.key.toLowerCase();
  if (k === 'n' || k === 'q') { e.preventDefault(); openQuickAddTaskModal(); }
  else if (k === 'p') { e.preventDefault(); openProjectModal(); }
  else if (k === 'd') { e.preventDefault(); toggleTheme(); }
  else if (e.key === '?') { e.preventDefault(); openShortcutsModal(); }
  else if (e.key === '/') {
    e.preventDefault();
    if (state.ui.view !== 'tasks' && state.ui.view !== 'notes') switchView('tasks');
    setTimeout(() => {
      const inp = document.getElementById('taskSearchInput') || document.querySelector('.filter-bar input[type="text"]');
      if (inp) inp.focus();
    }, 50);
  }
  else if (['1','2','3','4','5','6','7','8','9'].includes(k)) {
    const views = ['today', 'projects', 'tasks', 'assignees', 'calendar', 'notes', 'time', 'reports', 'settings'];
    switchView(views[Number(k) - 1]);
  }
});


// ===================== 9. LINKS, DEPENDENCIES & SETTINGS =====================
function isValidHttpUrl(str) {
  return /^https?:\/\//i.test((str || '').trim());
}

function openProjectToolLink(tool, projectId) {
  const p = getProject(projectId);
  if (!p) return;
  if (tool === 'repo') {
    const val = (p.repoLink || '').trim();
    if (!val) return;
    if (isValidHttpUrl(val)) {
      window.open(val, '_blank', 'noopener');
    } else {
      showToast('Please save a full Box or SharePoint URL (starting with https://) to open it.');
    }
  }
}

function renderSubtaskDependencyBadge(sub) {
  if (!sub || !sub.blockedByTaskId) return '';
  const blocker = getTask(sub.blockedByTaskId);
  if (!blocker) return '';
  if (blocker.status !== 'Done') {
    return `<span class="badge b-warn" title="Blocked until '${esc(blocker.title)}' is Done">⚠️ Blocked by: ${esc(blocker.title)}</span>`;
  }
  return `<span class="badge b-done" title="Blocking task is Done">✅ Unblocked</span>`;
}

function getBlockedDependentsCount(taskId) {
  let count = 0;
  state.tasks.forEach(other => {
    if (other.blockedByTaskId === taskId && other.status !== 'Done') count++;
    (other.subtasks || []).forEach(s => {
      if (s.blockedByTaskId === taskId && s.status !== 'Done') count++;
    });
  });
  return count;
}

function renderIntegrationActions(task, subtask = null, inline = false) {
  const chips = [];

  if (!subtask) {
    const blockingCount = getBlockedDependentsCount(task.id);
    if (blockingCount > 0 && task.status !== 'Done') {
      chips.push(`<span class="badge b-blocked" title="Other tasks or subtasks are waiting on this one">🚧 Blocking ${blockingCount} item${blockingCount > 1 ? 's' : ''}</span>`);
    }
    const proj = getProject(task.projectId);
    if (proj && proj.repoLink && isValidHttpUrl(proj.repoLink)) {
      chips.push(`<button type="button" class="btn-int" onclick="openProjectToolLink('repo','${proj.id}')" title="${esc(proj.repoLink)}">📂 Box / SharePoint</button>`);
    }
  }

  if (chips.length === 0) return '';
  if (inline) return chips.join('');
  return `<div class="integration-bar">${chips.join('')}</div>`;
}

function saveSettingsForm(e, silent = false) {
  if (e) e.preventDefault();
  state.settings = {
    ...(state.settings || {}),
    proxyUrl: (document.getElementById('setProxyUrl')?.value || '').trim(),
    calendarIcsUrl: (document.getElementById('setCalendarIcsUrl')?.value || '').trim()
  };
  saveState();
  if (!silent) {
    showToast('Settings saved');
    render();
  }
}

  syncVersionLabels();
  initTheme();
  await loadState();
  updateTodayBadge();
  updateTimerUI();
  updateReminderButtonUI();
  let savedView = 'today';
  try {
    const last = localStorage.getItem(LAST_VIEW_KEY);
    if (last && VALID_VIEWS.includes(last)) savedView = last;
  } catch (e) {}

  setTimeout(checkDueReminders, 2000);
})();
