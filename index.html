  `;
}

function renderAssigneeProgressStrip() {
  syncAssigneesFromTasks();
  const today = todayStr();
  const selectedList = getSelectedAssignees();
  const teamFilter = state.ui.taskFilters.team || '';
  const projFilter = state.ui.taskFilters.projectId || '';
  const activeProj = projFilter ? getProject(projFilter) : null;
  const isSelectedFn = (val) => selectedList.some(x => x.toLowerCase() === val.toLowerCase());

  // Group assignees into Team Swimlanes, scoped to active project when a project is selected
  const groupsMap = new Map();
  const ensureGroup = (key, label, filterToken) => {
    if (!groupsMap.has(key)) {
      groupsMap.set(key, { key, label, filterToken, membersHtml: [], openSum: 0, totalSum: 0 });
    }
    return groupsMap.get(key);
  };

  // 1. "Me" (unassigned to colleague) — grouped under getMyTeam() if tagged, else Unassigned / Self
  const myTeamName = getMyTeam();
  const meStats = computeAssigneeStats(name => !name, today, projFilter);
  const meMatchesTeamFilter = !teamFilter || (myTeamName ? teamFilter === myTeamName : teamFilter === '__unassigned__');
  const showMe = meMatchesTeamFilter && (!projFilter || meStats.total > 0 || isSelectedFn('__me__'));
  if (showMe) {
    const meGrpKey = myTeamName ? `team::${myTeamName}` : '__unassigned__';
    const meGrpLabel = myTeamName || 'Unassigned / Self';
    const meGrpToken = myTeamName || '__unassigned__';
    const grp = ensureGroup(meGrpKey, meGrpLabel, meGrpToken);
    grp.openSum += meStats.open;
    grp.totalSum += meStats.total;
    grp.membersHtml.push(buildAssigneePillHtml({
      labelText: 'Me',
      icon: '🙋',
      leftOrg: false,
      stats: meStats,
      isSelected: isSelectedFn('__me__'),
      onClickExpr: "toggleAssigneeSelection('__me__')",
      titleText: `Me${myTeamName ? ' (' + myTeamName + ')' : ''}: ${meStats.open} open, ${meStats.done}/${meStats.total} done`
    }));
  }

  // 2. Named assignees grouped by Team (filtered by active project when projFilter is set)
  const sortedAssignees = [...state.assignees].sort((a, b) => {
    if (!!a.leftOrg !== !!b.leftOrg) return a.leftOrg ? 1 : -1;
    return a.name.localeCompare(b.name);
  });

  sortedAssignees.forEach(a => {
    const tName = (a.team || '').trim();
    if (teamFilter) {
      if (teamFilter === '__unassigned__' && tName) return;
      if (teamFilter !== '__unassigned__' && tName !== teamFilter) return;
    }
    const stats = computeAssigneeStats(n => n.toLowerCase() === a.name.toLowerCase(), today, projFilter);
    // Filter assignees by project when a project is selected (keep selected assignees visible so user can uncheck)
    if (projFilter && stats.total === 0 && !isSelectedFn(a.name)) return;
    if (a.leftOrg && stats.total === 0 && !isSelectedFn(a.name)) return;

    const grpKey = tName ? `team::${tName}` : '__unassigned__';
    const grpLabel = tName || 'Unassigned / Self';
    const grpToken = tName || '__unassigned__';
    const grp = ensureGroup(grpKey, grpLabel, grpToken);
    grp.openSum += stats.open;
    grp.totalSum += stats.total;
    const safeName = esc(a.name).replace(/'/g, "\\'");
    grp.membersHtml.push(buildAssigneePillHtml({
      labelText: a.name,
      icon: a.leftOrg ? '🚪' : '👤',
      leftOrg: !!a.leftOrg,
      stats,
      isSelected: isSelectedFn(a.name),
      onClickExpr: `toggleAssigneeSelection('${safeName}')`,
      titleText: `${a.name}${tName ? ' (' + tName + ')' : ''}: ${stats.open} open, ${stats.done}/${stats.total} done${stats.overdue ? ', ' + stats.overdue + ' overdue' : ''}${stats.blocked ? ', ' + stats.blocked + ' blocked' : ''}`
    }));
  });

  // Sort swimlanes alphabetically with Unassigned / Self placed last
  const lanes = Array.from(groupsMap.values()).sort((a, b) => {
    if (a.key === '__unassigned__') return 1;
    if (b.key === '__unassigned__') return -1;
    return a.label.localeCompare(b.label);
  });

  const lanesHtml = lanes.length === 0
    ? `<div style="font-size:0.78rem;color:var(--text-muted);padding:4px 2px;">No assignees with tasks in ${activeProj ? esc(activeProj.name) : 'this view'}.</div>`
    : lanes.map(lane => {
        const isTeamActive = teamFilter === lane.filterToken;
        const safeToken = esc(lane.filterToken).replace(/'/g, "\\'");
        return `
          <div class="team-lane-card ${isTeamActive ? 'team-active' : ''}">
            <div class="team-lane-header" onclick="filterByTeamName('${safeToken}')" title="Click to filter all tasks & subtasks for ${esc(lane.label)}">
              <span>🏷️ ${esc(lane.label)}</span>
              <span style="font-weight:600;color:var(--text-muted);">${lane.openSum}/${lane.totalSum}</span>
            </div>
            <div class="team-lane-members">${lane.membersHtml.join('')}</div>
          </div>
        `;
      }).join('');

  return `
    <div class="assignee-ribbon-wrap">
      <div class="assignee-ribbon-header">
        <span>
          <strong>👥 Team Swimlanes</strong>
          ${activeProj ? `<span class="badge b-cat" style="margin-left:4px;">📁 ${esc(activeProj.name)}</span>` : ''}
          <span style="opacity:0.8;margin-left:4px;">(click team header to filter team • check members to multi-filter)</span>
        </span>
        <div style="display:flex;gap:8px;align-items:center;">
          ${(selectedList.length > 0 || teamFilter) ? `<button type="button" class="btn btn-xs btn-ghost" onclick="state.ui.taskFilters.assignees=[];state.ui.taskFilters.team='';render()">Clear selection</button>` : ''}
        </div>
      </div>
      <div class="team-swimlanes">${lanesHtml}</div>
    </div>
  `;
}

  if (f.stageId && f.projectId) {
    const st = getStage(getProject(f.projectId), f.stageId);
    if (st) pills.push({ label: `Stage: ${st.name}`, clear: "state.ui.taskFilters.stageId='';render()" });
  }
  if (f.team) {
    pills.push({ label: `🏷️ Team: ${f.team === '__unassigned__' ? 'No Team' : f.team}`, clear: "state.ui.taskFilters.team='';render()" });
  }
  const selAss = getSelectedAssignees();
  if (selAss.length > 0) {
    const names = selAss.map(x => x === '__me__' ? 'Me' : (x === '__delegated__' ? 'Others' : x)).join(', ');
    pills.push({ label: `👤 ${names}`, clear: "state.ui.taskFilters.assignees=[];render()" });

    pills.push({ label: `Status: ${f.status}`, clear: "state.ui.taskFilters.status='__open__';render()" });

    pills.push({ label: `Status: All (incl. Done)`, clear: "state.ui.taskFilters.status='__open__';render()" });
  }
  if (f.due) {
    pills.push({ label: `Due: ${f.due}`, clear: "state.ui.taskFilters.due='';render()" });
  }
  if (f.priority) {
    pills.push({ label: `Priority: ${f.priority}`, clear: "state.ui.taskFilters.priority='';render()" });

    pills.push({ label: f.planned === 'planned' ? '🗓️ Planned' : '📋 Non-planned', clear: "state.ui.taskFilters.planned='';render()" });

  if (f.search) {
    pills.push({ label: `🔍 "${f.search}"`, clear: "state.ui.taskFilters.search='';render()" });

  if (pills.length === 0) return '';
  return `
    <div class="active-filter-pills">

      <button type="button" class="btn btn-xs btn-ghost" onclick="clearTaskFilters()">Reset all</button>
    </div>
  `;
}

function renderTriageStrip() {
  const f = state.ui.taskFilters;
  const today = todayStr();
  const baseTasks = state.tasks.filter(t => (!f.projectId || t.projectId === f.projectId) && (!f.team || (function() {
    const m = (raw) => {
      const c = (raw || '').trim();
      const tm = !c ? getMyTeam() : ((getAssigneeMeta(c)?.team || '').trim());
      return f.team === '__unassigned__' ? !tm : tm === f.team;
    };
    return m(t.assignee) || (t.subtasks || []).some(s => m(s.assignee));
  })()));

  const openBase = baseTasks.filter(t => t.status !== 'Done');
  const allOpenCount = openBase.length;
  const myOrUnassignedCount = openBase.filter(t => !(t.assignee || '').trim()).length;
  const delegatedCount = openBase.filter(t => Boolean((t.assignee || '').trim()) || (t.subtasks || []).some(s => Boolean((s.assignee || '').trim()))).length;

  const selAssignees = getSelectedAssignees();
  const isAllOwn = selAssignees.length === 0;
  const isMyOwn = selAssignees.length === 1 && selAssignees[0] === '__me__';
  const isDelOwn = selAssignees.length === 1 && selAssignees[0] === '__delegated__';

  // Scope urgency counts to the currently selected ownership filter so numbers match what the user sees
  const urgencyPool = selAssignees.length > 0
    ? baseTasks.filter(t => selAssignees.some(tok => matchesAssigneeToken(t.assignee, tok) || (t.subtasks || []).some(s => matchesAssigneeToken(s.assignee, tok))))
    : baseTasks;

  const overdueCount = urgencyPool.filter(t => taskHasOverdue(t, today)).length;
  const dueTodayCount = urgencyPool.filter(t => taskHasDueToday(t, today)).length;
  const blockedCount = urgencyPool.filter(t => t.status === 'Blocked' || (t.status !== 'Done' && isTaskBlockedByUnfinished(t))).length;
  const openCount = urgencyPool.filter(t => t.status !== 'Done').length;

  const isOverdueActive = f.due === 'overdue';
  const isTodayActive = f.due === 'today';
  const isBlockedActive = f.status === 'Blocked' && !f.due;
  const isOpenActive = f.status === '__open__' && !f.due;

  return `
    <div class="tasks-tier-2">
      <div class="triage-group">
        <span class="triage-group-label">Queue</span>
        <div class="triage-seg" role="group" aria-label="Ownership queue">
          <button type="button" class="triage-pill ${isAllOwn ? 'active' : ''}" onclick="state.ui.taskFilters.assignees=[];render()" title="Show all open tasks across the project">
            All <span class="triage-count">${allOpenCount}</span>
          </button>
          <button type="button" class="triage-pill ${isMyOwn ? 'active' : ''}" onclick="state.ui.taskFilters.assignees=['__me__'];render()" title="Tasks not yet delegated to a colleague — ready for you to work on or assign to the team">
            My / Unassigned <span class="triage-count ${myOrUnassignedCount ? 'is-info' : ''}">${myOrUnassignedCount}</span>
          </button>
          <button type="button" class="triage-pill ${isDelOwn ? 'active' : ''}" onclick="state.ui.taskFilters.assignees=['__delegated__'];render()" title="Tasks or subtasks currently assigned to team members">
            Delegated <span class="triage-count">${delegatedCount}</span>
          </button>
        </div>
      </div>

      <div class="triage-group">
        <span class="triage-group-label">Focus</span>
        <div class="triage-seg" role="group" aria-label="Urgency and health">
          <button type="button" class="triage-pill urg-overdue ${isOverdueActive ? 'active' : ''}" onclick="state.ui.taskFilters.due=(state.ui.taskFilters.due==='overdue'?'':'overdue');state.ui.taskFilters.status='__open__';render()" title="Past due date">
            Overdue <span class="triage-count ${overdueCount ? 'is-danger' : ''}">${overdueCount}</span>
          </button>
          <button type="button" class="triage-pill urg-today ${isTodayActive ? 'active' : ''}" onclick="state.ui.taskFilters.due=(state.ui.taskFilters.due==='today'?'':'today');state.ui.taskFilters.status='__open__';render()" title="Due today (${today})">
            Due Today <span class="triage-count ${dueTodayCount ? 'is-info' : ''}">${dueTodayCount}</span>
          </button>
          <button type="button" class="triage-pill urg-blocked ${isBlockedActive ? 'active' : ''}" onclick="state.ui.taskFilters.due='';state.ui.taskFilters.status=(state.ui.taskFilters.status==='Blocked'?'__open__':'Blocked');render()" title="Blocked or waiting on dependencies">
            Blocked / At Risk <span class="triage-count ${blockedCount ? 'is-warn' : ''}">${blockedCount}</span>
          </button>
          <button type="button" class="triage-pill ${isOpenActive ? 'active' : ''}" onclick="state.ui.taskFilters.status='__open__';state.ui.taskFilters.due='';render()" title="All open implementation items">
            Open Scope <span class="triage-count">${openCount}</span>
          </button>
        </div>
      </div>
    </div>
  `;
}

        <div class="tasks-cmd-right">
          <button type="button" class="btn btn-sm ${!state.ui.hideCompleted ? 'btn-primary' : ''}" onclick="toggleHideCompleted()" title="${state.ui.hideCompleted ? 'Show completed tasks and subtasks' : 'Hide completed tasks and subtasks'}">
            ${state.ui.hideCompleted ? '👁️ Show Completed' : '🙈 Hide Completed'}
          </button>
          <button type="button" class="btn btn-sm ${state.ui.showMoreFilters || extraFilterCount ? 'btn-primary' : ''}" onclick="state.ui.showMoreFilters=!state.ui.showMoreFilters;render()" title="Filter by team, stage, status, priority, planning type, or team members">
            🎛️ More Filters${extraFilterCount ? ` (${extraFilterCount})` : ''}
          </button>
          <div class="views-popover-wrap">
            <button type="button" class="btn btn-sm ${activePreset ? 'btn-primary' : ''}" onclick="event.stopPropagation();state.ui.showViewsMenu=!state.ui.showViewsMenu;render()" title="Saved views & default filter">
              🔖 ${activePreset ? esc(activePreset.name) : 'Views'}${presetCount ? ` (${presetCount})` : ''} ▾
            </button>
            ${renderSavedViewsPopover()}
          </div>
          <div class="tab-switch">
            <button class="tab-btn ${state.ui.taskViewMode === 'list' ? 'active' : ''}" onclick="state.ui.taskViewMode='list';render()">📋 List</button>
            <button class="tab-btn ${state.ui.taskViewMode === 'todo' ? 'active' : ''}" onclick="state.ui.taskViewMode='todo';render()">☑️ To-Do</button>
            <button class="tab-btn ${state.ui.taskViewMode === 'kanban' ? 'active' : ''}" onclick="state.ui.taskViewMode='kanban';render()">🗂️ Kanban</button>
          </div>
        </div>
      </div>
      ${renderTriageStrip()}
    </div>

    ${state.ui.showMoreFilters ? `
      <div class="tasks-drawer">
        <div class="tasks-drawer-grid">
          <div>
            <label>Team</label>
            <select onchange="state.ui.taskFilters.team=this.value;render()">
              <option value="" ${!f.team ? 'selected' : ''}>All Teams</option>
              <option value="__unassigned__" ${f.team === '__unassigned__' ? 'selected' : ''}>No Team</option>
              ${getAllTeams().map(tm => `<option value="${esc(tm)}" ${f.team === tm ? 'selected' : ''}>🏷️ ${esc(tm)}</option>`).join('')}
            </select>
          </div>
          ${selectedProj ? `
            <div>
              <label>Stage</label>
              <select onchange="state.ui.taskFilters.stageId=this.value;render()">
                <option value="">All Stages</option>
                ${(selectedProj.stages||[]).map(s => `<option value="${s.id}" ${f.stageId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
              </select>
            </div>
          ` : ''}
          <div>
            <label>Status</label>
            <select onchange="state.ui.taskFilters.status=this.value;if(this.value==='__open__')state.ui.hideCompleted=true;else if(this.value===''||this.value==='Done')state.ui.hideCompleted=false;render()">
              <option value="__open__" ${f.status === '__open__' ? 'selected' : ''}>All Open</option>
              <option value="" ${f.status === '' ? 'selected' : ''}>All (incl. Done)</option>
              ${STATUSES.map(s => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Priority</label>
            <select onchange="state.ui.taskFilters.priority=this.value;render()">
              <option value="">All Priorities</option>
              ${PRIORITIES.map(p => `<option ${f.priority === p ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Planning Type</label>
            <select onchange="state.ui.taskFilters.planned=this.value;render()">
              <option value="" ${!f.planned ? 'selected' : ''}>All Types</option>
              <option value="planned" ${f.planned === 'planned' ? 'selected' : ''}>🗓️ Planned Only</option>
              <option value="nonplanned" ${f.planned === 'nonplanned' ? 'selected' : ''}>📋 Non-planned Only</option>
            </select>
          </div>
        </div>
        ${renderAssigneeProgressStrip()}
      </div>
    ` : ''}

    ${renderActiveFilterPills()}

    <div id="taskResultsContainer">${renderTaskViewContent(tasks)}</div>
  `;
  highlightSearchInContainer(document.getElementById('taskResultsContainer'), f.search);
}

function renderTaskViewContent(tasks) {
  if (state.ui.taskViewMode === 'todo') return renderTodoView(tasks);
  if (state.ui.taskViewMode === 'kanban') return renderKanban(tasks);
  return renderTaskList(tasks);
}

function refreshTaskResults() {
  const box = document.getElementById('taskResultsContainer');
  if (!box) return;
  const tasks = getFilteredTasks();
  box.innerHTML = renderTaskViewContent(tasks);
  highlightSearchInContainer(box, state.ui.taskFilters.search);
}

function clearTaskFilters() {
  state.ui.taskFilters = { search: '', projectId: '', stageId: '', status: '__open__', priority: '', due: '', assignees: [], team: '', planned: '', defaultApplied: true };
  state.ui.activeTaskPresetId = '';
  state.ui.hideCompleted = true;
  render();
}

function renderTaskList(tasks) {
  if (tasks.length === 0) {
    return `<div class="card empty-state">No tasks match your filters. Click <strong>+ New Task</strong> to add one.</div>`;
  }
  const selectedAssignees = getSelectedAssignees();
  const teamFilter = state.ui.taskFilters.team || '';
  const hasAssigneeOrTeamFilter = selectedAssignees.length > 0 || Boolean(teamFilter);

  const doesSubMatchFilter = (s) => {
    if (!hasAssigneeOrTeamFilter) return false;
    let ok = true;
    if (selectedAssignees.length > 0) {
      ok = ok && s.status !== 'Done' && selectedAssignees.some(tok => matchesAssigneeToken(s.assignee, tok));
    }
    if (teamFilter) {
      const clean = (s.assignee || '').trim();
      const tm = !clean ? getMyTeam() : ((getAssigneeMeta(clean)?.team || '').trim());
      ok = ok && (teamFilter === '__unassigned__' ? !tm : tm === teamFilter);
    }
    return ok;
  };

  const renderTaskCard = (t) => {
    const proj = getProject(t.projectId);
    const stage = getStage(proj, t.stageId);
    const blocker = isTaskBlockedByUnfinished(t);
    const billable = isTaskBillable(t);
    const plannedFlag = isTaskPlanned(t);
    const allSubs = t.subtasks || [];
    const matchingSubs = hasAssigneeOrTeamFilter ? allSubs.filter(doesSubMatchFilter) : [];
    const baseSubs = (hasAssigneeOrTeamFilter && matchingSubs.length > 0) ? matchingSubs : allSubs;
    const hideDoneSubs = state.ui.hideCompleted || selectedAssignees.length > 0;
    const hiddenDoneSubsCount = hideDoneSubs ? baseSubs.filter(s => s.status === 'Done').length : 0;
    const subs = hideDoneSubs ? baseSubs.filter(s => s.status !== 'Done') : baseSubs;
    const doneSubs = allSubs.filter(s => s.status === 'Done').length;
    const pct = allSubs.length ? Math.round((doneSubs / allSubs.length) * 100) : 0;
    const running = isTimerRunningFor(t.id, null);
    const tAssigneeMeta = t.assignee ? getAssigneeMeta(t.assignee) : null;
    const tTeam = t.assignee ? ((tAssigneeMeta?.team || '').trim()) : getMyTeam();
    const safeTTeam = esc(tTeam).replace(/'/g, "\\'");

    return `
      <div class="task-item" onclick="openTaskModal('${t.id}')" title="Click to edit task">
        <div>
          <div class="task-title-row">
            <input type="checkbox" ${t.status === 'Done' ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleTaskDone('${t.id}')" title="Toggle Done" />
            <span class="task-title ${t.status === 'Done' ? 'done' : ''}">${esc(t.title)}</span>
            <span class="badge ${statusBadgeClass(t.status)}">${esc(t.status)}</span>
            <span class="badge ${priorityBadgeClass(t.priority)}">${esc(t.priority)}</span>
            <span class="badge ${plannedFlag ? 'b-progress' : 'b-todo'}" title="${plannedFlag ? 'Planned task' : 'Non-planned task'}">${plannedFlag ? '🗓️ Planned' : '📋 Non-planned'}</span>
            ${t.assignee ? `<span class="badge b-assignee" title="Assigned to: ${esc(t.assignee)}">👤 ${esc(t.assignee)}</span>` : ''}
            ${tTeam ? `<span class="badge b-cat clickable-team-badge" onclick="event.stopPropagation();filterByTeamName('${safeTTeam}')" title="Click to show tasks & subtasks for team ${esc(tTeam)}">🏷️ ${esc(tTeam)}</span>` : ''}
            <span class="badge ${billable ? 'b-billable' : 'b-nonbillable'}">${billable ? '💲 Billable' : 'Non-billable'}</span>
            ${t.recurrence && t.recurrence !== 'none' ? `<span class="badge b-todo" title="Automatically creates next occurrence when marked Done">🔁 ${esc(t.recurrence)}</span>` : ''}
            ${blocker ? `<span class="badge b-warn" title="This task is blocked until '${esc(blocker.title)}' is marked Done">⚠️ Blocked by: ${esc(blocker.title)}</span>` : ''}
          </div>
          ${t.description ? `<div class="rte-rendered" style="font-size:0.84rem;color:var(--text-muted);margin-top:5px;">${sanitizeNoteHtml(t.description)}</div>` : ''}
          <div class="task-meta">
            <span>📁 ${esc(proj ? proj.name : 'Unknown')}${stage ? ` › ${esc(stage.name)}` : ''}</span>
            ${t.dueDate ? `<span>📅 Due: <strong>${esc(t.dueDate)}</strong></span>` : ''}
            ${t.plannedDate ? `<span>🗓 Planned: ${esc(t.plannedDate)}${t.plannedStartTime ? ` at ${esc(t.plannedStartTime)}` : ''}</span>` : ''}
            ${t.externalRef ? `<span>🔗 Ref: <strong>${esc(t.externalRef)}</strong></span>` : ''}
          </div>
          <div onclick="event.stopPropagation()">${renderIntegrationActions(t, null)}</div>

          ${allSubs.length > 0 ? `
            <div class="progress-wrap">
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
              <span class="progress-text">${doneSubs} of ${allSubs.length} subtasks done (${pct}%)${hiddenDoneSubsCount > 0 ? ` • <a href="#" onclick="event.preventDefault();event.stopPropagation();toggleHideCompleted()" style="color:var(--primary);text-decoration:none;">Show ${hiddenDoneSubsCount} completed</a>` : ''}</span>
            </div>
          ` : ''}
        </div>

        <div class="task-actions-bar" onclick="event.stopPropagation()">
          ${running
            ? `<button class="btn btn-sm btn-danger" onclick="stopActiveTimer()">⏹ Stop</button>`
            : `<button class="btn btn-sm" onclick="startTimer('${t.id}')" title="Start tracking time on this task">▶ Start</button>`}
          <button class="btn btn-sm" onclick="openSubtaskModal('${t.id}')" title="Break this task into smaller subtasks">+ Subtask</button>
          <button class="btn btn-sm" onclick="duplicateTask('${t.id}')" title="Make a copy of this task and its subtasks">📋 Copy</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--danger)" onclick="deleteTask('${t.id}')">Delete</button>
        </div>

        ${subs.length > 0 ? `
          <div class="subtasks-box" onclick="event.stopPropagation()">
            ${(hasAssigneeOrTeamFilter && matchingSubs.length > 0 && matchingSubs.length < allSubs.length) ? `<div style="font-size:0.75rem;color:var(--primary);font-weight:600;margin-bottom:6px;">Showing ${matchingSubs.length} matching subtask(s) of ${allSubs.length}</div>` : ''}
            ${subs.map(sub => {
              const subRunning = isTimerRunningFor(t.id, sub.id);
              const isMatchedSub = doesSubMatchFilter(sub);
              const sTeam = sub.assignee ? ((getAssigneeMeta(sub.assignee)?.team || '').trim()) : getMyTeam();
              const safeSTeam = esc(sTeam).replace(/'/g, "\\'");
              return `
                <div class="subtask-row ${isMatchedSub ? 'assignee-match' : ''}" onclick="openSubtaskModal('${t.id}','${sub.id}')" title="Click to edit subtask">
                  <div class="subtask-left">
                    <input type="checkbox" ${sub.status === 'Done' ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleSubtaskDone('${t.id}','${sub.id}')" />
                    <span class="${sub.status === 'Done' ? 'task-title done' : ''}" style="font-weight:600;font-size:0.84rem;">${esc(sub.title)}</span>
                    ${sub.description ? `<span class="rte-rendered" style="font-size:0.78rem;color:var(--text-muted);">${sanitizeNoteHtml(sub.description)}</span>` : ''}
                  </div>
                  <div class="subtask-footer">
                    <div class="subtask-actions-left" onclick="event.stopPropagation()">
                      ${renderIntegrationActions(t, sub, true)}
                      ${subRunning
                        ? `<button class="btn btn-xs btn-danger" onclick="stopActiveTimer()">⏹ Stop</button>`
                        : `<button class="btn btn-xs" onclick="startTimer('${t.id}','${sub.id}')">▶ Start</button>`}
                      <button class="btn btn-xs" onclick="openMoveSubtaskModal('${t.id}','${sub.id}')" title="Move this subtask to its own project as a standalone task">📁 Move</button>
                      <button class="btn btn-xs btn-ghost" style="color:var(--danger)" onclick="deleteSubtask('${t.id}','${sub.id}')">✕</button>
                    </div>
                    <div class="subtask-tags-right">
                      <span class="badge ${statusBadgeClass(sub.status)}">${esc(sub.status)}</span>
                      ${sub.assignee ? `<span class="badge b-assignee" title="Assigned to: ${esc(sub.assignee)}">👤 ${esc(sub.assignee)}</span>` : ''}
                      ${sTeam ? `<span class="badge b-cat clickable-team-badge" onclick="event.stopPropagation();filterByTeamName('${safeSTeam}')" title="Click to show tasks & subtasks for team ${esc(sTeam)}">🏷️ ${esc(sTeam)}</span>` : ''}
                      ${sub.dueDate ? `<span style="font-size:0.76rem;${isSubtaskOverdue(sub) ? 'color:var(--danger);font-weight:700;' : 'color:var(--text-muted);'}">${isSubtaskOverdue(sub) ? '🔥 Overdue ' : 'Due '}${esc(sub.dueDate)}</span>` : ''}
                      ${sub.plannedDate ? `<span style="font-size:0.76rem;color:var(--text-muted)">Planned ${esc(sub.plannedDate)} ${esc(sub.plannedStartTime || '')}</span>` : ''}
                      ${renderSubtaskDependencyBadge(sub)}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}
      </div>
    `;
  };

  const openTasks = tasks.filter(t => t.status !== 'Done');
  const doneTasks = tasks.filter(t => t.status === 'Done');
  let out = openTasks.map(renderTaskCard).join('');
  if (doneTasks.length > 0) {
    out += `
      <div class="completed-divider-bar" onclick="toggleHideCompleted()" title="Click to hide completed tasks & subtasks">
        <span>✓ Completed (${doneTasks.length})</span>
        <span style="font-weight:600;color:var(--primary);">Hide completed</span>
      </div>
      ${doneTasks.map(renderTaskCard).join('')}
    `;
  }
  return out;
}

function selectTodoTask(taskId) {
  state.ui.selectedTodoTaskId = taskId || '';
  refreshTaskResults();
}

function closeTodoDetailPane() {
  state.ui.selectedTodoTaskId = '';
  refreshTaskResults();
}

function addQuickTodoSubtask(e, taskId) {
  e.preventDefault();
  const inp = document.getElementById('todoQuickStepInput');
  const title = (inp?.value || '').trim();
  if (!title) return;
  const t = getTask(taskId);
  if (!t) return;
  if (!Array.isArray(t.subtasks)) t.subtasks = [];
  const createdSub = {
    id: uid('sub'),
    title,
    description: '',
    assignee: '',
    status: 'To do',
    dueDate: '',
    category: t.category || 'Administrative',
    plannedDate: '',
    plannedStartTime: '',
    estimatedHours: 0,
    externalRef: '',
    blockedByTaskId: '',
    learningProgress: 0
  };
  t.subtasks.push(createdSub);
  saveState();
  render();
  showToast('Subtask added');
  setTimeout(() => document.getElementById('todoQuickStepInput')?.focus(), 20);
}

function renderTodoView(tasks) {
  if (tasks.length === 0) {
    return `<div class="card empty-state">No tasks match your filters. Click <strong>+ New Task</strong> to add one.</div>`;
  }
  const today = todayStr();
  let selectedTask = state.ui.selectedTodoTaskId
    ? tasks.find(t => t.id === state.ui.selectedTodoTaskId)
    : null;
  if (!selectedTask && state.ui.selectedTodoTaskId) {
    state.ui.selectedTodoTaskId = '';
  }

  const renderTodoRow = (t) => {
    const isSel = selectedTask && selectedTask.id === t.id;
    const isDone = t.status === 'Done';
    const proj = getProject(t.projectId);
    const subs = t.subtasks || [];
    const doneSubs = subs.filter(s => s.status === 'Done').length;
    const isOverdue = taskHasOverdue(t, today);
    const isDueToday = taskHasDueToday(t, today);
    const blocker = isTaskBlockedByUnfinished(t);
    const dueColor = isOverdue ? 'color:var(--danger);font-weight:700;' : (isDueToday ? 'color:var(--info);font-weight:700;' : '');

    return `
      <div class="ms-todo-row ${isSel ? 'selected' : ''}" onclick="selectTodoTask('${t.id}')">
        <button type="button" class="ms-todo-check ${isDone ? 'checked' : ''}"
          onclick="event.stopPropagation();toggleTaskDone('${t.id}')"
          title="${isDone ? 'Mark as To do' : 'Mark as Done'}">✓</button>
        <div class="ms-todo-row-body">
          <div class="ms-todo-row-title ${isDone ? 'done' : ''}">${esc(t.title)}</div>
          <div class="ms-todo-row-meta">
            <span>📁 ${esc(proj ? proj.name : 'No project')}</span>
            ${subs.length ? `<span>☑ ${doneSubs} of ${subs.length}</span>` : ''}
            ${t.dueDate ? `<span style="${dueColor}">📅 ${esc(t.dueDate)}</span>` : ''}
            ${t.assignee ? `<span>👤 ${esc(t.assignee)}</span>` : ''}
            ${t.status === 'In progress' ? `<span style="color:var(--info);font-weight:600;">● In progress</span>` : ''}
            ${(t.status === 'Blocked' || blocker) ? `<span style="color:var(--danger);font-weight:600;">⚠️ Blocked</span>` : ''}
          </div>
        </div>
        <div class="ms-todo-row-right">
          ${t.priority === 'High' ? `<span style="color:var(--danger);font-size:0.95rem;" title="High priority">★</span>` : ''}
        </div>
      </div>
    `;
  };
  const openTodoTasks = tasks.filter(t => t.status !== 'Done');
  const doneTodoTasks = tasks.filter(t => t.status === 'Done');
  const rowsHtml = openTodoTasks.map(renderTodoRow).join('') + (doneTodoTasks.length > 0 ? `
    <div class="completed-divider-bar" onclick="toggleHideCompleted()" title="Click to hide completed tasks & subtasks">
      <span>✓ Completed (${doneTodoTasks.length})</span>
      <span style="font-weight:600;color:var(--primary);">Hide completed</span>
    </div>
    ${doneTodoTasks.map(renderTodoRow).join('')}
  ` : '');

  let detailHtml = '';
  if (selectedTask) {
    const t = selectedTask;
    const proj = getProject(t.projectId);
    const stage = getStage(proj, t.stageId);
    const isDone = t.status === 'Done';
    const subs = t.subtasks || [];
    const doneSubs = subs.filter(s => s.status === 'Done').length;
    const pct = subs.length ? Math.round((doneSubs / subs.length) * 100) : 0;
    const running = isTimerRunningFor(t.id, null);
    const blocker = isTaskBlockedByUnfinished(t);
    const plannedFlag = isTaskPlanned(t);
    const tAssigneeMeta = t.assignee ? getAssigneeMeta(t.assignee) : null;
    const tTeam = t.assignee ? ((tAssigneeMeta?.team || '').trim()) : getMyTeam();

    detailHtml = `
      <aside class="ms-todo-detail-pane">
        <div class="ms-todo-detail-head">
          <button type="button" class="ms-todo-check ${isDone ? 'checked' : ''}"
            onclick="toggleTaskDone('${t.id}')"
            title="${isDone ? 'Mark as To do' : 'Mark as Done'}">✓</button>
          <div style="flex:1;min-width:0;cursor:pointer;" onclick="openTaskModal('${t.id}')" title="Click to edit task">
            <div style="font-weight:700;font-size:1rem;line-height:1.3;${isDone ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">${esc(t.title)}</div>
            <div style="font-size:0.76rem;color:var(--text-muted);margin-top:3px;">
              📁 ${esc(proj ? proj.name : 'Unknown')}${stage ? ` › ${esc(stage.name)}` : ''}
            </div>
          </div>
          <button type="button" class="btn btn-xs btn-ghost" onclick="closeTodoDetailPane()" title="Close details pane">✕</button>
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;">
          <span class="badge ${statusBadgeClass(t.status)}">${esc(t.status)}</span>
          <span class="badge ${priorityBadgeClass(t.priority)}">${esc(t.priority)}</span>
          <span class="badge ${plannedFlag ? 'b-progress' : 'b-todo'}">${plannedFlag ? '🗓️ Planned' : '📋 Non-planned'}</span>
          ${t.assignee ? `<span class="badge b-assignee">👤 ${esc(t.assignee)}</span>` : ''}
          ${tTeam ? `<span class="badge b-cat">🏷️ ${esc(tTeam)}</span>` : ''}
          ${t.dueDate ? `<span class="badge b-todo">📅 Due ${esc(t.dueDate)}</span>` : ''}
          ${t.plannedDate ? `<span class="badge b-todo">🗓 ${esc(t.plannedDate)}${t.plannedStartTime ? ' ' + esc(t.plannedStartTime) : ''}</span>` : ''}
          ${blocker ? `<span class="badge b-warn">⚠️ Blocked by: ${esc(blocker.title)}</span>` : ''}
        </div>

        ${renderIntegrationActions(t, null)}

        <div class="ms-todo-section" style="margin-top:10px;cursor:pointer;" onclick="openTaskModal('${t.id}')" title="Click to edit task">
          <div class="ms-todo-section-title">
            <span>📝 Description</span>
          </div>
          ${t.description
            ? `<div class="rte-rendered" style="font-size:0.85rem;color:var(--text);">${sanitizeNoteHtml(t.description)}</div>`
            : `<div style="font-size:0.8rem;color:var(--text-muted);font-style:italic;">No description yet. Click to add details.</div>`}
        </div>

        <div class="ms-todo-section">
          <div class="ms-todo-section-title">
            <span>☑️ Subtasks (${doneSubs}/${subs.length})</span>
            <div style="display:flex;gap:4px;align-items:center;">
              ${doneSubs > 0 ? `<button type="button" class="btn btn-xs btn-ghost" onclick="toggleHideCompleted()" title="${state.ui.hideCompleted ? 'Show completed subtasks' : 'Hide completed subtasks'}">${state.ui.hideCompleted ? `Show ${doneSubs} done` : 'Hide done'}</button>` : ''}
              <button type="button" class="btn btn-xs btn-ghost" onclick="openSubtaskModal('${t.id}')">+ Detailed</button>
            </div>
          </div>
          ${subs.length > 0 ? `
            <div class="progress-wrap" style="margin-top:0;margin-bottom:8px;">
              <div class="progress-track" style="max-width:none;"><div class="progress-fill" style="width:${pct}%"></div></div>
              <span class="progress-text">${pct}%</span>
            </div>
            <div>
              ${((state.ui.hideCompleted || getSelectedAssignees().length > 0) ? subs.filter(sub => sub.status !== 'Done') : subs).map(sub => {
                const sDone = sub.status === 'Done';
                const subRunning = isTimerRunningFor(t.id, sub.id);
                return `
                  <div class="ms-todo-step-row" style="cursor:pointer;" onclick="openSubtaskModal('${t.id}','${sub.id}')" title="Click to edit subtask">
                    <button type="button" class="ms-todo-check ${sDone ? 'checked' : ''}"
                      style="width:17px;height:17px;font-size:0.66rem;"
                      onclick="event.stopPropagation();toggleSubtaskDone('${t.id}','${sub.id}')"
                      title="${sDone ? 'Mark To do' : 'Mark Done'}">✓</button>
                    <div style="flex:1;min-width:0;">
                      <div style="font-weight:600;${sDone ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">${esc(sub.title)}</div>
                      ${sub.description ? `<div class="rte-rendered" style="font-size:0.76rem;color:var(--text-muted);margin-top:2px;">${sanitizeNoteHtml(sub.description)}</div>` : ''}
                      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;font-size:0.72rem;color:var(--text-muted);align-items:center;" onclick="event.stopPropagation()">
                        ${sub.assignee ? `<span class="badge b-assignee" style="font-size:0.68rem;">👤 ${esc(sub.assignee)}</span>` : ''}
                        ${sub.dueDate ? `<span style="${isSubtaskOverdue(sub, today) ? 'color:var(--danger);font-weight:700;' : ''}">${isSubtaskOverdue(sub, today) ? '🔥' : '📅'} ${esc(sub.dueDate)}</span>` : ''}
                        ${subRunning
                          ? `<button type="button" class="btn btn-xs btn-danger" onclick="stopActiveTimer()">⏹</button>`
                          : `<button type="button" class="btn btn-xs btn-ghost" onclick="startTimer('${t.id}','${sub.id}')" title="Start timer">▶</button>`}
                        <button type="button" class="btn btn-xs btn-ghost" style="color:var(--danger)" onclick="deleteSubtask('${t.id}','${sub.id}')" title="Delete subtask">✕</button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `<div style="font-size:0.8rem;color:var(--text-muted);">No subtasks yet.</div>`}
          <form class="ms-todo-add-step" onsubmit="addQuickTodoSubtask(event, '${t.id}')">
            <input type="text" id="todoQuickStepInput" placeholder="+ Add step (press Enter)..." />
            <button type="submit" class="btn btn-xs btn-primary">Add</button>
          </form>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border);">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${running
              ? `<button class="btn btn-xs btn-danger" onclick="stopActiveTimer()">⏹ Stop</button>`
              : `<button class="btn btn-xs" onclick="startTimer('${t.id}')">▶ Start</button>`}
            <button class="btn btn-xs" onclick="duplicateTask('${t.id}')">📋 Copy</button>
          </div>
          <button class="btn btn-xs btn-ghost" style="color:var(--danger)" onclick="deleteTask('${t.id}')">Delete</button>
        </div>
      </aside>
    `;
  }

  return `
    <div class="ms-todo-layout ${selectedTask ? '' : 'no-detail'}">
      <div class="ms-todo-list-pane">
        ${rowsHtml}
      </div>
      ${detailHtml}
    </div>
  `;
}

function renderKanban(tasks) {
  return `
    <div class="kanban-grid">
      ${STATUSES.map(status => {
        const colTasks = tasks.filter(t => t.status === status);
        return `
          <div class="kanban-col"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="handleKanbanDrop(event, '${status}', this)">
            <div class="kanban-col-header">
              <span>${status}</span>
              <span class="badge ${statusBadgeClass(status)}">${colTasks.length}</span>
            </div>
            ${colTasks.map(t => {
              const proj = getProject(t.projectId);
              const blocker = isTaskBlockedByUnfinished(t);
              const subs = t.subtasks || [];
              const doneSubs = subs.filter(s => s.status === 'Done').length;
              return `
                <div class="kanban-card" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${t.id}')" onclick="openTaskModal('${t.id}')" title="Click to edit task">
                  <div style="font-weight:700;font-size:0.88rem;margin-bottom:6px;">
                    ${blocker ? '<span title="Blocked by ' + esc(blocker.title) + '">⚠️ </span>' : ''}${esc(t.title)}
                  </div>
                  <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">
                    <span class="badge ${priorityBadgeClass(t.priority)}">${esc(t.priority)}</span>
                    ${t.assignee ? `<span class="badge b-assignee">👤 ${esc(t.assignee)}</span>` : ''}
                  </div>
                  <div style="font-size:0.76rem;color:var(--text-muted);margin-bottom:8px;">
                    📁 ${esc(proj ? proj.name : 'No project')}
                    ${t.dueDate ? ` • 📅 ${esc(t.dueDate)}` : ''}
                    ${subs.length ? ` • ☑ ${doneSubs}/${subs.length}` : ''}
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;" onclick="event.stopPropagation()">
                    ${isTimerRunningFor(t.id, null)
                      ? `<button class="btn btn-xs btn-danger" onclick="stopActiveTimer()">⏹ Stop</button>`
                      : `<button class="btn btn-xs" onclick="startTimer('${t.id}')">▶ Timer</button>`}
                  </div>
                </div>
              `;
            }).join('') || '<div style="font-size:0.8rem;color:var(--text-muted);text-align:center;padding:20px 6px;">Drag tasks here</div>'}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function handleKanbanDrop(event, newStatus, colEl) {
  event.preventDefault();
  colEl.classList.remove('drag-over');
  const taskId = event.dataTransfer.getData('text/plain');
  const task = getTask(taskId);
  if (task && task.status !== newStatus) {
    const wasDone = task.status === 'Done';
    task.status = newStatus;
    if (!wasDone && newStatus === 'Done') spawnNextRecurringTask(task);
    saveState();
    render();
    showToast(`Moved to ${newStatus}`);
  }
}

function toggleTaskDone(taskId) {
  const t = getTask(taskId);
  if (!t) return;
  const wasDone = t.status === 'Done';
  t.status = wasDone ? 'To do' : 'Done';
  if (!wasDone && t.status === 'Done') {
    spawnNextRecurringTask(t);
  }
  saveState();
  render();
}


function orderTaskSubtasks(task) {
  if (!task || !Array.isArray(task.subtasks) || task.subtasks.length <= 1) return;
  const openSubs = task.subtasks.filter(s => s.status !== 'Done');
  const doneSubs = task.subtasks.filter(s => s.status === 'Done');
  task.subtasks = [...openSubs, ...doneSubs];
}

function toggleSubtaskDone(taskId, subId) {
  const t = getTask(taskId);
  if (!t) return;
  const s = (t.subtasks || []).find(x => x.id === subId);
  if (!s) return;
  const wasDone = s.status === 'Done';
  s.status = wasDone ? 'To do' : 'Done';
  orderTaskSubtasks(t);
  syncCalendarContainerStatus(t);
  saveState();
  render();
}

function toggleTaskOptionalFields(show) {
  const sec = document.getElementById('taskOptionalSection');
  const btn = document.getElementById('toggleTaskOptionalBtn');
  if (!sec || !btn) return;
  sec.style.display = show ? 'block' : 'none';
  btn.textContent = show ? '🔒 Hide Extra Fields' : '🔓 Show Extra Fields';
}

function openQuickAddTaskModal() {
  openTaskModal(null, { quickMode: true });
}

let tempTaskSubtaskRows = [];
let draggedSubtaskRowIdx = null;

function addTaskModalSubtaskRow(prefill = {}) {
  tempTaskSubtaskRows.push({
    id: prefill.id || null,
    title: prefill.title || '',
    description: prefill.description || '',
    assignee: prefill.assignee || '',
    status: prefill.status || 'To do',
    category: prefill.category || '',
    dueDate: prefill.dueDate || '',
    plannedDate: prefill.plannedDate || '',
    plannedStartTime: prefill.plannedStartTime || '',
    estimatedHours: Number(prefill.estimatedHours || 0),
    externalRef: prefill.externalRef || '',
    blockedByTaskId: prefill.blockedByTaskId || '',
    learningProgress: Number(prefill.learningProgress || 0)
  });
  renderTaskModalSubtaskGrid();
  const titleInputs = document.querySelectorAll('#tSubtaskGridRows .st-grid-title-input');
  if (titleInputs.length > 0) titleInputs[titleInputs.length - 1].focus();
}

function removeTaskModalSubtaskRow(idx) {
  tempTaskSubtaskRows.splice(idx, 1);
  renderTaskModalSubtaskGrid();
}

function toggleTaskModalSubtaskDone(idx, checked) {
  if (!tempTaskSubtaskRows[idx]) return;
  tempTaskSubtaskRows[idx].status = checked ? 'Done' : 'To do';
  renderTaskModalSubtaskGrid();
}

function onSubtaskGridDragStart(event, idx) {
  draggedSubtaskRowIdx = idx;
  event.dataTransfer.effectAllowed = 'move';
  try { event.dataTransfer.setData('text/plain', String(idx)); } catch (e) {}
}

function onSubtaskGridDragOver(event, rowEl) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  if (rowEl) rowEl.classList.add('drag-over');
}

function onSubtaskGridDragLeave(rowEl) {
  if (rowEl) rowEl.classList.remove('drag-over');
}

function onSubtaskGridDrop(event, targetIdx, rowEl) {
  event.preventDefault();
  if (rowEl) rowEl.classList.remove('drag-over');
  let fromIdx = draggedSubtaskRowIdx;
  if (fromIdx === null || fromIdx === undefined) {
    try { fromIdx = Number(event.dataTransfer.getData('text/plain')); } catch (e) { fromIdx = -1; }
  }
  draggedSubtaskRowIdx = null;
  if (isNaN(fromIdx) || fromIdx < 0 || fromIdx >= tempTaskSubtaskRows.length || fromIdx === targetIdx) return;
  const [moved] = tempTaskSubtaskRows.splice(fromIdx, 1);
  tempTaskSubtaskRows.splice(targetIdx, 0, moved);
  renderTaskModalSubtaskGrid();
}

function renderTaskModalSubtaskGrid() {
  const wrap = document.getElementById('tSubtaskGridRows');
  if (!wrap) return;
  if (tempTaskSubtaskRows.length === 0) {
    wrap.innerHTML = `<div style="font-size:0.76rem;color:var(--text-muted);padding:4px 2px;">No subtasks added yet. Click <strong>+ Add Subtask Row</strong> to add rows with Title, Description, and Assignee.</div>`;
    return;
  }
  wrap.innerHTML = tempTaskSubtaskRows.map((r, i) => {
    const isDone = r.status === 'Done';
    return `
      <div class="modal-subtask-grid-row ${isDone ? 'is-done-row' : ''}"
        draggable="true"
        ondragstart="onSubtaskGridDragStart(event, ${i})"
        ondragover="onSubtaskGridDragOver(event, this)"
        ondragleave="onSubtaskGridDragLeave(this)"
        ondrop="onSubtaskGridDrop(event, ${i}, this)">
        <span class="st-drag-handle" title="Drag to reorder subtask">⋮⋮</span>
        <input type="checkbox" class="st-grid-done-input" ${isDone ? 'checked' : ''}
          onchange="toggleTaskModalSubtaskDone(${i}, this.checked)"
          title="${isDone ? 'Completed (uncheck to mark To do)' : 'Mark subtask as Completed'}"
          style="width:15px;height:15px;cursor:pointer;accent-color:var(--primary);" />
        <input type="text" class="st-grid-title-input" value="${esc(r.title)}" oninput="tempTaskSubtaskRows[${i}].title=this.value" placeholder="Subtask title *" />
        <input type="text" class="st-grid-desc-input" value="${esc(r.description)}" oninput="tempTaskSubtaskRows[${i}].description=this.value" placeholder="Description (optional)" />
        <input type="text" class="st-grid-assignee-input" list="colleaguesDatalist" value="${esc(r.assignee)}" oninput="tempTaskSubtaskRows[${i}].assignee=this.value" placeholder="Assignee (Me)" />
        ${isDone ? `<span class="badge b-done">✅ Completed</span>` : `<span class="badge b-todo" style="opacity:0.75;">${esc(r.status || 'To do')}</span>`}
        <button type="button" class="btn btn-xs btn-ghost" style="color:var(--danger)" onclick="removeTaskModalSubtaskRow(${i})" title="Remove row">✕</button>
      </div>
    `;
  }).join('');
}

        <div class="form-group">

            ${getAllAssignees(false).map(c => {

            }).join('')}

        </div>

          <select id="tStage"></select>

        <div class="form-group">

        <div class="field-hint">Supports tables: paste directly from Excel, Google Sheets, or Markdown, or use the table buttons above (Tab moves across cells).</div>

      <div class="modal-footer" style="justify-content:space-between;">
        <div>
          ${t ? `<button type="button" class="btn btn-sm btn-success" onclick="openQuickLogActualModal('${t.id}', null)" title="Mark this planned task as actual time">✓ Log Actual</button>` : ''}
        </div>
        <div style="display:flex;gap:8px;">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </div>
    </form>
  `, { wideContent: true });

  populateStageDropdown(defaultProjId, t?.stageId || '');
  renderTaskModalSubtaskGrid();
  initRichEditorTableSupport('tDesc');
}

function populateStageDropdown(projectId, selectedStageId = '') {
  const proj = getProject(projectId);
  const sel = document.getElementById('tStage');
  if (!sel) return;
  const stages = proj?.stages || [];
  sel.innerHTML = `<option value="">None</option>` + stages.map(s =>
    `<option value="${s.id}" ${selectedStageId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`
  ).join('');
}

function saveTaskForm(e, taskId) {
  if (e && typeof e.preventDefault === 'function') e.preventDefault();
  try {
    const cleanId = (typeof taskId === 'string') ? taskId.trim() : '';
    const existingTask = cleanId ? getTask(cleanId) : null;
    const defProj = getDefaultProject();
    const projectId = (document.getElementById('tProject')?.value || defProj?.id || state.projects[0]?.id || '').trim();
    const stageId = (document.getElementById('tStage')?.value || '').trim();
    const title = (document.getElementById('tTitle')?.value || '').trim();
    if (!title) {
      alert('Please enter a task title.');
      document.getElementById('tTitle')?.focus();
      return;
    }

    const rawDescHtml = document.getElementById('tDesc')?.innerHTML || '';
    const safeDesc = (typeof sanitizeNoteHtml === 'function') ? sanitizeNoteHtml(rawDescHtml) : rawDescHtml;

    const payload = {
      projectId,
      stageId,
      title,
      assignee: (document.getElementById('tAssignee')?.value || '').trim(),
      description: safeDesc,
      status: document.getElementById('tStatus')?.value || 'To do',
      priority: document.getElementById('tPriority')?.value || 'Medium',
      dueDate: document.getElementById('tDue')?.value || '',
      billableOverride: document.getElementById('tBillable')?.value || 'inherit',
      blockedByTaskId: document.getElementById('tBlockedBy')?.value || '',
      plannedDate: document.getElementById('tPlannedDate')?.value || '',
      plannedStartTime: document.getElementById('tPlannedTime')?.value || '',
      estimatedHours: Number(document.getElementById('tEstHours')?.value || 0),
      plannedStatus: (function() {
        const selVal = document.getElementById('tPlannedStatus')?.value || 'nonplanned';
        const pDate = document.getElementById('tPlannedDate')?.value || '';
        if (pDate && selVal === 'nonplanned' && !cleanId) return 'planned';
        return selVal;
      })(),
      learningProgress: Number(document.getElementById('tLearningProgress')?.value || 0),
      recurrence: document.getElementById('tRecurrence')?.value || 'none'
    };

    // Sync any live DOM values from the subtask grid into tempTaskSubtaskRows
    const domGridRows = document.querySelectorAll('#tSubtaskGridRows .modal-subtask-grid-row');
    if (domGridRows.length > 0 && Array.isArray(tempTaskSubtaskRows)) {
      domGridRows.forEach((rowEl, idx) => {
        if (!tempTaskSubtaskRows[idx]) return;
        const tInp = rowEl.querySelector('.st-grid-title-input');
        const dInp = rowEl.querySelector('.st-grid-desc-input');
        const aInp = rowEl.querySelector('.st-grid-assignee-input');
        const cInp = rowEl.querySelector('.st-grid-done-input');
        if (tInp) tempTaskSubtaskRows[idx].title = tInp.value;
        if (dInp) tempTaskSubtaskRows[idx].description = dInp.value;
        if (aInp) tempTaskSubtaskRows[idx].assignee = aInp.value;
        if (cInp) {
          if (cInp.checked) tempTaskSubtaskRows[idx].status = 'Done';
          else if (tempTaskSubtaskRows[idx].status === 'Done') tempTaskSubtaskRows[idx].status = 'To do';
        }
      });
    }

    const rows = Array.isArray(tempTaskSubtaskRows) ? tempTaskSubtaskRows : [];

    const builtSubtasks = rows
      .filter(r => r && String(r.title || '').trim())
      .map(r => {
        const cleanTitle = String(r.title || '').trim();
        const cleanDesc = String(r.description || '').trim();
        const cleanAssignee = String(r.assignee || '').trim();
        const cleanStatus = r.status || 'To do';
        const orig = (r.id && existingTask)
          ? (existingTask.subtasks || []).find(s => s.id === r.id)
          : null;
        if (cleanAssignee) ensureAssigneeRecord(cleanAssignee);
        if (orig) {
          const finalDesc = (r.origPlainDesc !== undefined && cleanDesc === r.origPlainDesc)
            ? (orig.description || '')
            : cleanDesc;
          return {
            ...orig,
            title: cleanTitle,
            description: finalDesc,
            assignee: cleanAssignee,
            status: cleanStatus
          };
        }
        return {
          id: uid('sub'),
          title: cleanTitle,
          description: cleanDesc,
          assignee: cleanAssignee,
          status: cleanStatus,
          dueDate: '',
          category: payload.category || 'Administrative',
          plannedDate: '',
          plannedStartTime: '',
          estimatedHours: 0,
          externalRef: '',
          blockedByTaskId: '',
          learningProgress: 0
        };
      });

    if (!Array.isArray(state.tasks)) state.tasks = [];

    if (existingTask) {
      const wasDone = existingTask.status === 'Done';
      const keptSubIds = new Set(builtSubtasks.map(s => s.id));
      const removedSubIds = new Set((existingTask.subtasks || []).map(s => s.id).filter(id => !keptSubIds.has(id)));
      if (removedSubIds.size > 0) {
        if (state.activeTimer && state.activeTimer.taskId === existingTask.id && removedSubIds.has(state.activeTimer.subtaskId)) {
          state.activeTimer = null;
          updateTimerUI();
        }
        state.timeEntries = state.timeEntries.filter(entry => !(entry.taskId === existingTask.id && removedSubIds.has(entry.subtaskId)));
      }
      Object.assign(existingTask, payload, { subtasks: builtSubtasks });
      if (!wasDone && existingTask.status === 'Done') {
        if (typeof spawnNextRecurringTask === 'function') spawnNextRecurringTask(existingTask);
      }
      showToast('Task updated');
    } else {
      const created = { id: uid('task'), subtasks: builtSubtasks, ...payload };
      state.tasks.unshift(created);
      showToast('Task created');
    }

    if (payload.assignee) ensureAssigneeRecord(payload.assignee);
    tempTaskSubtaskRows = [];
    saveState();
    closeModal();
    render();
  } catch (err) {
    console.error('Failed to save task:', err);
    alert('Could not save task due to an error: ' + (err && err.message ? err.message : String(err)));
  }
}

function deleteTask(taskId) {
  const timeCount = state.timeEntries.filter(e => e.taskId === taskId).length;
  const msg = timeCount
    ? `Delete this task, its subtasks, and its ${timeCount} logged time entr${timeCount === 1 ? 'y' : 'ies'}?`
    : 'Delete this task and its subtasks?';
  if (!confirm(msg)) return;
  if (state.activeTimer && state.activeTimer.taskId === taskId) {
    state.activeTimer = null;
    updateTimerUI();
  }
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  state.timeEntries = state.timeEntries.filter(e => e.taskId !== taskId);
  saveState();
  render();
  showToast('Task and its time entries deleted');
}

function saveSubtaskForm(e, taskId, subId) {
  e.preventDefault();
  const t = getTask(taskId);
  if (!t) return;
  if (!t.subtasks) t.subtasks = [];
  const payload = {
    title: document.getElementById('stTitle').value.trim(),
    assignee: (document.getElementById('stAssignee')?.value || '').trim(),
    description: sanitizeNoteHtml(document.getElementById('stDesc')?.innerHTML || ''),
    status: document.getElementById('stStatus').value,
    dueDate: document.getElementById('stDue').value,
    plannedDate: document.getElementById('stPlannedDate').value,
    plannedStartTime: document.getElementById('stPlannedTime').value,
    estimatedHours: Number(document.getElementById('stEstHours').value || 0),
    blockedByTaskId: document.getElementById('stBlockedBy')?.value || ''
  };
  if (subId) {
    const existing = t.subtasks.find(x => x.id === subId);
    const wasDone = existing.status === 'Done';
    Object.assign(existing, payload);
    showToast('Subtask updated');
  } else {
    const createdSub = { id: uid('sub'), ...payload };
    t.subtasks.push(createdSub);
    showToast('Subtask added');
  }
  if (payload.assignee) ensureAssigneeRecord(payload.assignee);
  orderTaskSubtasks(t);
  syncCalendarContainerStatus(t);
  saveState();
  closeModal();
  render();
}

function deleteSubtask(taskId, subId) {
  const t = getTask(taskId);
  if (!t) return;
  if (state.activeTimer && state.activeTimer.taskId === taskId && state.activeTimer.subtaskId === subId) {
    state.activeTimer = null;
    updateTimerUI();
  }
  t.subtasks = (t.subtasks || []).filter(s => s.id !== subId);
  state.timeEntries = state.timeEntries.filter(e => !(e.taskId === taskId && e.subtaskId === subId));
  syncCalendarContainerStatus(t);
  saveState();
  render();
  showToast('Subtask and its time entries deleted');
}

function openMoveSubtaskModal(taskId, subId) {
  const parentTask = getTask(taskId);
  if (!parentTask) return;
  const sub = (parentTask.subtasks || []).find(s => s.id === subId);
  if (!sub) return;
  const isCalItem = Boolean(isCalendarContainerTask(parentTask) || sub.icsUid);
  const activeProjects = state.projects.filter(p => !p.archived && (!isCalItem || p.id !== parentTask.projectId));
  const candidateProjects = activeProjects.length > 0 ? activeProjects : state.projects.filter(p => !p.archived);
  if (candidateProjects.length === 0) {
    alert('Create a project first before moving this item.');
    return;
  }
  const defaultProjId = candidateProjects[0].id;
  openModal(`
    <div class="modal-header">
      <h3>📁 Move to Project</h3>
      <button class="btn btn-xs btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <p class="field-hint" style="margin-bottom:12px;">
      ${isCalItem
        ? `Move <strong>${esc(sub.title)}</strong> into the selected project's <strong>Imported Calendar Events</strong> task as a subtask.`
        : `Move <strong>${esc(sub.title)}</strong> out of <em>${esc(parentTask.title)}</em> so it lives permanently as its own task under the chosen project.`}
    </p>
    <form onsubmit="executeMoveSubtask(event, '${taskId}', '${subId}')">
      <div class="${isCalItem ? '' : 'form-row'}">
        <div class="form-group">
          <label>Target Project *</label>
          <select id="mvProject" required ${isCalItem ? '' : 'onchange="populateMoveStageDropdown(this.value)"'}>
            ${candidateProjects.map(p => `<option value="${p.id}" ${p.id === defaultProjId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        ${isCalItem ? '' : `
          <div class="form-group">
            <label>Stage (optional)</label>
            <select id="mvStage"></select>
          </div>
        `}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">${isCalItem ? 'Move to Imported Calendar Events' : 'Move to Project'}</button>
      </div>
    </form>
  `);
  if (!isCalItem) populateMoveStageDropdown(defaultProjId);
}

function populateMoveStageDropdown(projectId) {
  const proj = getProject(projectId);
  const sel = document.getElementById('mvStage');
  if (!sel) return;
  const stages = proj?.stages || [];
  sel.innerHTML = `<option value="">None</option>` + stages.map(s =>
    `<option value="${s.id}">${esc(s.name)}</option>`
  ).join('');
}

function executeMoveSubtask(e, taskId, subId) {
  e.preventDefault();
  const parentTask = getTask(taskId);
  if (!parentTask) return;
  const subIdx = (parentTask.subtasks || []).findIndex(s => s.id === subId);
  if (subIdx === -1) return;
  const sub = parentTask.subtasks[subIdx];
  const targetProjectId = document.getElementById('mvProject').value;
  const targetStageId = document.getElementById('mvStage')?.value || '';
  const isCalendarEventItem = Boolean(isCalendarContainerTask(parentTask) || sub.icsUid);

  if (isCalendarEventItem) {
    const destTask = ensureProjectCalendarEventsTask(targetProjectId);
    if (destTask.id === parentTask.id) {
      closeModal();
      showToast('Already in this project\'s Imported Calendar Events');
      return;
    }
    parentTask.subtasks.splice(subIdx, 1);
    destTask.subtasks.push(sub);
    orderTaskSubtasks(destTask);

    // Re-link any existing time entries or active timer to the destination project's Imported Calendar Events subtask
    state.timeEntries.forEach(entry => {
      if (entry.taskId === taskId && entry.subtaskId === subId) {
        entry.projectId = targetProjectId;
        entry.taskId = destTask.id;
        entry.subtaskId = sub.id;
      }
    });
    if (state.activeTimer && state.activeTimer.taskId === taskId && state.activeTimer.subtaskId === subId) {
      state.activeTimer.taskId = destTask.id;
      state.activeTimer.subtaskId = sub.id;
    }

    syncCalendarContainerStatus(parentTask);
    syncCalendarContainerStatus(destTask);
    saveState();
    closeModal();
    render();
    const proj = getProject(targetProjectId);
    showToast(`Moved to ${proj ? proj.name : 'project'} › Imported Calendar Events`);
    return;
  }

  const newTaskId = uid('task');
  const newTask = {
    id: newTaskId,
    projectId: targetProjectId,
    stageId: targetStageId,
    title: sub.title,
    assignee: sub.assignee || '',
    description: sub.description || '',
    dueDate: sub.dueDate || '',
    priority: 'Medium',
    status: sub.status || 'To do',
    billableOverride: 'inherit',
    category: sub.category || 'Administrative',
    externalRef: sub.externalRef || '',
    blockedByTaskId: sub.blockedByTaskId || '',
    learningProgress: Number(sub.learningProgress || 0),
    plannedDate: sub.plannedDate || '',
    plannedStartTime: sub.plannedStartTime || '',
    estimatedHours: Number(sub.estimatedHours || 0),
    icsUid: sub.icsUid || '',
    subtasks: []
  };

  // Re-link any existing time entries or active timer from the subtask to the new task
  state.timeEntries.forEach(entry => {
    if (entry.taskId === taskId && entry.subtaskId === subId) {
      entry.projectId = targetProjectId;
      entry.taskId = newTaskId;
      entry.subtaskId = null;
    }
  });
  if (state.activeTimer && state.activeTimer.taskId === taskId && state.activeTimer.subtaskId === subId) {
    state.activeTimer.taskId = newTaskId;
    state.activeTimer.subtaskId = null;
  }

  parentTask.subtasks.splice(subIdx, 1);
  state.tasks.unshift(newTask);
  saveState();
  closeModal();
  render();
  const proj = getProject(targetProjectId);
  showToast(`Moved to ${proj ? proj.name : 'project'}`);
}

function saveAssigneeForm(e, assigneeId) {
  e.preventDefault();
  const newName = (document.getElementById('asgName')?.value || '').trim();
  const team = (document.getElementById('asgTeam')?.value || '').trim();
  const email = (document.getElementById('asgEmail')?.value || '').trim();
  const leftOrg = Boolean(document.getElementById('asgLeftOrg')?.checked);

  if (!newName) return;

  const duplicate = state.assignees.find(x => x.id !== assigneeId && (x.name || '').trim().toLowerCase() === newName.toLowerCase());
  if (duplicate) {
    alert(`An assignee named "${duplicate.name}" already exists.`);
    return;
  }

  if (assigneeId) {
    const existing = state.assignees.find(x => x.id === assigneeId);
    if (!existing) return;
    const oldName = (existing.name || '').trim();
    if (oldName && oldName !== newName) {
      // Cascade rename across all tasks, subtasks, and active filters
      state.tasks.forEach(t => {
        if ((t.assignee || '').trim().toLowerCase() === oldName.toLowerCase()) t.assignee = newName;
        (t.subtasks || []).forEach(s => {
          if ((s.assignee || '').trim().toLowerCase() === oldName.toLowerCase()) s.assignee = newName;
        });
      });
      if (Array.isArray(state.ui.taskFilters.assignees)) {
        state.ui.taskFilters.assignees = state.ui.taskFilters.assignees.map(x => x.toLowerCase() === oldName.toLowerCase() ? newName : x);
      }
    }
    existing.name = newName;
    existing.team = team;
    existing.email = email;
    existing.leftOrg = leftOrg;
    showToast('Assignee updated');
  } else {
    state.assignees.push({ id: uid('asg'), name: newName, team, email, leftOrg });
    showToast('Assignee added');
  }
  saveState();
  closeModal();
  render();
}

function toggleAssigneeLeftOrg(assigneeId) {
  const a = state.assignees.find(x => x.id === assigneeId);
  if (!a) return;
  a.leftOrg = !a.leftOrg;
  saveState();
  render();
  showToast(a.leftOrg ? `${a.name} marked as left organisation` : `${a.name} restored as active`);
}

function deleteAssigneeRecord(assigneeId) {
  const a = state.assignees.find(x => x.id === assigneeId);
  if (!a) return;
  const st = computeAssigneeStats(n => n.toLowerCase() === a.name.toLowerCase(), todayStr());
  const msg = st.total > 0
    ? `Remove "${a.name}" from the directory and unassign their ${st.total} task(s)/subtask(s) back to Me?`
    : `Remove "${a.name}" from the directory?`;
  if (!confirm(msg)) return;
  if (st.total > 0) {
    state.tasks.forEach(t => {
      if ((t.assignee || '').trim().toLowerCase() === a.name.toLowerCase()) t.assignee = '';
      (t.subtasks || []).forEach(s => {
        if ((s.assignee || '').trim().toLowerCase() === a.name.toLowerCase()) s.assignee = '';
      });
    });
  }
  state.assignees = state.assignees.filter(x => x.id !== assigneeId);
  if (Array.isArray(state.ui.taskFilters.assignees)) {
    state.ui.taskFilters.assignees = state.ui.taskFilters.assignees.filter(x => x.toLowerCase() !== a.name.toLowerCase());
  }
  saveState();
  render();
  showToast('Assignee removed');
}

function extractHashtagsFromNote(note) {
  const tags = [];
  const seen = new Set();
  const pushTag = (raw) => {
    const clean = String(raw || '').trim().replace(/^#+/, '').toLowerCase();
    if (!clean || /^\d+$/.test(clean) || seen.has(clean)) return;
    seen.add(clean);
    tags.push(clean);
  };

  if (Array.isArray(note?.tags)) {
    note.tags.forEach(pushTag);
  }
  const plainText = `${note?.title || ''} ${(note?.body || '').replace(/<[^>]+>/g, ' ')}`;
  const matches = plainText.match(/#[A-Za-z][A-Za-z0-9_-]{0,30}/g) || [];
  matches.forEach(pushTag);
  return tags;
}

function getAllNoteHashtags() {
  const counts = {};
  (state.notes || []).forEach(n => {
    extractHashtagsFromNote(n).forEach(tag => {
      counts[tag] = (counts[tag] || 0) + 1;
    });
  });
  return Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

function getFilteredNotes() {
  const q = (state.ui.noteSearch || '').trim().toLowerCase();
  const activeTag = (state.ui.noteHashtag || '').trim().replace(/^#+/, '').toLowerCase();

  return (state.notes || []).filter(n => {
    const noteTags = extractHashtagsFromNote(n);
    if (activeTag && !noteTags.includes(activeTag)) return false;
    if (!q) return true;
    const hay = `${n.title || ''} ${(n.body || '').replace(/<[^>]+>/g, ' ')} ${noteTags.map(t => '#' + t + ' ' + t).join(' ')}`.toLowerCase();
    return hay.includes(q);
  });
}

function toggleNoteHashtagFilter(tag) {
  const clean = String(tag || '').replace(/^#+/, '').toLowerCase();
  state.ui.noteHashtag = (state.ui.noteHashtag === clean) ? '' : clean;
  render();
}

function formatNoteBodyWithHashtags(html) {
  const sanitized = sanitizeNoteHtml(html);
  const container = document.createElement('div');
  container.innerHTML = sanitized;

  function walk(node) {
    if (node.nodeType === 3) {
      const text = node.nodeValue || '';
      if (!/#[A-Za-z][A-Za-z0-9_-]{0,30}/.test(text)) return;
      const frag = document.createDocumentFragment();
      const regex = /(#[A-Za-z][A-Za-z0-9_-]{0,30})/g;
      let lastIndex = 0;
      let match;
      while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        }
        const tagRaw = match[1];
        const tagName = tagRaw.slice(1).toLowerCase();
        const span = document.createElement('span');
        span.className = 'hashtag-chip';
        span.setAttribute('onclick', `event.stopPropagation();toggleNoteHashtagFilter('${tagName.replace(/'/g, "\'")}')`);
        span.setAttribute('title', `Filter notes by ${tagRaw}`);
        span.textContent = tagRaw;
        frag.appendChild(span);
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      }
      if (node.parentNode) node.parentNode.replaceChild(frag, node);
      return;
    }
    if (node.nodeType === 1) {
      const children = Array.from(node.childNodes);
      children.forEach(walk);
    }
  }

  Array.from(container.childNodes).forEach(walk);
  return container.innerHTML;
}
